            </div>

            <div className={`bg-white border rounded p-3 ${overdue ? "border-rose-200" : "border-slate-200"}`}>
              <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Delivery Target (डिलीवरी तारीख)</div>
              <div className={`text-[14px] font-semibold ${overdue ? "text-rose-700" : "text-slate-900"}`}>{jc.dueDate}{overdue ? " — Overdue" : ""}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Est. gross weight: {item?.estGrossWeight}g</div>
            </div>

            <div className="bg-white border border-slate-200 rounded">
              <div className="px-3 py-2 bg-slate-50/60 border-b border-slate-100 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Costing Summary (लागत सारांश)</div>
              <Field label="Current silver weight (चांदी का वज़न)" value={t.currentWeight > 0 ? `${gm(t.currentWeight)} @ ${t.currentPurity}` : "Not issued yet"} mono />
              {stoneGrams > 0 && <Field label="Stone weight (net, set in piece)" value={gm(stoneGrams)} mono />}
              {stoneGrams > 0 && <Field label="Gross weight (silver + stones)" value={gm(gw)} mono strong />}
              <Field label={`Pure-silver equivalent (${pureTierLabel(tiers)})`} value={t.currentWeight > 0 ? gm(t.pureEq) : "—"} mono strong />
              <Field label="Silver material value" value={money(silverValue)} mono strong warn={false} />
              <Field label="Total labour accrued (मज़दूरी)" value={money(t.labour)} mono strong />
              <Field label="Stone value issued" value={money(t.stonesIssued)} mono />
              <Field label="Unused stones returned" value={money(t.stonesReturned)} mono />
              <Field label="Net stone value consumed" value={money(t.stonesConsumed)} mono strong />
              <div className="px-3 py-2 border-t border-slate-100 flex items-center justify-between">
                <span className="text-[12px] font-semibold text-slate-700">Estimated cost to date (कुल लागत)</span>
                <span className="text-[14px] font-mono-num font-bold text-blue-900">{money(t.labour + t.stonesConsumed + (jc.manualSilverValue != null ? jc.manualSilverValue : silverValue))}</span>
              </div>
              <div className="border-t border-slate-100">
                <button onClick={() => setShowBreakdown(v => !v)} className="w-full px-3 py-2 flex items-center justify-between text-[11px] text-blue-800 hover:bg-slate-50">
                  <span className="font-medium">Material Breakdown — net metal &amp; stones</span>
                  <Icon name="chevronDown" className={`w-3.5 h-3.5 transition-transform ${showBreakdown ? "rotate-180" : ""}`} />
                </button>
                {showBreakdown && (
                  <div className="px-3 pb-3 space-y-2">
                    <div className="bg-slate-50 border border-slate-100 rounded p-2">
                      <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Net Metal (नेट धातु)</div>
                      <div className="flex items-center justify-between text-[12px]">
                        <span className="text-slate-600">Silver, {t.currentPurity}</span>
                        <span className="font-mono-num text-slate-900">{gm(t.currentWeight)}</span>
                      </div>
                      <div className="flex items-center justify-between text-[12px] mt-0.5">
                        <span className="text-slate-600">Value @ {pureTierLabel(tiers)} production rate</span>
                        <span className="font-mono-num font-semibold text-slate-900">{money(silverValue)}</span>
                      </div>
                      <div className="flex items-center justify-between text-[12px] mt-1.5 pt-1.5 border-t border-slate-200">
                        <span className="text-slate-600">Silver value (मूल्य) — manual override</span>
                        <input type="number" step="1" placeholder={Math.round(silverValue)} value={jc.manualSilverValue ?? ""} onChange={e => onUpdateMeta(jc.id, { manualSilverValue: e.target.value === "" ? null : parseFloat(e.target.value) })} className="w-24 h-6 px-1.5 border border-slate-200 rounded text-[11px] font-mono-num text-right" />
                      </div>
                      <div className="flex items-center justify-between text-[12px] mt-1">
                        <span className="text-slate-600">Today's silver rate (आज की दर, ₹/g)</span>
                        <input type="number" step="0.5" placeholder={baseRate} value={jc.todaysSilverRate ?? ""} onChange={e => onUpdateMeta(jc.id, { todaysSilverRate: e.target.value === "" ? null : parseFloat(e.target.value) })} className="w-24 h-6 px-1.5 border border-slate-200 rounded text-[11px] font-mono-num text-right" />
                      </div>
                      <div className="flex items-center justify-between text-[12px] mt-1 pt-1 border-t border-slate-200 font-semibold">
                        <span className="text-slate-700">Today's sale value (आज बेचने पर)</span>
                        <span className="font-mono-num text-emerald-700">{money(accumulatedPureEq(jc, tiers) * (jc.todaysSilverRate || baseRate) + t.stonesConsumed)}</span>
                      </div>
                    </div>
                    {stoneBreakdown.length > 0 && (
                      <div className="bg-slate-50 border border-slate-100 rounded p-2">
                        <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Stones (net, set in piece)</div>
                        {stoneBreakdown.map((s, i) => (
                          <div key={i} className="flex items-center justify-between text-[12px] py-0.5">
                            <span className="text-slate-600">{s.type} {s.carat > 0 ? `— ${s.carat.toFixed(3)} ct` : ""}</span>
                            <span className="font-mono-num font-semibold text-slate-900">{money(s.value)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    {stoneBreakdown.length === 0 && <p className="text-[11px] text-slate-400">Koi stone abhi tak set nahi hui.</p>}
                  </div>
                )}
              </div>
            </div>

            {jc.activity && jc.activity.length > 0 && (
              <div className="bg-white border border-slate-200 rounded">
                <div className="px-3 py-2 bg-slate-50/60 border-b border-slate-100 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Activity Timeline (गतिविधि)</div>
                <div className="max-h-64 overflow-y-auto">
                  {[...jc.activity].reverse().map((log, i) => (
                    <div key={i} className="px-3 py-2 text-[11px] border-b border-slate-50 last:border-b-0">
                      <div className="text-slate-400 font-mono-num">{log.date}</div>
                      <div className="text-slate-700">{log.text}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      {modal && modal.type === "reopen" && (
        <ReopenModal jc={jc} onClose={() => setModal(null)} onReopen={(auditData) => { onReopenJobCard(jc.id, auditData); setModal(null); }} />
      )}
    </div>
  );
}

/* ============================== ITEM MASTER VIEW ============================== */

  return (

          <h1 className="text-[22px] font-semibold text-slate-900 tracking-tight">Item Master <span className="text-slate-400 font-normal text-[14px]">· आइटम मास्टर</span></h1>
          <p className="text-[11px] text-slate-500 mt-0.5">{itemMaster.length} products in catalogue · reused across job cards for repeat batches</p>
        </div>
        <div className="flex items-center gap-2">
          <div className="relative">
            <Icon name="search" className="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
            <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search products…" className="h-8 w-60 pl-8 pr-2 rounded border border-slate-200 text-[12px] outline-none focus:border-amber-400" />
          </div>
          <button onClick={() => setShowCreate(true)} className="h-8 px-3 rounded bg-amber-800 text-white text-[12px] font-medium hover:bg-amber-900 flex items-center gap-1.5 shadow-sm">
            <Icon name="plus" className="w-3.5 h-3.5" /> New Product
          </button>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto p-5 bg-slate-50">
        {visible.length === 0 ? (
          <div className="py-20 text-center">
            <p className="text-[13px] text-slate-500">No products match "{query}"</p>

        ) : (
          <div className="grid grid-cols-4 gap-4">
            {visible.map(item => {
              const count = jcCount(item.id);
              return (
                <div key={item.id} onClick={() => onOpen(item.id)}
                  className="group bg-white border border-slate-200 rounded-lg overflow-hidden cursor-pointer transition-all hover:border-amber-300 hover:shadow-md">
                  <div className="relative">
                    <ItemImage imageUrl={item.imageUrl} category={item.category} className="h-44 w-full object-cover" />
                    {item.designCode && (
                      <span className="absolute top-2 left-2 bg-white/95 backdrop-blur-sm border border-slate-200 rounded px-1.5 py-0.5 text-[10px] font-mono-num text-slate-700 shadow-sm">{item.designCode}</span>
                    )}
                  </div>
                  <div className="p-3">
                    <div className="text-[13px] font-medium text-slate-900 leading-snug line-clamp-2 group-hover:text-amber-800 transition-colors">{item.name}</div>
                    <div className="flex items-center gap-1.5 mt-1.5">
                      <span className="inline-flex items-center h-5 px-1.5 rounded border border-slate-200 bg-slate-50 text-[10px] text-slate-600">{item.category}</span>
                      <span className="text-[10px] font-mono-num text-slate-400">{item.targetPurity}</span>
                    </div>
                    <div className="flex items-center justify-between mt-2.5 pt-2.5 border-t border-slate-100">
                      <span className="text-[11px] text-slate-500 font-mono-num">Est. {item.estGrossWeight}g</span>
                      <span className={`text-[10px] font-mono-num px-1.5 h-5 rounded border flex items-center ${count > 0 ? "bg-amber-50 text-amber-800 border-amber-200" : "bg-slate-50 text-slate-400 border-slate-200"}`}>
                        {count} job card{count === 1 ? "" : "s"}

                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
      {showCreate && <ItemMasterModal tiers={tiers} onClose={() => setShowCreate(false)} onCreate={(data) => { onCreate(data); setShowCreate(false); }} />}

  );

                  <thead>
                    <tr className="h-8 border-b border-slate-100 text-left bg-slate-50/40">
                      <th className="px-4 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Job No.</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Stage</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Due Date</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold text-right">Pieces</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Status</th>
                      <th className="w-8" />
                    </tr>
                  </thead>
                  <tbody>
                    {associated.map(jc => {
                      const t = jcTotals(jc, tiers);
                      return (
                        <tr key={jc.id} onClick={() => onOpenJobCard(jc.id)} className="h-10 border-b border-slate-50 last:border-b-0 cursor-pointer hover:bg-amber-50/40">
                          <td className="px-4 text-[12px] font-mono-num text-blue-800 font-medium">{jc.id}</td>
                          <td className="px-3 text-[12px] text-slate-700">
                            {t.activeStage ? (
                              <span className="flex items-center gap-1.5"><Icon name={STAGE_ICON[t.activeStage]} className="w-3 h-3 text-slate-400" />{t.activeStage}</span>
                            ) : <span className="text-slate-400">Not issued</span>}
                          </td>
                          <td className="px-3 text-[12px] font-mono-num text-slate-600">{jc.dueDate}</td>
                          <td className="px-3 text-[12px] font-mono-num text-slate-700 text-right">{jc.pieceCount ?? "—"}</td>
                          <td className="px-3"><StatusPill status={jc.status} /></td>
                          <td className="px-3 text-right"><Icon name="chevronRight" className="w-3.5 h-3.5 text-slate-300" /></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          <div className="space-y-4">
            <div className="bg-white border border-slate-200 rounded-lg overflow-hidden">
              <div className="px-4 py-2.5 bg-slate-50/60 border-b border-slate-100 text-[10px] uppercase tracking-wider text-slate-400 font-semibold flex items-center gap-1.5">
                <Icon name="image" className="w-3.5 h-3.5" /> Product Image · फोटो
              </div>
              <div className="p-3">
                <ItemImage imageUrl={item.imageUrl} category={item.category} className="w-full h-56 rounded-md object-cover border border-slate-100" />
                <input placeholder="Paste image URL…" value={item.imageUrl || ""} onChange={e => onUpdateItem(item.id, { imageUrl: e.target.value })} className={`${inputCls} mt-2.5`} />
              </div>
            </div>

            <div className="bg-white border border-slate-200 rounded-lg overflow-hidden">
              <div className="px-4 py-2.5 bg-slate-50/60 border-b border-slate-100 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Catalogue Stats</div>
              <Field label="Total job cards" value={associated.length} mono strong />
              <Field label="Active production" value={activeCount} mono />
              <Field label="Completed & closed" value={closedCount} mono />
              <Field label="Created" value={item.createdAt} mono />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================== APP ============================== */
function App() {
  const [jobCards, setJobCards] = useState(SEED_JOB_CARDS);
  const [itemMaster, setItemMaster] = useState(SEED_ITEM_MASTER);
  const [karigars, setKarigars] = useState(SEED_KARIGARS);
  const [bulkIssues, setBulkIssues] = useState(SEED_BULK_ISSUES);
  const [purityTiers, setPurityTiers] = useState(DEFAULT_PURITY_TIERS);
  const [baseRate, setBaseRate] = useState(DEFAULT_BASE_RATE);
  const [defaultRates, setDefaultRates] = useState(DEFAULT_RATES);
  const [collapsed, setCollapsed] = useState(false);
  const [view, setView] = useState("jobcards");
  const [jobCardDetailId, setJobCardDetailId] = useState(null);
  const [itemMasterDetailId, setItemMasterDetailId] = useState(null);
  const [activeTab, setActiveTab] = useState("all");
  const [query, setQuery] = useState("");
  const [selectedKarigarId, setSelectedKarigarId] = useState("k1");
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [showNewJC, setShowNewJC] = useState(false);
  const [showCreateKarigar, setShowCreateKarigar] = useState(false);
  const [editingKarigar, setEditingKarigar] = useState(null);
  const filterRef = useRef(null);

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); setPaletteOpen(v => !v); }
      if (e.key === "Escape") setPaletteOpen(false);
      if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); filterRef.current && filterRef.current.focus(); }
      if (e.key === "[" && !e.metaKey) setCollapsed(v => !v);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  function log(jc, text) { return { ...jc, activity: [...(jc.activity || []), { date: TODAY, text }] }; }

  function createItemMasterEntry(data) {
    const id = nextItemMasterId(itemMaster);
    setItemMaster(prev => [...prev, { id, ...data }]);
    return id;
  }
  function updateItemMaster(itemId, patch) {
    setItemMaster(prev => prev.map(i => i.id === itemId ? { ...i, ...patch } : i));
  }

  function createJobCardFromExisting({ itemMasterId, dueDate, notes }) {
    const item = itemMaster.find(i => i.id === itemMasterId);
    const id = nextJobCardId(jobCards);
    const newJC = { id, itemMasterId, targetPurity: item ? item.targetPurity : purityTiers[1]?.label, status: "Draft",
      createdAt: TODAY, dueDate, closedAt: null, notes, activity: [{ date: TODAY, text: `Job card created from Item Master (${item?.name})` }],
      stages: emptyStages() };
    setJobCards(prev => [...prev, newJC]);
    setShowNewJC(false); setView("jobcards"); setJobCardDetailId(id);
  }
  function createJobCardWithNewItem({ newItem, dueDate, notes }) {
    const itemId = createItemMasterEntry(newItem);
    const id = nextJobCardId(jobCards);
    const newJC = { id, itemMasterId: itemId, targetPurity: newItem.targetPurity, status: "Draft",
      createdAt: TODAY, dueDate, closedAt: null, notes, activity: [{ date: TODAY, text: `Job card created — new design registered (${newItem.name})` }],
      stages: emptyStages() };
    setJobCards(prev => [...prev, newJC]);
    setShowNewJC(false); setView("jobcards"); setJobCardDetailId(id);
  }

  function updateJobCardMeta(jcId, patch) { setJobCards(prev => prev.map(j => j.id === jcId ? { ...j, ...patch } : j)); }

  function mutateStage(jcId, stageName, fn) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      const stages = j.stages.map(s => s.stage === stageName ? fn(s) : s);
      return { ...j, stages };
    }));
  }
  function mutateAssignment(jcId, stageName, assignmentId, fn) {
    mutateStage(jcId, stageName, s => ({ ...s, assignments: s.assignments.map(a => a.id === assignmentId ? fn(a) : a) }));
  }

  function addAssignment(jcId, stageName, karigarName) {
    const aid = "a" + Date.now();
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      updated.stages = updated.stages.map(s => s.stage === stageName
        ? { ...s, status: s.status === "Pending" ? "In Progress" : s.status, assignments: [...s.assignments, { id: aid, karigar: karigarName, issues: [], stones: [], labour: [] }] }
        : s);
      if (updated.status === "Draft") updated.status = "In Production";
      updated = log(updated, `${karigarName} assigned to ${stageName}`);
      return updated;
    }));
  }
  function issueMaterial(jcId, stageName, assignmentId, data) {
    const iid = "i" + Date.now();
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => a.id !== assignmentId ? a : {
          ...a, issues: [...a.issues, { id: iid, material: data.material, purity: data.purity, issuedWeight: data.issuedWeight, issueDate: TODAY, status: "Issued", returnedWeight: null, returnedPurity: null, returnDate: null, dustWeight: null, issuedPieceCount: data.pieceCount }]
        })
      });
      updated = log(updated, `${gm(data.issuedWeight)} @ ${data.purity} issued for ${stageName}`);
      return updated;
    }));
  }
  function reconcileMaterial(jcId, stageName, assignmentId, issueId, data) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      let autoLabour = null;
      if (data.wastagePercent != null) {
        autoLabour = {
          id: "l" + Date.now(), basis: "Wastage %", qty: data.returnedWeight, rate: data.wastagePercent, purity: data.returnedPurity,
          amount: computeLabourAmount("Wastage %", data.returnedWeight, data.wastagePercent, data.returnedPurity, purityTiers, baseRate),
          note: `${data.wastagePercent}% wastage × ${data.returnedWeight.toFixed(3)}g recovered @${data.returnedPurity} (auto-charged on reconcile)`,
        };
      } else if (data.ratePerGm != null) {
        autoLabour = {
          id: "l" + Date.now(), basis: "Per Gram", qty: data.returnedWeight, rate: data.ratePerGm, amount: +(data.returnedWeight * data.ratePerGm).toFixed(2),
          note: `₹${data.ratePerGm}/gm × ${data.returnedWeight.toFixed(3)}g finished weight (net of dust, auto-charged on reconcile)`,
        };
      } else if (data.flatLabourAmount != null) {
        autoLabour = {
          id: "l" + Date.now(), basis: "Flat", qty: 1, rate: data.flatLabourAmount, amount: data.flatLabourAmount,
          note: `Flat labour (auto-charged on reconcile)`,
        };
      }
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => a.id !== assignmentId ? a : {
          ...a,
          issues: a.issues.map(i => i.id !== issueId ? i : { ...i, status: "Reconciled", returnedWeight: data.returnedWeight, returnedPurity: data.returnedPurity, dustWeight: data.dustWeight, returnDate: TODAY, pieceCount: data.pieceCount != null ? data.pieceCount : i.pieceCount, labourEntryId: autoLabour ? autoLabour.id : i.labourEntryId }),
          labour: autoLabour ? [...a.labour, autoLabour] : a.labour,
        })
      });
      updated = log(updated, autoLabour
        ? `${stageName} reconciled — ${gm(data.returnedWeight)} @ ${data.returnedPurity} finished, labour auto-charged (${money(autoLabour.amount)}) in karigar's ledger`
        : `${stageName} reconciled — ${gm(data.returnedWeight)} @ ${data.returnedPurity} returned`);
      return updated;
    }));
  }
  function editReconcile(jcId, stageName, assignmentId, issueId, data) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => {
          if (a.id !== assignmentId) return a;
          const targetIssue = a.issues.find(i => i.id === issueId);
          let labour = a.labour;
          let labourEntryId = targetIssue?.labourEntryId;
          if (data.ratePerGm != null) {
            const amount = +(data.returnedWeight * data.ratePerGm).toFixed(2);
            const note = `₹${data.ratePerGm}/gm × ${data.returnedWeight.toFixed(3)}g finished weight (net of dust, edited)`;
            if (labourEntryId && labour.some(l => l.id === labourEntryId)) {
              labour = labour.map(l => l.id === labourEntryId ? { ...l, qty: data.returnedWeight, rate: data.ratePerGm, amount, note } : l);
            } else {
              labourEntryId = "l" + Date.now();
              labour = [...labour, { id: labourEntryId, basis: "Per Gram", qty: data.returnedWeight, rate: data.ratePerGm, amount, note }];
            }
          } else if (data.flatLabourAmount != null) {
            const amount = data.flatLabourAmount;
            const note = `Flat labour (edited)`;
            if (labourEntryId && labour.some(l => l.id === labourEntryId)) {
              labour = labour.map(l => l.id === labourEntryId ? { ...l, qty: 1, rate: amount, amount, note } : l);
            } else {
              labourEntryId = "l" + Date.now();
              labour = [...labour, { id: labourEntryId, basis: "Flat", qty: 1, rate: amount, amount, note }];
            }
          }
          return {
            ...a,
            issues: a.issues.map(i => i.id !== issueId ? i : { ...i, returnedWeight: data.returnedWeight, returnedPurity: data.returnedPurity, dustWeight: data.dustWeight, pieceCount: data.pieceCount != null ? data.pieceCount : i.pieceCount, labourEntryId }),
            labour,
          };
        })
      });
      updated = log(updated, `${stageName} output corrected — ${gm(data.returnedWeight)} @ ${data.returnedPurity}${data.pieceCount != null ? ` (${data.pieceCount} pcs)` : ""}`);
      return updated;
    }));
  }
  function cancelReconcile(jcId, stageName, assignmentId, issueId) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => {
          if (a.id !== assignmentId) return a;
          const targetIssue = a.issues.find(i => i.id === issueId);
          const labour = targetIssue?.labourEntryId ? a.labour.filter(l => l.id !== targetIssue.labourEntryId) : a.labour;
          return {
            ...a,
            issues: a.issues.map(i => i.id !== issueId ? i : { ...i, status: "Issued", returnedWeight: null, returnedPurity: null, dustWeight: null, returnDate: null, pieceCount: null, labourEntryId: null }),
            labour,
          };
        })
      });
      updated = log(updated, `${stageName} reconciliation cancelled — reverted to pending`);
      return updated;
    }));
  }
  function recordCastOutput(jcId, stageName, assignmentId, data) {
    const iid = "i" + Date.now();
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      const assignmentKarigar = (j.stages.find(s => s.stage === stageName)?.assignments || []).find(a => a.id === assignmentId)?.karigar || "";
      let updated = { ...j, pieceCount: data.pieceCount };
      const totalWeight = +(data.returnedWeight + data.wastageWeight).toFixed(3);
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, status: "In Progress",
        assignments: s.assignments.map(a => a.id !== assignmentId ? a : {
          ...a,
          issues: [...a.issues, { id: iid, material: "Silver", purity: null, issuedWeight: null, issueDate: TODAY, status: "Reconciled",
            returnedWeight: data.returnedWeight, returnedPurity: data.returnedPurity, dustWeight: 0,
            wastagePercent: data.wastagePercent, wastageWeight: data.wastageWeight, returnDate: TODAY, fromBulkStock: true, pieceCount: data.pieceCount }],
        })
      });
      updated = log(updated, `Casting output recorded — ${gm(data.returnedWeight)} @ ${data.returnedPurity} (${data.pieceCount} pcs) + ${gm(data.wastageWeight)} wastage (${data.wastagePercent}%) = ${gm(totalWeight)} deducted from ${assignmentKarigar}'s running stock`);
      return updated;
    }));
  }
  function recordJadaiOutput(jcId, stageName, assignmentId, data) {
    const iid = "i" + Date.now();
    const pureLabel = pureTierLabel(purityTiers);
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      const assignmentKarigar = (j.stages.find(s => s.stage === stageName)?.assignments || []).find(a => a.id === assignmentId)?.karigar || "";
      let updated = { ...j, pieceCount: data.pieceCount };
      const autoLabour = data.labourAmount > 0 ? {
        id: "l" + Date.now(), basis: "Flat", qty: 1, rate: data.labourAmount, amount: data.labourAmount,
        note: `Manual labour entry (from bulk stock)`,
      } : null;
      const newStones = data.stones.map((s, idx) => ({
        id: "s" + Date.now() + idx, type: s.name, qtyIssued: `${s.pieces} pcs / ${s.carat} ct`, valueIssued: s.finalAmount,
        piecesCount: s.pieces, carat: s.carat, ratePerCarat: s.rate, qtyReturned: "", valueReturned: 0,
      }));
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, status: "In Progress",
        assignments: s.assignments.map(a => a.id !== assignmentId ? a : {
          ...a,
          issues: [...a.issues, { id: iid, material: "Silver", purity: null, issuedWeight: null, issueDate: TODAY, status: "Reconciled",
            returnedWeight: data.weight, returnedPurity: pureLabel, dustWeight: 0, returnDate: TODAY, fromBulkStock: true, pieceCount: data.pieceCount }],
          stones: [...a.stones, ...newStones],
          labour: autoLabour ? [...a.labour, autoLabour] : a.labour,
        })
      });
      const stoneSummary = newStones.map(s => `${s.type} ${s.piecesCount}pcs/${s.carat}ct (${money(s.valueIssued)})`).join(", ");
      updated = log(updated, `Jadai output recorded — ${gm(data.weight)} @ ${pureLabel} (${data.pieceCount} pcs), labour ${money(data.labourAmount)}${stoneSummary ? ", " + stoneSummary : ""}, deducted from ${assignmentKarigar}'s running stock`);
      return updated;
    }));
  }
  function recordFittingOutput(jcId, stageName, assignmentId, data) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      const assignmentKarigar = (j.stages.find(s => s.stage === stageName)?.assignments || []).find(a => a.id === assignmentId)?.karigar || "";
      let updated = { ...j, pieceCount: data.pieceCount };
      const findingIssues = data.findings.map((f, idx) => ({
        id: "i" + Date.now() + idx, material: "Silver", purity: null, issuedWeight: null, issueDate: TODAY, status: "Reconciled",
        returnedWeight: f.weight, returnedPurity: f.karat, dustWeight: 0, returnDate: TODAY, fromBulkStock: true,
      }));
      const autoLabour = data.labourAmount > 0 ? {
        id: "l" + Date.now(), basis: "Flat", qty: 1, rate: data.labourAmount, amount: data.labourAmount, note: `Flat labour (Fitting)`,
      } : null;
      const flatItems = data.items.map((it, idx) => ({
        id: "s" + Date.now() + idx, type: it.type, qtyIssued: it.carat > 0 ? `flat / ${it.carat} ct` : "flat", valueIssued: it.amount, carat: it.carat || 0, qtyReturned: "", valueReturned: 0,
      }));
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, status: "In Progress",
        assignments: s.assignments.map(a => a.id !== assignmentId ? a : {
          ...a,
          issues: [...a.issues, ...findingIssues],
          stones: [...a.stones, ...flatItems],
          labour: autoLabour ? [...a.labour, autoLabour] : a.labour,
        })
      });
      const findingsSummary = data.findings.map(f => `${f.type} ${f.weight}g@${f.karat}`).join(", ");
      updated = log(updated, `Fitting output recorded (${data.pieceCount} pcs)${findingsSummary ? " — " + findingsSummary : ""}${data.labourAmount > 0 ? `, labour ${money(data.labourAmount)}` : ""}, deducted from ${assignmentKarigar}'s running stock`);
      return updated;
    }));
  }
  function addLabour(jcId, stageName, assignmentId, entry) {
    const lid = "l" + Date.now();
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => a.id !== assignmentId ? a : { ...a, labour: [...a.labour, { id: lid, ...entry }] })
      });
      updated = log(updated, `Labour added on ${stageName} — ${money(entry.amount)}`);
      return updated;
    }));
  }
  function removeLabour(jcId, stageName, assignmentId, labourId) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      const stages = j.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => a.id !== assignmentId ? a : { ...a, labour: a.labour.filter(l => l.id !== labourId) })
      });
      return { ...j, stages };
    }));
  }
  function issueStones(jcId, stageName, assignmentId, data) {
    const sid = "s" + Date.now();
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      updated.stages = updated.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => a.id !== assignmentId ? a : { ...a, stones: [...a.stones, { id: sid, ...data, qtyReturned: "", valueReturned: 0 }] })
      });
      updated = log(updated, `Stones issued on ${stageName} — ${data.type} (${money(data.valueIssued)})`);
      return updated;
    }));
  }
  function returnStones(jcId, stageName, assignmentId, stoneId, data) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      const stages = j.stages.map(s => s.stage !== stageName ? s : {
        ...s, assignments: s.assignments.map(a => a.id !== assignmentId ? a : { ...a, stones: a.stones.map(st => st.id !== stoneId ? st : { ...st, ...data }) })
      });
      return { ...j, stages };
    }));
  }
  function approveStage(jcId, stageName) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      let updated = { ...j };
      updated.stages = updated.stages.map(s => s.stage === stageName ? { ...s, status: "Approved", approvedDate: TODAY } : s);
      updated = log(updated, `${stageName} stage approved`);
      return updated;
    }));
  }
  function closeJobCard(jcId) {
    setJobCards(prev => prev.map(j => j.id !== jcId ? j : log({ ...j, status: "Closed", closedAt: TODAY }, "Job card closed — all stages approved")));
  }
  function toggleHold(jcId) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      if (j.status === "On Hold") return log({ ...j, status: "In Production", holdReason: undefined }, "Resumed from hold");
      return log({ ...j, status: "On Hold", holdReason: j.holdReason || "Put on hold by admin" }, "Put on hold");
    }));
  }
  function reopenJobCard(jcId, auditData) {
    setJobCards(prev => prev.map(j => {
      if (j.id !== jcId) return j;
      const logEntry = { date: TODAY, reason: auditData.reason, approvedBy: auditData.approvedBy, reversedFromClosedAt: j.closedAt };
      return log({ ...j, status: "In Production", closedAt: null, reversalLog: [...(j.reversalLog || []), logEntry] }, `Reopened (audited) by ${auditData.approvedBy}`);
    }));
  }
  function createKarigar(data) {
    const id = "k" + Date.now();
    setKarigars(prev => [...prev, { id, ...data, createdAt: TODAY }]);
    setShowCreateKarigar(false); setSelectedKarigarId(id);
  }
  function editKarigar(karigarId, data) {
    setKarigars(prev => prev.map(k => k.id === karigarId ? { ...k, ...data } : k));
  }
  function issueBulkStock(karigarName, data) {
    setBulkIssues(prev => [...prev, { id: "b" + Date.now(), karigar: karigarName, purity: data.purity, weight: data.weight, date: TODAY, note: data.note }]);
  }
  function addTier() { setPurityTiers(prev => [...prev, { id: "t" + Date.now(), label: "New", percent: 50 }]); }
  function updateTier(id, field, value) { setPurityTiers(prev => prev.map(t => t.id === id ? { ...t, [field]: field === "percent" ? (parseFloat(value) || 0) : value } : t)); }
  function removeTier(id) { setPurityTiers(prev => prev.filter(t => t.id !== id)); }

  const ledger = useMemo(() => buildLedger(jobCards, purityTiers, bulkIssues), [jobCards, purityTiers, bulkIssues]);
  const itemMasterMap = useMemo(() => Object.fromEntries(itemMaster.map(i => [i.id, i])), [itemMaster]);
  const rowsWithTotals = useMemo(() => jobCards.map(j => ({ jc: j, item: itemMasterMap[j.itemMasterId], t: jcTotals(j, purityTiers) })), [jobCards, purityTiers, itemMasterMap]);

  const visible = useMemo(() => {
    let out = rowsWithTotals;
    if (activeTab !== "all") out = out.filter(r => r.jc.status === activeTab);
    if (query.trim()) {
      const q = query.toLowerCase();
      out = out.filter(r => r.jc.id.toLowerCase().includes(q) || (r.item && r.item.name.toLowerCase().includes(q)) || (r.item && (r.item.designCode || "").toLowerCase().includes(q)));
    }
    return [...out].sort((a, b) => a.jc.dueDate.localeCompare(b.jc.dueDate));
  }, [rowsWithTotals, activeTab, query]);

  const tabCounts = useMemo(() => { const c = { all: jobCards.length }; jobCards.forEach(j => { c[j.status] = (c[j.status] || 0) + 1; }); return c; }, [jobCards]);

  const kpi = useMemo(() => {
    const totalLabour = rowsWithTotals.reduce((s, r) => s + r.t.labour, 0);
    const totalStonesConsumed = rowsWithTotals.reduce((s, r) => s + r.t.stonesConsumed, 0);
    const openJC = jobCards.filter(j => j.status !== "Closed" && j.status !== "Draft").length;
    const totalSilverHeld = jobCards.reduce((s, j) => s + j.stages.reduce((a, st) => a + stageTotals(st).outstanding, 0), 0);
    return { totalLabour, totalStonesConsumed, openJC, totalSilverHeld };
  }, [jobCards, rowsWithTotals]);

  const stageQueue = useMemo(() => {
    const q = { Casting: 0, Meenakari: 0, Jadai: 0, Setting: 0, Fitting: 0 };
    jobCards.forEach(j => j.stages.forEach(st => { if (st.status === "In Progress") q[st.stage]++; }));
    return q;
  }, [jobCards]);

  const jcDetail = jobCardDetailId ? jobCards.find(x => x.id === jobCardDetailId) : null;

  return (
    <div className="h-screen w-screen flex flex-col overflow-hidden text-slate-900">
      <header className="h-12 shrink-0 bg-white border-b border-slate-200 flex items-center px-3 gap-3 z-30">
        <div className="flex items-center gap-2 pr-3 border-r border-slate-200">
          <div className="w-6 h-6 rounded bg-blue-800 text-white grid place-items-center text-[11px] font-bold">CK</div>
          <span className="text-[13px] font-semibold text-slate-900">Chowker JMS</span>
        </div>
        <button className="flex items-center gap-1.5 h-7 px-2 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">
          Phacolite Prolific Pvt Ltd <Icon name="chevronDown" className="w-3.5 h-3.5 text-slate-400" />
        </button>
        <button onClick={() => setPaletteOpen(true)} className="ml-auto flex items-center gap-2 h-7 w-80 px-2 rounded border border-slate-200 text-[12px] text-slate-400 hover:border-slate-300">
          <Icon name="search" className="w-3.5 h-3.5" /> Search job cards, products, karigars…
          <kbd className="kbd ml-auto text-[10px] font-medium text-slate-500 border border-slate-200 rounded px-1 py-0.5">⌘K</kbd>
        </button>
        <button className="relative h-7 w-7 grid place-items-center rounded hover:bg-slate-100">
          <Icon name="inbox" className="w-4 h-4 text-slate-600" />
          <span className="absolute -top-0.5 -right-0.5 min-w-[15px] h-[15px] px-1 rounded-full bg-rose-600 text-white text-[9px] grid place-items-center">5</span>
        </button>
        <button className="h-7 w-7 grid place-items-center rounded hover:bg-slate-100"><Icon name="bell" className="w-4 h-4 text-slate-600" /></button>
        <div className="h-7 w-7 rounded-full bg-slate-200 text-slate-700 grid place-items-center text-[11px] font-semibold">AB</div>
      </header>

      <div className="flex-1 flex overflow-hidden">
        <aside className={`${collapsed ? "w-14" : "w-56"} shrink-0 bg-white border-r border-slate-200 flex flex-col transition-[width] duration-150`}>
          <nav className="flex-1 overflow-y-auto py-2">
            <div className="mb-3">
              {!collapsed && <div className="px-3 pb-1 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Overview</div>}
              <NavItem icon="layout" label="Dashboard" labelHi="डैशबोर्ड" active={view === "dashboard"} collapsed={collapsed} onClick={() => { setView("dashboard"); setJobCardDetailId(null); }} />
            </div>
            <div className="mb-3">
              {!collapsed && <div className="px-3 pb-1 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Production</div>}
              <NavItem icon="box" label="Item Master" labelHi="आइटम मास्टर" count={itemMaster.length} active={view === "itemmaster"} collapsed={collapsed} onClick={() => { setView("itemmaster"); setItemMasterDetailId(null); }} />
              <NavItem icon="fileText" label="Job Cards" labelHi="जॉब कार्ड्स" count={jobCards.length} active={view === "jobcards"} collapsed={collapsed} onClick={() => { setView("jobcards"); setJobCardDetailId(null); }} />
            </div>
            <div className="mb-3">
              {!collapsed && <div className="px-3 pb-1 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Ledgers</div>}
              <NavItem icon="users" label="Karigar Ledger" labelHi="कारीगर लेजर" count={karigars.length} active={view === "ledger"} collapsed={collapsed} onClick={() => setView("ledger")} />
            </div>
            <div className="mb-3">
              {!collapsed && <div className="px-3 pb-1 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Configuration</div>}
              <NavItem icon="sliders" label="Settings" labelHi="सेटिंग्स" active={view === "settings"} collapsed={collapsed} onClick={() => setView("settings")} />
            </div>
          </nav>
          <button onClick={() => setCollapsed(!collapsed)} className="h-9 border-t border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50">
            <Icon name={collapsed ? "panelOpen" : "panelClose"} className="w-4 h-4" />
          </button>
        </aside>

        <main className="flex-1 flex overflow-hidden">
          {view === "dashboard" && <Dashboard kpi={kpi} stageQueue={stageQueue} rowsWithTotals={rowsWithTotals} tiers={purityTiers} onOpenJC={(id) => { setView("jobcards"); setJobCardDetailId(id); }} />}

          {view === "itemmaster" && (
            itemMasterDetailId ? (
              <ItemMasterDetailPage item={itemMaster.find(i => i.id === itemMasterDetailId)} jobCards={jobCards} tiers={purityTiers}
                onBack={() => setItemMasterDetailId(null)} onUpdateItem={updateItemMaster}
                onOpenJobCard={(id) => { setItemMasterDetailId(null); setView("jobcards"); setJobCardDetailId(id); }} />
            ) : (
              <ItemMasterView itemMaster={itemMaster} jobCards={jobCards} tiers={purityTiers} onCreate={createItemMasterEntry} onOpen={(id) => setItemMasterDetailId(id)} />
            )
          )}

          {view === "jobcards" && (
            jcDetail ? (
              <JobCardPage jc={jcDetail} t={jcTotals(jcDetail, purityTiers)} item={itemMasterMap[jcDetail.itemMasterId]}
                karigars={karigars} ledger={ledger} tiers={purityTiers} baseRate={baseRate} defaultRates={defaultRates}
                onBack={() => setJobCardDetailId(null)} onUpdateMeta={updateJobCardMeta}
                onAddAssignment={(stage, karigar) => addAssignment(jcDetail.id, stage, karigar)}
                onIssueMaterial={(stage, aid, data) => issueMaterial(jcDetail.id, stage, aid, data)}
                onReconcile={(stage, aid, iid, data) => reconcileMaterial(jcDetail.id, stage, aid, iid, data)}
                onEditReconcile={(stage, aid, iid, data) => editReconcile(jcDetail.id, stage, aid, iid, data)}
                onCancelReconcile={(stage, aid, iid) => cancelReconcile(jcDetail.id, stage, aid, iid)}
                onRecordCastOutput={(stage, aid, data) => recordCastOutput(jcDetail.id, stage, aid, data)}
                onRecordFittingOutput={(stage, aid, data) => recordFittingOutput(jcDetail.id, stage, aid, data)}
                onRecordJadaiOutput={(stage, aid, data) => recordJadaiOutput(jcDetail.id, stage, aid, data)}
                onAddLabour={(stage, aid, entry) => addLabour(jcDetail.id, stage, aid, entry)}
                onRemoveLabour={(stage, aid, lid) => removeLabour(jcDetail.id, stage, aid, lid)}
                onIssueStones={(stage, aid, data) => issueStones(jcDetail.id, stage, aid, data)}
                onReturnStones={(stage, aid, sid, data) => returnStones(jcDetail.id, stage, aid, sid, data)}
                onApproveStage={(stage) => approveStage(jcDetail.id, stage)}
                onCloseJobCard={closeJobCard} onToggleHold={toggleHold} onReopenJobCard={reopenJobCard}
              />
            ) : (
              <JobCardList visible={visible} jobCards={jobCards} itemMasterMap={itemMasterMap} activeTab={activeTab} setActiveTab={setActiveTab} tabCounts={tabCounts}
                query={query} setQuery={setQuery} filterRef={filterRef}
                onOpen={(id) => setJobCardDetailId(id)} onNew={() => setShowNewJC(true)} onExport={() => exportCSV(visible)} />
            )
          )}

          {view === "ledger" && (
            <LedgerView ledger={ledger} karigars={karigars} jobCards={jobCards} tiers={purityTiers} selectedKarigarId={selectedKarigarId} setSelectedKarigarId={setSelectedKarigarId} onCreateKarigar={() => setShowCreateKarigar(true)} onEditKarigar={(k) => setEditingKarigar(k)} onIssueBulkStock={issueBulkStock} />
          )}

          {view === "settings" && (
            <SettingsView tiers={purityTiers} baseRate={baseRate} defaultRates={defaultRates}
              onAddTier={addTier} onUpdateTier={updateTier} onRemoveTier={removeTier}
              onSetBaseRate={setBaseRate} onSetDefaultRates={(patch) => setDefaultRates(prev => ({ ...prev, ...patch }))} />
          )}
        </main>
      </div>

      {paletteOpen && (
        <CommandPalette jobCards={jobCards} itemMasterMap={itemMasterMap} onClose={() => setPaletteOpen(false)}
          onSelect={(id) => { setView("jobcards"); setJobCardDetailId(id); setPaletteOpen(false); }}
          onNew={() => { setPaletteOpen(false); setShowNewJC(true); }} />
      )}
      {showNewJC && <NewJobCardModal itemMaster={itemMaster} tiers={purityTiers} onClose={() => setShowNewJC(false)} onCreateFromExisting={createJobCardFromExisting} onCreateWithNewItem={createJobCardWithNewItem} />}
      {showCreateKarigar && <CreateKarigarModal onClose={() => setShowCreateKarigar(false)} onCreate={createKarigar} />}
      {editingKarigar && (
        <CreateKarigarModal editMode initialData={editingKarigar} onClose={() => setEditingKarigar(null)}
          onCreate={(data) => { editKarigar(editingKarigar.id, data); setEditingKarigar(null); }} />
      )}
    </div>
  );
}

function NavItem({ icon, label, labelHi, count, active, collapsed, onClick }) {
  return (
    <button onClick={onClick} className={`w-full flex items-center gap-2.5 h-8 px-3 text-[12px] border-l-2 ${active ? "border-blue-800 bg-blue-50 text-blue-900 font-medium" : "border-transparent text-slate-600 hover:bg-slate-50"}`}>
      <Icon name={icon} className="w-4 h-4 shrink-0" />
      {!collapsed && <span className="truncate">{label}{labelHi && <span className="text-slate-400"> · {labelHi}</span>}</span>}
      {!collapsed && count != null && <span className="ml-auto text-[10px] text-slate-500 bg-slate-100 border border-slate-200 rounded px-1">{count}</span>}
    </button>
  );
}

  return (

        <h1 className="text-[21px] font-semibold text-slate-900">Manufacturing Overview</h1>
        <p className="text-[12px] text-slate-500 mt-0.5">Bikaner unit · Silver jewellery job-card costing</p>
      </div>
      <div className="px-6 grid grid-cols-4 gap-3">
        <KpiTile label="Silver Currently Held by Karigars" value={gm(kpi.totalSilverHeld)} sub="Issued but not yet reconciled" />
        <KpiTile label="Labour Accrued" value={money(kpi.totalLabour)} sub="Across all job cards" />
        <KpiTile label="Net Stone Value Consumed" value={money(kpi.totalStonesConsumed)} sub="Issued minus unused returned" />

          {Object.entries(stageQueue).map(([stage, count]) => (
            <div key={stage} className="bg-white border border-slate-200 rounded p-3">
              <div className="flex items-center gap-2 text-slate-500"><Icon name={STAGE_ICON[stage]} className="w-4 h-4" /><span className="text-[11px] uppercase tracking-wider font-semibold">{stage}</span></div>
              <div className="text-[24px] font-semibold text-slate-900 mt-1 font-mono-num">{count}</div>
              <div className="text-[10px] text-slate-400">job card{count === 1 ? "" : "s"} in progress</div>
            </div>
          ))}
        </div>
      </div>
      <div className="px-6 mt-6 pb-6">
        <div className="text-[12px] font-semibold text-slate-700 mb-2">Needs Attention</div>
        <div className="bg-white border border-slate-200 rounded overflow-hidden">
          {attention.length === 0 && <div className="p-4 text-[12px] text-slate-500">Nothing blocked right now.</div>}
          {attention.map(({ jc, item }) => (
            <div key={jc.id} onClick={() => onOpenJC(jc.id)} className="flex items-center gap-3 px-3 h-11 border-b border-slate-100 last:border-b-0 hover:bg-slate-50 cursor-pointer">
              <StatusPill status={jc.status} />
              <span className="text-[12px] font-mono-num text-blue-800">{jc.id}</span>
              <span className="text-[12px] text-slate-800">{item?.name}</span>
              <span className="ml-auto text-[11px] text-slate-500">{jc.holdReason || "Awaiting admin costing sign-off before OC"}</span>
              <Icon name="arrowUpRight" className="w-3.5 h-3.5 text-slate-400" />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
function KpiTile({ label, value, sub }) {

      <div className="text-[20px] font-semibold text-slate-900 mt-1 font-mono-num">{value}</div>

/* ============================== KARIGAR LEDGER VIEW ============================== */
function LedgerView({ ledger, karigars, jobCards, tiers, selectedKarigarId, setSelectedKarigarId, onCreateKarigar, onEditKarigar, onIssueBulkStock }) {
  const [showBulk, setShowBulk] = useState(false);
  const [query, setQuery] = useState("");
  const [specFilter, setSpecFilter] = useState("all");
  const active = karigars.find(k => k.id === selectedKarigarId) || karigars[0];
  const entries = active ? (ledger[active.name] || []) : [];
  const closingBalance = entries.length ? entries[entries.length - 1].balance : 0;
  const assigned = active ? jobCards.flatMap(j => j.stages.flatMap(s => s.assignments.filter(a => a.karigar === active.name).flatMap(a => a.issues.filter(i => i.status === "Issued").map(i => ({ jc: j, stage: s.stage, issue: i }))))) : [];
  const activeLabourEarned = active ? karigarLabourEarned(active.name, jobCards) : 0;

  const totalOutstanding = karigars.reduce((s, k) => s + Math.max(0, karigarBalance(k.name, ledger)), 0);
  const totalLabourPaid = karigars.reduce((s, k) => s + karigarLabourEarned(k.name, jobCards), 0);

  const filteredKarigars = karigars.filter(k => {
    if (specFilter !== "all" && k.specialization !== specFilter) return false;
    if (query.trim() && !k.name.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  function defaultRateLabel(k) {
    if (k.specialization === "Casting" && k.defaultWastagePct != null) return `${k.defaultWastagePct}% wastage`;
    if (k.specialization === "Meenakari" && k.defaultRatePerGm != null) return `₹${k.defaultRatePerGm}/gm`;
    if (k.defaultFlatLabour != null) return `₹${k.defaultFlatLabour} flat`;
    return null;
  }

  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="bg-white border-b border-slate-200 px-4 py-3 shrink-0 grid grid-cols-4 gap-3">
        <div>
          <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Karigars (कारीगर)</div>
          <div className="text-[18px] font-semibold text-slate-900 mt-0.5 font-mono-num">{karigars.length}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Silver outstanding (बकाया)</div>
          <div className="text-[18px] font-semibold text-amber-700 mt-0.5 font-mono-num">{gm(totalOutstanding)}</div>
        </div>
        <div>
          <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Total labour paid (मज़दूरी)</div>
          <div className="text-[18px] font-semibold text-slate-900 mt-0.5 font-mono-num">{money(totalLabourPaid)}</div>
        </div>
        <div className="flex items-end justify-end">
          <button onClick={onCreateKarigar} className="h-7 px-2.5 rounded bg-blue-800 text-white text-[11px] font-medium hover:bg-blue-900 flex items-center gap-1.5">
            <Icon name="plus" className="w-3.5 h-3.5" /> New Karigar (नया)
          </button>
        </div>
      </div>

      <div className="flex-1 flex overflow-hidden">
        <div className="w-72 shrink-0 bg-white border-r border-slate-200 flex flex-col overflow-hidden">
          <div className="px-3 py-2.5 border-b border-slate-200 shrink-0 space-y-2">
            <div className="relative">
              <Icon name="search" className="w-3.5 h-3.5 text-slate-400 absolute left-2 top-1/2 -translate-y-1/2" />
              <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search karigar…" className="h-7 w-full pl-7 pr-2 rounded border border-slate-200 text-[12px] outline-none focus:border-blue-400" />
            </div>
            <div className="flex items-center gap-1 flex-wrap">
              {["all", ...STAGE_ORDER].map(s => (
                <button key={s} onClick={() => setSpecFilter(s)}
                  className={`h-6 px-2 rounded text-[10px] border ${specFilter === s ? "bg-blue-800 text-white border-blue-800" : "border-slate-200 text-slate-600 hover:bg-slate-50"}`}>
                  {s === "all" ? "All" : s}
                </button>
              ))}
            </div>
          </div>
          <div className="flex-1 overflow-y-auto">
            {filteredKarigars.length === 0 && <div className="p-3 text-[12px] text-slate-400">No karigars match.</div>}
            {filteredKarigars.map(k => {
              const kEntries = ledger[k.name] || [];
              const bal = kEntries.length ? kEntries[kEntries.length - 1].balance : 0;
              const sel = k.id === (active && active.id);
              const rateLabel = defaultRateLabel(k);
              return (
                <button key={k.id} onClick={() => setSelectedKarigarId(k.id)} className={`w-full text-left px-3 py-2.5 border-b border-slate-100 ${sel ? "bg-blue-50 border-l-2 border-l-blue-800" : "hover:bg-slate-50"}`}>
                  <div className="flex items-center gap-2"><Avatar name={k.name} /><div><div className="text-[12px] font-medium text-slate-900">{k.name}</div><div className="text-[10px] text-slate-500">{k.specialization}{rateLabel ? ` · ${rateLabel}` : ""}</div></div></div>
                  <div className={`text-[11px] font-mono-num mt-1 ${kEntries.length === 0 ? "text-slate-400" : bal > 0.05 ? "text-amber-700" : "text-emerald-700"}`}>
                    {kEntries.length === 0 ? "No transactions yet" : bal > 0.05 ? `${gm(bal)} silver outstanding` : "Fully settled"}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <div className="flex-1 flex flex-col overflow-hidden">
          {active ? (
            <>
              <div className="bg-white border-b border-slate-200 px-4 py-3 shrink-0">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="lock" className="w-4 h-4 text-slate-400" />
                    <h1 className="text-[18px] font-semibold text-slate-900">{active.name} — {active.specialization}</h1>
                    <button onClick={() => onEditKarigar(active)} className="w-6 h-6 rounded border border-slate-200 grid place-items-center hover:bg-slate-50" aria-label="Edit karigar">
                      <Icon name="edit" className="w-3.5 h-3.5 text-slate-500" />
                    </button>
                  </div>
                  <button onClick={() => setShowBulk(true)} className="h-7 px-2.5 rounded bg-blue-800 text-white text-[11px] font-medium hover:bg-blue-900 flex items-center gap-1.5">
                    <Icon name="plus" className="w-3.5 h-3.5" /> Issue Bulk Stock
                  </button>
                </div>
                <p className="text-[11px] text-slate-500 mt-1">
                  {active.contact ? `${active.contact} · ` : ""}Running pure-silver-equivalent account, sourced directly from job-card material issues — immutable.
                  {defaultRateLabel(active) && ` Default rate: ${defaultRateLabel(active)}.`}
                </p>
                <div className="flex items-center gap-4 mt-2 text-[11px]">
                  <span className="text-slate-500">Total labour earned: <span className="font-mono-num font-semibold text-slate-900">{money(activeLabourEarned)}</span></span>
                  <span className="text-slate-500">Transactions: <span className="font-mono-num font-semibold text-slate-900">{entries.length}</span></span>
                </div>
              </div>
              {showBulk && <BulkStockModal karigar={active} tiers={tiers} onClose={() => setShowBulk(false)} onIssue={(data) => { onIssueBulkStock(active.name, data); setShowBulk(false); }} />}
              {assigned.length > 0 && (
                <div className="bg-amber-50/50 border-b border-amber-200 px-4 py-2.5 shrink-0">
                  <div className="text-[10px] uppercase tracking-wider text-amber-700 font-semibold mb-1.5">Currently Holding (पास में)</div>
                  <div className="flex flex-wrap gap-2">
                    {assigned.map((x, i) => (
                      <div key={i} className="bg-white border border-amber-200 rounded px-2.5 py-1.5 text-[11px]">
                        <span className="font-mono-num text-blue-800">{x.jc.id}</span>
                        <span className="text-amber-700 ml-1.5 font-mono-num">{gm(x.issue.issuedWeight)} @ {x.issue.purity} ({x.stage})</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              <div className="flex-1 overflow-auto">
                <table className="w-full border-collapse">
                  <thead className="sticky top-0 bg-slate-50 z-10">
                    <tr className="h-8 border-b border-slate-200 text-left">
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Date</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Job Card</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Stage</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Entry Type</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold text-right">Weight</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Purity</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold text-right">Pure-Silver Eq.</th>
                      <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold text-right">Running Balance</th>
                    </tr>
                  </thead>
                  <tbody>
                    {entries.length === 0 && <tr><td colSpan={8} className="py-10 text-center text-[12px] text-slate-400">No transactions yet.</td></tr>}
                    {entries.map((e, i) => (
                      <tr key={i} className="border-b border-slate-100 h-9 hover:bg-slate-50">
                        <td className="px-3 text-[12px] font-mono-num text-slate-600">{e.date}</td>
                        <td className="px-3 text-[12px] font-mono-num text-blue-800">{e.jobCardId}</td>
                        <td className="px-3 text-[12px] text-slate-700">{e.stage}</td>
                        <td className="px-3 text-[12px]"><span className={`inline-flex items-center h-5 px-1.5 rounded border text-[11px] font-medium ${e.type.startsWith("Issue") ? "bg-rose-50 text-rose-800 border-rose-200" : "bg-emerald-50 text-emerald-800 border-emerald-200"}`}>{e.type}</span></td>
                        <td className="px-3 text-[12px] text-right font-mono-num text-slate-900">{gm(e.weight)}</td>
                        <td className="px-3 text-[12px] font-mono-num text-slate-600">{e.purity}</td>
                        <td className="px-3 text-[12px] text-right font-mono-num text-slate-900">{gm(e.pureEq)}</td>
                        <td className="px-3 text-[12px] text-right font-mono-num font-semibold text-slate-900">{gm(e.balance)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <footer className="h-10 shrink-0 bg-white border-t border-slate-200 flex items-center px-4 gap-4 text-[11px]">
                <span className="text-slate-500">{entries.length} transactions</span>
                <span className="ml-auto text-slate-500">Closing balance:</span>
                <span className={`font-mono-num font-semibold ${closingBalance > 0.05 ? "text-amber-700" : "text-emerald-700"}`}>{gm(closingBalance)} {closingBalance > 0.05 ? "owed by karigar" : "settled"}</span>
              </footer>
            </>
          ) : <div className="flex-1 grid place-items-center text-[12px] text-slate-400">No karigars yet.</div>}
        </div>
      </div>
    </div>
  );
}

/* ============================== SETTINGS VIEW ============================== */
function SettingsView({ tiers, baseRate, defaultRates, onAddTier, onUpdateTier, onRemoveTier, onSetBaseRate, onSetDefaultRates }) {
  const [calcInput, setCalcInput] = useState(100);
  const [calcFrom, setCalcFrom] = useState(tiers[0]?.label);
  return (
    <div className="flex-1 overflow-y-auto px-6 py-5">
      <h1 className="text-[21px] font-semibold text-slate-900">Settings</h1>
      <p className="text-[12px] text-slate-500 mt-1 max-w-2xl">Purity tiers, base silver rate, and default labour/wastage rates — fully configurable.</p>

      <div className="mt-4 bg-white border border-slate-200 rounded overflow-hidden max-w-2xl">
        <div className="px-3 py-2 bg-slate-50/60 border-b border-slate-100 flex items-center justify-between">
          <span className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Purity Tiers (Karat-Style, Editable)</span>
          <button onClick={onAddTier} className="h-6 px-2 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1"><Icon name="plus" className="w-3 h-3" /> Add Tier</button>
        </div>
        <table className="w-full">
          <thead><tr className="h-8 bg-slate-50/40 border-b border-slate-100 text-left">
            <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Label</th>
            <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">% of Base Rate</th>
            <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold text-right">Rate / gram</th>
            <th className="w-10" />
          </tr></thead>
          <tbody>
            {tiers.map(t => (
              <tr key={t.id} className="h-10 border-b border-slate-50 last:border-b-0">
                <td className="px-3"><input value={t.label} onChange={e => onUpdateTier(t.id, "label", e.target.value)} className="w-20 h-7 px-1.5 border border-slate-200 rounded text-[12px] font-mono-num" /></td>
                <td className="px-3"><div className="flex items-center gap-1"><input type="number" step="0.1" value={t.percent} onChange={e => onUpdateTier(t.id, "percent", e.target.value)} className="w-20 h-7 px-1.5 border border-slate-200 rounded text-[12px] font-mono-num" /><span className="text-[11px] text-slate-400">%</span></div></td>
                <td className="px-3 text-[12px] font-mono-num text-right text-slate-900">{money(baseRate * (t.percent / 100))}</td>
                <td className="px-3 text-right"><button onClick={() => onRemoveTier(t.id)} className="w-6 h-6 rounded hover:bg-rose-50 text-rose-600 grid place-items-center"><Icon name="trash" className="w-3.5 h-3.5" /></button></td>
              </tr>
            ))}
          </tbody>
        </table>
        <div className="px-3 py-2.5 border-t border-slate-100 flex items-center gap-2">
          <span className="text-[12px] text-slate-600">Base silver rate (100% tier)</span><span className="text-[12px] text-slate-400">₹</span>
          <input type="number" step="0.5" value={baseRate} onChange={e => onSetBaseRate(parseFloat(e.target.value) || 0)} className="w-24 h-7 px-1.5 border border-slate-200 rounded text-[12px] font-mono-num" />
          <span className="text-[11px] text-slate-400">per gram</span>
        </div>
      </div>

      <div className="mt-6 bg-white border border-slate-200 rounded p-4 max-w-2xl">
        <div className="text-[12px] font-semibold text-slate-700 mb-3">Default Wastage % & Labour Rates</div>
        <div className="grid grid-cols-2 gap-3">
          <FormRow label="Casting wastage % (default)"><input type="number" step="0.1" className={inputCls} value={defaultRates.castingWastagePct} onChange={e => onSetDefaultRates({ castingWastagePct: parseFloat(e.target.value) || 0 })} /></FormRow>
          <FormRow label="Fitting wastage % (default)"><input type="number" step="0.1" className={inputCls} value={defaultRates.fittingWastagePct} onChange={e => onSetDefaultRates({ fittingWastagePct: parseFloat(e.target.value) || 0 })} /></FormRow>
          <FormRow label="Meenakari rate (₹/gram)"><input type="number" step="1" className={inputCls} value={defaultRates.meenakariRatePerGm} onChange={e => onSetDefaultRates({ meenakariRatePerGm: parseFloat(e.target.value) || 0 })} /></FormRow>
          <FormRow label="Jadai rate (₹/stone)"><input type="number" step="1" className={inputCls} value={defaultRates.jadaiRatePerStone} onChange={e => onSetDefaultRates({ jadaiRatePerStone: parseFloat(e.target.value) || 0 })} /></FormRow>
          <FormRow label="Setting rate (₹/stone)"><input type="number" step="1" className={inputCls} value={defaultRates.settingRatePerStone} onChange={e => onSetDefaultRates({ settingRatePerStone: parseFloat(e.target.value) || 0 })} /></FormRow>
        </div>
        <p className="text-[10px] text-slate-400 mt-1">Used by "Pull Formula" on each stage's labour form — still manually adjustable per entry.</p>
      </div>

      <div className="mt-6 bg-white border border-slate-200 rounded p-4 max-w-2xl">
        <div className="text-[12px] font-semibold text-slate-700 mb-3">Quick Pure-Silver-Equivalent Calculator</div>
        <div className="flex items-center gap-3 flex-wrap">
          <input type="number" value={calcInput} onChange={e => setCalcInput(parseFloat(e.target.value) || 0)} className="h-8 w-28 px-2 border border-slate-200 rounded text-[12px] font-mono-num" />
          <span className="text-[12px] text-slate-500">grams @</span>
          <select value={calcFrom} onChange={e => setCalcFrom(e.target.value)} className="h-8 px-2 border border-slate-200 rounded text-[12px]">{tiers.map(t => <option key={t.id} value={t.label}>{t.label}</option>)}</select>
          <Icon name="chevronRight" className="w-4 h-4 text-slate-400" />
          <span className="text-[13px] font-mono-num font-semibold text-slate-900">{gm(calcInput * factorFor(calcFrom, tiers))} pure ({pureTierLabel(tiers)}-equivalent)</span>
        </div>
        <div className="text-[11px] text-slate-400 mt-2">valued at {money(calcInput * factorFor(calcFrom, tiers) * baseRate)}</div>
      </div>
    </div>
  );
}

/* ============================== COMMAND PALETTE ============================== */
function CommandPalette({ jobCards, itemMasterMap, onClose, onSelect, onNew }) {
  const [q, setQ] = useState("");
  const results = jobCards.filter(j => { const item = itemMasterMap[j.itemMasterId]; return !q || j.id.toLowerCase().includes(q.toLowerCase()) || (item && item.name.toLowerCase().includes(q.toLowerCase())); });
  return (
    <div className="fixed inset-0 bg-slate-900/20 z-50 flex items-start justify-center pt-24" onClick={onClose}>
      <div className="w-[560px] rounded-md border border-slate-200 bg-white shadow-sm overflow-hidden" onClick={e => e.stopPropagation()}>
        <div className="flex items-center gap-2 px-3 h-11 border-b border-slate-100">
          <Icon name="search" className="w-4 h-4 text-slate-400" />
          <input autoFocus value={q} onChange={e => setQ(e.target.value)} placeholder="Jump to a job card, or create a new one…" className="flex-1 outline-none text-[13px] placeholder:text-slate-400" />
          <kbd className="kbd text-[10px] text-slate-400 border border-slate-200 rounded px-1 py-0.5">Esc</kbd>
        </div>
        <div className="max-h-72 overflow-y-auto py-1">
          <div className="px-3 py-1 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Actions</div>
          <button onClick={onNew} className="w-full flex items-center gap-2 px-3 h-8 text-[12px] hover:bg-slate-50 text-left"><Icon name="plus" className="w-3.5 h-3.5 text-blue-800" /><span className="text-slate-700">Create new job card</span></button>
          <div className="px-3 py-1 mt-1 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Job Cards</div>
          {results.map(j => {
            const item = itemMasterMap[j.itemMasterId];
            return (
              <button key={j.id} onClick={() => onSelect(j.id)} className="w-full flex items-center gap-2 px-3 h-8 text-[12px] hover:bg-slate-50 text-left">
                <span className="font-mono-num text-blue-800">{j.id}</span><span className="text-slate-700 truncate">{item?.name}</span><StatusPill status={j.status} /><kbd className="kbd ml-auto text-[10px] text-slate-300">⏎</kbd>
              </button>
            );
          })}
          {results.length === 0 && <div className="px-3 py-4 text-[12px] text-slate-400">No matches</div>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
