/* ============================== DERIVED / BUSINESS LOGIC HELPERS ============================== */
function assignmentTotals(a) {
  const issuedW = a.issues.reduce((s, i) => s + (i.issuedWeight || 0), 0);
  const returnedW = a.issues.filter(i => i.status === "Reconciled").reduce((s, i) => s + (i.returnedWeight || 0), 0);
  const dustW = a.issues.filter(i => i.status === "Reconciled").reduce((s, i) => s + (i.dustWeight || 0), 0);
  const outstanding = a.issues.filter(i => i.status === "Issued").reduce((s, i) => s + (i.issuedWeight || 0), 0);
  const labour = a.labour.reduce((s, l) => s + l.amount, 0);
  const stonesIssued = a.stones.reduce((s, st) => s + (st.valueIssued || 0), 0);
  const stonesReturned = a.stones.reduce((s, st) => s + (st.valueReturned || 0), 0);
  return { issuedW, returnedW, dustW, outstanding, labour, stonesIssued, stonesReturned };
}
function stageTotals(stage) {
  return stage.assignments.reduce((acc, a) => {
    const t = assignmentTotals(a);
    return { labour: acc.labour + t.labour, stonesIssued: acc.stonesIssued + t.stonesIssued, stonesReturned: acc.stonesReturned + t.stonesReturned, outstanding: acc.outstanding + t.outstanding };
  }, { labour: 0, stonesIssued: 0, stonesReturned: 0, outstanding: 0 });
}
function jcTotals(jc, tiers) {
  let labour = 0, stonesIssued = 0, stonesReturned = 0;
  jc.stages.forEach(st => { const t = stageTotals(st); labour += t.labour; stonesIssued += t.stonesIssued; stonesReturned += t.stonesReturned; });
  const stonesConsumed = stonesIssued - stonesReturned;
  const carried = carriedSilver(jc, tiers);
  const pureEq = accumulatedPureEq(jc, tiers);
  const info = activeStageInfo(jc);
  return { labour, stonesIssued, stonesReturned, stonesConsumed, currentWeight: carried.weight, currentPurity: carried.purity, pureEq, activeStage: info.stage, activeStageStatus: info.status };
}
const REPLACE_STAGES = ["Casting", "Meenakari", "Setting"]; // stage's own net output IS the new running mass (dust already netted out)
const ADD_STAGES = ["Jadai", "Fitting"]; // bulk-stock material fused onto the piece — physical mass simply adds on, regardless of its own karat
function accumulatedWeight(jc) {
  let weight = 0;
  STAGE_ORDER.forEach(stageName => {
    const stage = jc.stages.find(s => s.stage === stageName);
    if (!stage) return;
    const reconciled = stage.assignments.flatMap(a => a.issues).filter(i => i.status === "Reconciled");
    if (reconciled.length === 0) return;
    const stageWeight = reconciled.reduce((s, i) => s + i.returnedWeight, 0);
    if (REPLACE_STAGES.includes(stageName)) weight = stageWeight;
    else if (ADD_STAGES.includes(stageName)) weight += stageWeight;
  });
  return weight;
}
const CARAT_TO_GRAM = 0.2; // 1 carat = 0.2g, standard gemstone conversion
function stonesNetCaratGrams(jc) {
  let netCarat = 0;
  jc.stages.forEach(st => st.assignments.forEach(a => a.stones.forEach(s => {
    const issuedCarat = s.carat || 0;
    const returnedCarat = s.caratReturned || 0;
    netCarat += Math.max(0, issuedCarat - returnedCarat);
  })));
  return +(netCarat * CARAT_TO_GRAM).toFixed(3);
}
function grossWeight(jc) {
  return +(accumulatedWeight(jc) + stonesNetCaratGrams(jc)).toFixed(3);
}
function stonesByType(jc) {
  const map = {};
  jc.stages.forEach(st => st.assignments.forEach(a => a.stones.forEach(s => {
    const key = s.type || "Other";
    if (!map[key]) map[key] = { type: key, carat: 0, value: 0 };
    map[key].carat += Math.max(0, (s.carat || 0) - (s.caratReturned || 0));
    map[key].value += Math.max(0, (s.valueIssued || 0) - (s.valueReturned || 0));
  })));
  return Object.values(map).filter(x => x.value > 0 || x.carat > 0);
}
function accumulatedPureEq(jc, tiers) {
  // Nominal pure-silver content, reported at the job card's own (locked) target purity —
  // matches how the business actually talks about the piece, even though a small amount
  // of higher-karat kundan/findings is physically mixed in.
  return +(accumulatedWeight(jc) * factorFor(jc.targetPurity, tiers)).toFixed(3);
}
function carriedSilver(jc, tiers) {
  const weight = accumulatedWeight(jc);
  return { weight: +weight.toFixed(3), purity: jc.targetPurity };
}
function activeStageInfo(jc) {
  const inProg = jc.stages.find(s => s.status === "In Progress");
  if (inProg) return { stage: inProg.stage, status: inProg.status };
  const approved = [...jc.stages].reverse().find(s => s.status === "Approved");
  if (approved) return { stage: approved.stage, status: approved.status };
  return { stage: null, status: null };
}
function nextJobCardId(jobCards) {
  const nums = jobCards.map(jc => parseInt(jc.id.split("-").pop(), 10)).filter(n => !isNaN(n));
  return `JC-2026-${String((nums.length ? Math.max(...nums) : 141) + 1).padStart(5, "0")}`;
}
function nextItemMasterId(items) {
  const nums = items.map(i => parseInt(i.id.split("-").pop(), 10)).filter(n => !isNaN(n));
  return `IM-${String((nums.length ? Math.max(...nums) : 149) + 1)}`;
}
function computeLabourAmount(basis, qty, rate, purity, tiers, baseRate) {
  if (basis === "Wastage %") return qty * (rate / 100) * rateForLabel(purity, tiers, baseRate);
  if (basis === "Flat") return rate;
  return qty * rate; // Per Gram / Per Stone
}

function buildLedger(jobCards, tiers, bulkIssues) {
  const rows = [];
  (bulkIssues || []).forEach(b => {
    rows.push({ date: b.date, karigar: b.karigar, stage: "Bulk Stock", jobCardId: "—",
      type: "Issue (Dr)", weight: b.weight, purity: b.purity, pureEq: b.weight * factorFor(b.purity, tiers) });
  });
  jobCards.forEach(jc => {
    jc.stages.forEach(stage => {
      stage.assignments.forEach(a => {
        a.issues.forEach(issue => {
          if (!issue.fromBulkStock) {
            rows.push({ date: issue.issueDate, karigar: a.karigar, stage: stage.stage, jobCardId: jc.id,
              type: "Issue (Dr)", weight: issue.issuedWeight, purity: issue.purity, pureEq: issue.issuedWeight * factorFor(issue.purity, tiers) });
          }
          if (issue.status === "Reconciled") {
            rows.push({ date: issue.returnDate, karigar: a.karigar, stage: stage.stage, jobCardId: jc.id,
              type: "Return (Cr)", weight: issue.returnedWeight, purity: issue.returnedPurity, pureEq: issue.returnedWeight * factorFor(issue.returnedPurity, tiers) });
            if (issue.dustWeight) rows.push({ date: issue.returnDate, karigar: a.karigar, stage: stage.stage, jobCardId: jc.id,
              type: "Dust Return (Cr)", weight: issue.dustWeight, purity: issue.returnedPurity, pureEq: issue.dustWeight * factorFor(issue.returnedPurity, tiers) });
            if (issue.wastageWeight) { const wastagePurity = pureTierLabel(tiers); rows.push({ date: issue.returnDate, karigar: a.karigar, stage: stage.stage, jobCardId: jc.id,
              type: "Wastage Deduction (Cr)", weight: issue.wastageWeight, purity: wastagePurity, pureEq: issue.wastageWeight * factorFor(wastagePurity, tiers) }); }
          }
        });
      });
    });
  });
  rows.sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.karigar.localeCompare(b.karigar));
  const byKarigar = {};
  rows.forEach(r => {
    if (!byKarigar[r.karigar]) byKarigar[r.karigar] = [];
    const prevBal = byKarigar[r.karigar].length ? byKarigar[r.karigar][byKarigar[r.karigar].length - 1].balance : 0;
    const delta = r.type === "Issue (Dr)" ? r.pureEq : -r.pureEq;
    byKarigar[r.karigar].push({ ...r, balance: prevBal + delta });
  });
  return byKarigar;
}
function karigarBalance(name, ledger) {
  const rows = ledger[name];
  return rows && rows.length ? rows[rows.length - 1].balance : 0;
}
function karigarLabourEarned(name, jobCards) {
  let total = 0;
  jobCards.forEach(jc => jc.stages.forEach(st => st.assignments.forEach(a => {
    if (a.karigar === name) total += a.labour.reduce((s, l) => s + l.amount, 0);
  })));
  return total;
}

function exportCSV(rows) {
  const header = ["Job Card", "Item", "Category", "Design Code", "Status", "Current Stage", "Silver (pure eq g)", "Labour Accrued", "Due Date"];
  const lines = rows.map(({ jc, item, t }) => [jc.id, item ? item.name : "", item ? item.category : "", item ? item.designCode : "", jc.status, t.activeStage || "Not issued", t.pureEq.toFixed(3), t.labour, jc.dueDate]
    .map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
  const csv = [header.join(","), ...lines].join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `job-cards-${TODAY}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

          className={`h-7 px-3 rounded text-[12px] font-medium ${valid ? "bg-blue-800 text-white hover:bg-blue-900" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>
          Create & Open Job Card
        </button>
        <button onClick={onClose} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Cancel</button>
      </>
    }>
      <p className="text-[11px] text-slate-500 mb-3">Job cards are pure costing records — no customer attached. Pick an existing product, or register a fresh design.</p>
      <div className="flex gap-1 mb-3 border border-slate-200 rounded p-0.5 w-fit">
        <button onClick={() => setMode("existing")} className={`h-7 px-3 rounded text-[12px] ${mode === "existing" ? "bg-blue-800 text-white" : "text-slate-600"}`}>Existing Product</button>
        <button onClick={() => setMode("new")} className={`h-7 px-3 rounded text-[12px] ${mode === "new" ? "bg-blue-800 text-white" : "text-slate-600"}`}>New Design</button>
      </div>

      {mode === "existing" ? (
        <FormRow label="Product (from Item Master) *">
          <select className={inputCls} value={itemMasterId} onChange={e => setItemMasterId(e.target.value)}>
            {itemMaster.map(i => <option key={i.id} value={i.id}>{i.name} {i.designCode ? `(${i.designCode})` : ""}</option>)}
          </select>
          {selectedItem && (
            <div className="mt-2 flex items-center gap-2 bg-slate-50 border border-slate-100 rounded p-2">
              <ItemImage imageUrl={selectedItem.imageUrl} category={selectedItem.category} className="w-12 h-12 rounded object-cover shrink-0" />
              <div className="text-[11px]">
                <div className="text-slate-700 font-medium">{selectedItem.category}</div>
                <div className="text-slate-400">Default {selectedItem.targetPurity} · Est. {selectedItem.estGrossWeight}g</div>
              </div>
            </div>
          )}
        </FormRow>
      ) : (
        <ItemMasterFormFields data={newItem} setData={setNewItem} tiers={tiers} />
      )}

      <FormRow label="Due date">
        <input type="date" className={inputCls} value={dueDate} onChange={e => setDueDate(e.target.value)} />
      </FormRow>
      <FormRow label="Notes (optional)">
        <input className={inputCls} value={notes} onChange={e => setNotes(e.target.value)} />
      </FormRow>
    </Modal>
  );
}

/* ============================== ADD KARIGAR (ASSIGNMENT) MODAL ============================== */
function AddKarigarModal({ stageName, karigars, ledger, onClose, onAdd }) {
  const matching = karigars.filter(k => k.specialization === stageName);
  const others = karigars.filter(k => k.specialization !== stageName);
  const [karigarId, setKarigarId] = useState((matching[0] || karigars[0])?.id || "");
  const karigar = karigars.find(k => k.id === karigarId);
  const balance = karigar ? karigarBalance(karigar.name, ledger) : 0;
  return (
    <Modal title={`Assign Karigar — ${stageName}`} onClose={onClose} footer={
      <>
        <button disabled={!karigar} onClick={() => karigar && onAdd(karigar.name)}
          className={`h-7 px-3 rounded text-[12px] font-medium ${karigar ? "bg-blue-800 text-white hover:bg-blue-900" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>
          Assign to {stageName}
        </button>
        <button onClick={onClose} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Cancel</button>
      </>
    }>
      {karigars.length === 0 ? (
        <p className="text-[12px] text-rose-700 bg-rose-50 border border-rose-200 rounded p-2.5">No karigars exist yet. Create one from Karigar Ledger first.</p>
      ) : (
        <>
          <FormRow label="Karigar">
            <select className={inputCls} value={karigarId} onChange={e => setKarigarId(e.target.value)}>
              {matching.length > 0 && <optgroup label={`${stageName} specialists`}>{matching.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}</optgroup>}
              {others.length > 0 && <optgroup label="Other karigars">{others.map(k => <option key={k.id} value={k.id}>{k.name} ({k.specialization})</option>)}</optgroup>}
            </select>
          </FormRow>
          {karigar && (
            <div className={`rounded p-2.5 text-[12px] border ${balance > 0.05 ? "bg-amber-50 border-amber-200 text-amber-800" : "bg-emerald-50 border-emerald-200 text-emerald-800"}`}>
              Running silver balance: <span className="font-mono-num font-semibold">{gm(balance)}</span> {balance > 0.05 ? "currently held" : "— fully settled"}
            </div>
          )}
          <p className="text-[11px] text-slate-400 mt-2">Material weight will be issued separately using "+ Issue Material" once assigned.</p>
        </>
      )}
    </Modal>
  );
}

/* ============================== ISSUE MATERIAL MODAL ============================== */
function IssueMaterialModal({ stageName, jc, carried, tiers, onClose, onIssue }) {
  const pureLabel = pureTierLabel(tiers);
  const isSetting = stageName === "Setting";
  const defaultPurity = (stageName === "Casting" || stageName === "Jadai") ? pureLabel : carried.purity;
  const [weight, setWeight] = useState(stageName === "Casting" ? "" : String(carried.weight || ""));
  const [purity, setPurity] = useState(defaultPurity);
  const [pieceCount, setPieceCount] = useState(jc.pieceCount || 1);
  const w = parseFloat(weight);
  const pc = parseInt(pieceCount, 10) || 0;
  const valid = w > 0 && (!isSetting || pc > 0);
  return (
    <Modal title={`Issue Material — ${stageName}`} onClose={onClose} footer={
      <>
        <button disabled={!valid} onClick={() => valid && onIssue({ material: "Silver", purity, issuedWeight: w, pieceCount: isSetting ? pc : undefined })}
          className={`h-7 px-3 rounded text-[12px] font-medium ${valid ? "bg-blue-800 text-white hover:bg-blue-900" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>
          Issue
        </button>
        <button onClick={onClose} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Cancel</button>
      </>
    }>
      <FormRow label="Purity" hint="Locked to this job card's target purity.">
        <div className="h-8 px-2 flex items-center text-[12px] text-slate-700 bg-slate-50 rounded border border-slate-100 font-mono-num">{purity}</div>
      </FormRow>
      <FormRow label="Weight (g) *">
        <input type="number" step="0.001" min="0" autoFocus className={inputCls} value={weight} onChange={e => setWeight(e.target.value)} placeholder="0.000" />
      </FormRow>
      {isSetting && (
        <FormRow label="Number of pieces *" hint="Carried from the batch — confirm or adjust if this assignment covers fewer pieces.">
          <input type="number" step="1" min="1" className={inputCls} value={pieceCount} onChange={e => setPieceCount(e.target.value)} />
        </FormRow>
      )}
      {stageName === "Casting" && <p className="text-[11px] text-slate-400">Casting always issues pure silver ({pureLabel}) — returned amount will be converted to the job card's target purity on reconcile.</p>}
    </Modal>
  );
}

/* ============================== RECONCILE MODAL ============================== */
function ReconcileModal({ stageName, issue, jc, tiers, baseRate, defaultRates, editMode, initialData, onClose, onReconcile }) {
  const isCasting = stageName === "Casting";
  const isMeenakari = stageName === "Meenakari";
  const isSetting = stageName === "Setting";
  const [returnedWeight, setReturnedWeight] = useState(editMode ? String(issue.returnedWeight) : "");
  const [returnedPurity, setReturnedPurity] = useState(isCasting ? jc.targetPurity : issue.purity);
  const [dustWeight, setDustWeight] = useState(editMode && initialData ? initialData.dustWeight : 0);
  const [wastagePercent, setWastagePercent] = useState(isCasting ? defaultRates.castingWastagePct : "");
  const [ratePerGm, setRatePerGm] = useState(editMode && initialData && initialData.ratePerGm != null ? initialData.ratePerGm : defaultRates.meenakariRatePerGm);
  const [flatLabour, setFlatLabour] = useState(editMode && initialData && initialData.flatLabourAmount != null ? initialData.flatLabourAmount : (defaultRates.flatLabour != null ? String(defaultRates.flatLabour) : ""));
  const [pieceCount, setPieceCount] = useState(editMode && initialData && initialData.pieceCount != null ? initialData.pieceCount : (issue.issuedPieceCount || jc.pieceCount || 1));
  const w = parseFloat(returnedWeight);
  const wp = parseFloat(wastagePercent) || 0;
  const dw = parseFloat(dustWeight) || 0;
  const rpg = parseFloat(ratePerGm) || 0;
  const fl = parseFloat(flatLabour) || 0;
  const pc = parseInt(pieceCount, 10) || 0;
  const finishedWeight = (isMeenakari || isSetting) ? +(issue.issuedWeight - dw).toFixed(3) : null;
  const valid = isMeenakari ? (dw >= 0 && dw < issue.issuedWeight && rpg > 0 && pc > 0)
    : isSetting ? (dw >= 0 && dw < issue.issuedWeight && fl > 0 && pc > 0)
    : w > 0;
  const wastageAmount = isCasting && w > 0 ? computeLabourAmount("Wastage %", w, wp, returnedPurity, tiers, baseRate) : null;
  const meenakariLabour = isMeenakari && finishedWeight > 0 ? finishedWeight * rpg : null;

  function submit() {
    if (isMeenakari) {
      onReconcile({ returnedWeight: finishedWeight, returnedPurity: issue.purity, dustWeight: dw, wastagePercent: null, ratePerGm: rpg, pieceCount: pc });
    } else if (isSetting) {
      onReconcile({ returnedWeight: finishedWeight, returnedPurity: issue.purity, dustWeight: dw, wastagePercent: null, flatLabourAmount: fl, pieceCount: pc });
    } else {
      onReconcile({ returnedWeight: w, returnedPurity, dustWeight: dw, wastagePercent: isCasting ? wp : null });
    }
  }

  return (
    <Modal title={`${editMode ? "Edit" : "Receive &"} ${editMode ? "Output" : "Reconcile"} — ${stageName}`} onClose={onClose} footer={
      <>
        <button disabled={!valid} onClick={() => valid && submit()}
          className={`h-7 px-3 rounded text-[12px] font-medium ${valid ? "bg-blue-800 text-white hover:bg-blue-900" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>
          {editMode ? "Save Changes" : "Reconcile"}
        </button>
        <button onClick={onClose} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Cancel</button>
      </>
    }>
      <div className="text-[11px] text-slate-500 mb-3 pb-3 border-b border-slate-100">
        Issued: <span className="font-mono-num text-slate-800">{gm(issue.issuedWeight)} @ {issue.purity}</span> on {issue.issueDate}
      </div>

      {isMeenakari ? (
        <>
          <p className="text-[11px] text-slate-500 mb-3">Karigar returns finished material + gold dust only — no stones. Finished weight is issued weight minus dust, and labour is charged per gram of that finished weight.</p>
          <FormRow label="Number of pieces *" hint="Not all pieces always go to the same karigar — set how many this assignment covers.">
            <input type="number" step="1" min="1" className={inputCls} value={pieceCount} onChange={e => setPieceCount(e.target.value)} />
          </FormRow>
          <FormRow label="Gold dust recovered (g) *" hint="Returned to us — deducted straight from the issued weight to get the finished weight.">
            <input type="number" step="0.001" min="0" autoFocus className={inputCls} value={dustWeight} onChange={e => setDustWeight(e.target.value)} placeholder="0.000" />
          </FormRow>
          <FormRow label="Labour rate (₹ per gram, on finished weight)">
            <input type="number" step="1" min="0" className={inputCls} value={ratePerGm} onChange={e => setRatePerGm(e.target.value)} />
          </FormRow>
          {finishedWeight != null && (
            <div className="bg-slate-50 border border-slate-100 rounded p-2.5 text-[12px] space-y-1">
              <div className="flex items-center justify-between"><span className="text-slate-600">Finished product weight</span><span className="font-mono-num text-slate-900">{gm(issue.issuedWeight)} − {gm(dw)} = {gm(finishedWeight)} @ {issue.purity} · {pc} pcs</span></div>
              {meenakariLabour != null && <div className="flex items-center justify-between pt-1 border-t border-slate-200 font-semibold"><span className="text-slate-700">Labour (auto-added)</span><span className="font-mono-num text-slate-900">₹{rpg}/gm × {gm(finishedWeight)} = {money(meenakariLabour)}</span></div>}
            </div>
          )}
        </>
      ) : isSetting ? (
        <>
          <p className="text-[11px] text-slate-500 mb-3">Karigar returns finished material + gold/silver dust. Finished weight is issued weight minus dust. Labour is a flat amount — no formula.</p>
          <FormRow label="Number of pieces *" hint="Not all pieces always go to the same karigar.">
            <input type="number" step="1" min="1" className={inputCls} value={pieceCount} onChange={e => setPieceCount(e.target.value)} />
          </FormRow>
          <FormRow label="Gold/silver dust recovered (g) *" hint="Deducted straight from the issued weight to get the finished weight.">
            <input type="number" step="0.001" min="0" autoFocus className={inputCls} value={dustWeight} onChange={e => setDustWeight(e.target.value)} placeholder="0.000" />
          </FormRow>
          <FormRow label="Labour (₹) — flat, entered manually">
            <input type="number" step="1" min="0" className={inputCls} value={flatLabour} onChange={e => setFlatLabour(e.target.value)} placeholder="0" />
          </FormRow>
          {finishedWeight != null && (
            <div className="bg-slate-50 border border-slate-100 rounded p-2.5 text-[12px] space-y-1">
              <div className="flex items-center justify-between"><span className="text-slate-600">Finished product weight</span><span className="font-mono-num text-slate-900">{gm(issue.issuedWeight)} − {gm(dw)} = {gm(finishedWeight)} @ {issue.purity} · {pc} pcs</span></div>
              {fl > 0 && <div className="flex items-center justify-between pt-1 border-t border-slate-200 font-semibold"><span className="text-slate-700">Labour (auto-added)</span><span className="font-mono-num text-slate-900">{money(fl)}</span></div>}
            </div>
          )}
          <p className="text-[10px] text-slate-400 mt-2">Stone issue/return for Setting is handled separately via "Issue Stones" on this assignment.</p>
        </>
      ) : (
        <>
          <FormRow label="Returned weight (g) *">
            <input type="number" step="0.001" min="0" autoFocus className={inputCls} value={returnedWeight} onChange={e => setReturnedWeight(e.target.value)} placeholder="0.000" />
          </FormRow>
          <FormRow label="Returned purity" hint={isCasting ? "Karigar can return at any purity — wastage is charged against this purity's rate, not the issued 24K rate." : undefined}>
            <select className={inputCls} value={returnedPurity} onChange={e => setReturnedPurity(e.target.value)}>
              {(isCasting ? tiers : [...new Set([issue.purity, jc.targetPurity])].map(p => ({ label: p }))).map(t => <option key={t.label} value={t.label}>{t.label}</option>)}
            </select>
          </FormRow>
          <FormRow label="Silver dust recovered (g)" hint="Informational — recovered separately for refining.">
            <input type="number" step="0.001" min="0" className={inputCls} value={dustWeight} onChange={e => setDustWeight(e.target.value)} />
          </FormRow>
          {isCasting && (
            <>
              <FormRow label="Wastage % (charged on returned weight @ returned purity)" hint="Charged automatically against the purity the karigar actually returns — added straight to his labour on reconcile.">
                <input type="number" step="0.1" min="0" className={inputCls} value={wastagePercent} onChange={e => setWastagePercent(e.target.value)} />
              </FormRow>
              {wastageAmount != null && (
                <div className="bg-slate-50 border border-slate-100 rounded p-2.5 flex items-center justify-between text-[12px]">
                  <span className="text-slate-600">Wastage charge (auto-added to labour)</span>
                  <span className="font-mono-num font-semibold text-slate-900">{money(wastageAmount)}</span>
                </div>
              )}
            </>
          )}
        </>
      )}
    </Modal>
  );
}

/* ============================== CAST OUTPUT MODAL (Casting only — drawn from karigar's running bulk stock) ============================== */
function CastOutputModal({ jc, tiers, baseRate, defaultRates, onClose, onRecord }) {
  const [returnedWeight, setReturnedWeight] = useState("");
  const returnedPurity = jc.targetPurity;
  const [wastagePercent, setWastagePercent] = useState(defaultRates.castingWastagePct);
  const [pieceCount, setPieceCount] = useState(jc.pieceCount || 1);
  const w = parseFloat(returnedWeight);
  const wp = parseFloat(wastagePercent) || 0;
  const pc = parseInt(pieceCount, 10) || 0;
  const valid = w > 0 && pc > 0;
  const wastageWeight = w > 0 ? +(w * (wp / 100)).toFixed(3) : 0;
  const totalWeight = w > 0 ? +(w + wastageWeight).toFixed(3) : 0;
  return (
    <Modal title="Record Cast Output" onClose={onClose} footer={
      <>
        <button disabled={!valid} onClick={() => valid && onRecord({ returnedWeight: w, returnedPurity, wastagePercent: wp, wastageWeight, pieceCount: pc })}
          className={`h-7 px-3 rounded text-[12px] font-medium ${valid ? "bg-blue-800 text-white hover:bg-blue-900" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>
          Record Output
        </button>
        <button onClick={onClose} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Cancel</button>
      </>
    }>
      <p className="text-[11px] text-slate-500 mb-3">Drawn from the karigar's running 24K stock (tracked in Karigar Ledger) — no per-job material issue, and no dust recovery, in this step.</p>
      <FormRow label="Returned weight (g) — finished piece(s) *">
        <input type="number" step="0.001" min="0" autoFocus className={inputCls} value={returnedWeight} onChange={e => setReturnedWeight(e.target.value)} placeholder="0.000" />
      </FormRow>
      <FormRow label="Purity" hint="Locked to this job card's target purity — every stage on this job card produces the same purity.">
        <div className="h-8 px-2 flex items-center text-[12px] text-slate-700 bg-slate-50 rounded border border-slate-100 font-mono-num">{returnedPurity}</div>
      </FormRow>
      <FormRow label="Number of pieces *" hint="Total quantity cast in this batch — carries forward automatically through Meenakari and into Jadai.">
        <input type="number" step="1" min="1" className={inputCls} value={pieceCount} onChange={e => setPieceCount(e.target.value)} />
      </FormRow>
      <FormRow label="Wastage % (charged as extra weight, not cash)" hint="No separate labour charge on Casting — wastage is charged in silver, deducted from the karigar's stock on top of the finished weight.">
        <input type="number" step="0.1" min="0" className={inputCls} value={wastagePercent} onChange={e => setWastagePercent(e.target.value)} />
      </FormRow>
      {valid && (
        <div className="bg-slate-50 border border-slate-100 rounded p-2.5 text-[12px] space-y-1">
          <div className="flex items-center justify-between"><span className="text-slate-600">Finished weight returned</span><span className="font-mono-num text-slate-900">{gm(w)} @ {returnedPurity} · {pc} pcs</span></div>
          <div className="flex items-center justify-between"><span className="text-slate-600">Wastage ({wp}%) — valued @ {pureTierLabel(tiers)}</span><span className="font-mono-num text-amber-700">+ {gm(wastageWeight)}</span></div>
          <div className="flex items-center justify-between pt-1 border-t border-slate-200 font-semibold"><span className="text-slate-700">Charged to ledger</span><span className="font-mono-num text-slate-900">{gm(w)}@{returnedPurity} + {gm(wastageWeight)}@{pureTierLabel(tiers)}</span></div>
          <p className="text-[10px] text-slate-400 pt-1">Wastage is raw silver lost before dilution — priced at pure {pureTierLabel(tiers)}, not the finished piece's {returnedPurity} rate.</p>
        </div>
      )}
    </Modal>
  );
}

/* ============================== JADAI OUTPUT MODAL (Jadai only — also drawn from karigar's running bulk stock) ============================== */
function JadaiOutputModal({ jc, tiers, baseRate, defaultRates, onClose, onRecord }) {
  const pureLabel = pureTierLabel(tiers);
  const [pieceCount, setPieceCount] = useState(jc.pieceCount || 1);
  const [weight, setWeight] = useState("");
  const [labourAmount, setLabourAmount] = useState(defaultRates.flatLabour != null ? String(defaultRates.flatLabour) : "");
  const [stoneRows, setStoneRows] = useState([]);
  const pc = parseInt(pieceCount, 10) || 0;
  const w = parseFloat(weight);
  const labour = parseFloat(labourAmount) || 0;
  const valid = pc > 0 && w > 0;
  const kundanValue = w > 0 ? w * baseRate : 0;

  function addStoneRow() { setStoneRows(prev => [...prev, { id: "r" + Date.now(), name: "", pieces: "", carat: "", rate: "" }]); }
  function updateStoneRow(id, field, value) { setStoneRows(prev => prev.map(r => r.id === id ? { ...r, [field]: value } : r)); }
  function removeStoneRow(id) { setStoneRows(prev => prev.filter(r => r.id !== id)); }
  const totalStoneValue = stoneRows.reduce((s, r) => s + ((parseFloat(r.carat) || 0) * (parseFloat(r.rate) || 0)), 0);

  function submit() {
    const stones = stoneRows.filter(r => r.name.trim() && parseFloat(r.carat) > 0).map(r => ({
      name: r.name.trim(), pieces: parseInt(r.pieces, 10) || 0, carat: parseFloat(r.carat) || 0, rate: parseFloat(r.rate) || 0,
      finalAmount: +(((parseFloat(r.carat) || 0) * (parseFloat(r.rate) || 0)).toFixed(2)),
    }));
    onRecord({ pieceCount: pc, weight: w, labourAmount: labour, stones });
  }

  return (
    <Modal title="Record Jadai Output" onClose={onClose} width="520px" footer={
      <>
        <button disabled={!valid} onClick={() => valid && submit()}
          className={`h-7 px-3 rounded text-[12px] font-medium ${valid ? "bg-blue-800 text-white hover:bg-blue-900" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>
          Record Output
        </button>
        <button onClick={onClose} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Cancel</button>
      </>
    }>
      <p className="text-[11px] text-slate-500 mb-3">Drawn from the karigar's running {pureLabel} stock (tracked in Karigar Ledger). No dust, no wastage on Jadai — full weight returns as-is.</p>
      <FormRow label="Number of pieces issued *" hint="Carried from Casting/Meenakari — confirm or adjust if this batch differs.">
        <input type="number" step="1" min="1" className={inputCls} value={pieceCount} onChange={e => setPieceCount(e.target.value)} />
      </FormRow>
      <FormRow label={`Kundan gold weight (g) @ ${pureLabel} *`} hint="Kundan is treated as pure 24K — priced and deducted from the karigar's stock at the 24K rate.">
        <input type="number" step="0.001" min="0" className={inputCls} value={weight} onChange={e => setWeight(e.target.value)} placeholder="0.000" />
      </FormRow>
      {w > 0 && <p className="text-[11px] text-slate-500 -mt-2 mb-3">Kundan gold value: <span className="font-mono-num text-slate-800">{money(kundanValue)}</span> @ 24K rate</p>}
      <FormRow label="Labour (₹) — entered manually" hint="No formula here — type the total labour amount directly.">
        <input type="number" step="1" min="0" className={inputCls} value={labourAmount} onChange={e => setLabourAmount(e.target.value)} placeholder="0" />
      </FormRow>

      <div className="border-t border-slate-100 pt-3 mt-1">
        <div className="flex items-center justify-between mb-2">
          <span className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Polki / Diamond Issued</span>
          <button onClick={addStoneRow} className="h-6 px-2 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1">
            <Icon name="plus" className="w-3 h-3" /> Add Stone
          </button>
        </div>
        {stoneRows.length === 0 && <p className="text-[11px] text-slate-400 mb-2">Koi stone abhi add nahi hui — "+ Add Stone" se Polki ya Diamond add karein.</p>}
        {stoneRows.map(row => {
          const finalAmt = (parseFloat(row.carat) || 0) * (parseFloat(row.rate) || 0);
          return (
            <div key={row.id} className="bg-slate-50 border border-slate-100 rounded p-2 mb-2">

const FINDING_TYPE_PRESETS = ["Wire", "Push Cap", "Clip Cap", "Other"];
const FLAT_ITEM_PRESETS = ["Diamond", "Stone", "Other"];
function FindingOutputModal({ jc, tiers, baseRate, defaultRates, onClose, onRecord }) {
  const [pieceCount, setPieceCount] = useState(jc.pieceCount || 1);
  const [findingRows, setFindingRows] = useState([]);
  const [labourAmount, setLabourAmount] = useState(defaultRates.flatLabour != null ? String(defaultRates.flatLabour) : "");
  const [itemRows, setItemRows] = useState([]);
  const pc = parseInt(pieceCount, 10) || 0;
  const labour = parseFloat(labourAmount) || 0;

  function addFindingRow() { setFindingRows(prev => [...prev, { id: "r" + Date.now(), typePreset: "Wire", customType: "", weight: "" }]); }
  function updateFindingRow(id, field, value) { setFindingRows(prev => prev.map(r => r.id === id ? { ...r, [field]: value } : r)); }
  function removeFindingRow(id) { setFindingRows(prev => prev.filter(r => r.id !== id)); }

  function addItemRow() { setItemRows(prev => [...prev, { id: "i" + Date.now(), typePreset: "Diamond", customType: "", amount: "", carat: "" }]); }
  function updateItemRow(id, field, value) { setItemRows(prev => prev.map(r => r.id === id ? { ...r, [field]: value } : r)); }
  function removeItemRow(id) { setItemRows(prev => prev.filter(r => r.id !== id)); }

  const pureLabel = pureTierLabel(tiers);
  const findingsTotalWeight = findingRows.reduce((s, r) => s + (parseFloat(r.weight) || 0), 0);
  const findingsTotalValue = findingsTotalWeight * rateForLabel(pureLabel, tiers, baseRate);
  const itemsTotalValue = itemRows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  const validFindings = findingRows.filter(r => (r.typePreset === "Other" ? r.customType.trim() : r.typePreset) && parseFloat(r.weight) > 0);
  const validItems = itemRows.filter(r => (r.typePreset === "Other" ? r.customType.trim() : r.typePreset) && parseFloat(r.amount) > 0);
  const valid = pc > 0 && (validFindings.length > 0 || validItems.length > 0 || labour > 0);

  function submit() {
    onRecord({
      pieceCount: pc,
      findings: validFindings.map(r => ({ type: r.typePreset === "Other" ? r.customType.trim() : r.typePreset, weight: parseFloat(r.weight), karat: pureLabel })),
      labourAmount: labour,
      items: validItems.map(r => ({ type: r.typePreset === "Other" ? r.customType.trim() : r.typePreset, amount: parseFloat(r.amount), carat: parseFloat(r.carat) || 0 })),
    });
  }

  return (
    <Modal title="Record Fitting Output" onClose={onClose} width="540px" footer={
      <>
        <button disabled={!valid} onClick={() => valid && submit()}
          className={`h-7 px-3 rounded text-[12px] font-medium ${valid ? "bg-blue-800 text-white hover:bg-blue-900" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}>
          Record Output
        </button>
        <button onClick={onClose} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Cancel</button>
      </>
    }>
      <p className="text-[11px] text-slate-500 mb-3">Final stage — all in-house. Silver findings (wire, caps, clips) are pure silver ({pureLabel}) — same treatment as Casting and Jadai — drawn from the karigar's running stock. Everything else is flat-priced.</p>
      <FormRow label="Number of pieces *">
        <input type="number" step="1" min="1" className={inputCls} value={pieceCount} onChange={e => setPieceCount(e.target.value)} />
      </FormRow>

      <div className="border-t border-slate-100 pt-3 mt-1">
        <div className="flex items-center justify-between mb-2">
          <span className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Silver Findings — pure {pureLabel}, from stock</span>
          <button onClick={addFindingRow} className="h-6 px-2 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1"><Icon name="plus" className="w-3 h-3" /> Add Finding</button>
        </div>
        {findingRows.length === 0 && <p className="text-[11px] text-slate-400 mb-2">Koi finding abhi add nahi hui.</p>}
        {findingRows.map(row => {
          const val = (parseFloat(row.weight) || 0) * rateForLabel(pureLabel, tiers, baseRate);
          return (
            <div key={row.id} className="bg-slate-50 border border-slate-100 rounded p-2 mb-2">
              <div className="flex items-center gap-1.5 mb-1.5">
                <select value={row.typePreset} onChange={e => updateFindingRow(row.id, "typePreset", e.target.value)} className={`${inputClsSm} w-28`}>
                  {FINDING_TYPE_PRESETS.map(t => <option key={t}>{t}</option>)}
                </select>
                {row.typePreset === "Other" && <input placeholder="Custom name" value={row.customType} onChange={e => updateFindingRow(row.id, "customType", e.target.value)} className={`${inputClsSm} flex-1`} />}
                <input type="number" step="0.001" min="0" placeholder="Weight (g)" value={row.weight} onChange={e => updateFindingRow(row.id, "weight", e.target.value)} className={`${inputClsSm} flex-1`} />
                <span className="text-[11px] text-slate-500 font-mono-num w-12 text-center">{pureLabel}</span>
                <button onClick={() => removeFindingRow(row.id)} className="w-6 h-6 rounded hover:bg-rose-50 text-rose-500 grid place-items-center shrink-0"><Icon name="x" className="w-3.5 h-3.5" /></button>
              </div>
              {val > 0 && <div className="text-[11px] text-slate-500 text-right">= {money(val)} @ {pureLabel}</div>}
            </div>
          );
        })}
      </div>

      <FormRow label="Labour (₹) — flat, entered manually">
        <input type="number" step="1" min="0" className={inputCls} value={labourAmount} onChange={e => setLabourAmount(e.target.value)} placeholder="0" />
      </FormRow>

      <div className="border-t border-slate-100 pt-3 mt-1">
        <div className="flex items-center justify-between mb-2">
          <span className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Other Flat Items (diamond, stone, etc.)</span>
          <button onClick={addItemRow} className="h-6 px-2 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1"><Icon name="plus" className="w-3 h-3" /> Add Item</button>
        </div>
        <p className="text-[10px] text-slate-400 mb-2">Carat is optional — if given, that stone's weight also adds to the finished piece's gross weight.</p>
        {itemRows.map(row => (
          <div key={row.id} className="flex items-center gap-1.5 mb-2">
            <select value={row.typePreset} onChange={e => updateItemRow(row.id, "typePreset", e.target.value)} className={`${inputClsSm} w-24`}>
              {FLAT_ITEM_PRESETS.map(t => <option key={t}>{t}</option>)}
            </select>
            {row.typePreset === "Other" && <input placeholder="Custom name" value={row.customType} onChange={e => updateItemRow(row.id, "customType", e.target.value)} className={`${inputClsSm} flex-1`} />}
            <input type="number" step="1" min="0" placeholder="Amount ₹" value={row.amount} onChange={e => updateItemRow(row.id, "amount", e.target.value)} className={`${inputClsSm} flex-1`} />
            <input type="number" step="0.01" min="0" placeholder="Carat (optional)" value={row.carat} onChange={e => updateItemRow(row.id, "carat", e.target.value)} className={`${inputClsSm} w-28`} />
            <button onClick={() => removeItemRow(row.id)} className="w-6 h-6 rounded hover:bg-rose-50 text-rose-500 grid place-items-center shrink-0"><Icon name="x" className="w-3.5 h-3.5" /></button>
          </div>
        ))}
      </div>

      {valid && (
        <div className="bg-slate-50 border border-slate-100 rounded p-2.5 text-[12px] space-y-1">
          {findingsTotalWeight > 0 && <div className="flex items-center justify-between"><span className="text-slate-600">Findings deducted from stock</span><span className="font-mono-num text-slate-900">{gm(findingsTotalWeight)} ({money(findingsTotalValue)})</span></div>}
          {labour > 0 && <div className="flex items-center justify-between"><span className="text-slate-600">Labour</span><span className="font-mono-num text-slate-900">{money(labour)}</span></div>}
          {itemsTotalValue > 0 && <div className="flex items-center justify-between"><span className="text-slate-600">Other items</span><span className="font-mono-num text-slate-900">{money(itemsTotalValue)}</span></div>}
        </div>
      )}
    </Modal>
  );
}

/* ============================== LABOUR FORM (inline, not modal) ============================== */
function LabourForm({ stageName, tiers, baseRate, defaultRates, currentPurity, onAdd }) {
  const [basis, setBasis] = useState("Wastage %");
  const [qty, setQty] = useState("");
  const [rate, setRate] = useState("");
  const [purity, setPurity] = useState(currentPurity);

  function pullFormula() {
    if (stageName === "Casting") { setBasis("Wastage %"); setRate(String(defaultRates.castingWastagePct)); }
    else if (stageName === "Fitting") { setBasis("Wastage %"); setRate(String(defaultRates.fittingWastagePct)); }
    else if (stageName === "Meenakari") { setBasis("Per Gram"); setRate(String(defaultRates.meenakariRatePerGm)); }
    else if (stageName === "Jadai") { setBasis("Per Stone"); setRate(String(defaultRates.jadaiRatePerStone)); }
    else if (stageName === "Setting") { setBasis("Per Stone"); setRate(String(defaultRates.settingRatePerStone)); }
  }

  const q = parseFloat(qty) || 0, r = parseFloat(rate) || 0;
  const amount = basis === "Flat" ? r : computeLabourAmount(basis, q, r, purity, tiers, baseRate);
  const valid = basis === "Flat" ? r > 0 : (q > 0 && r > 0);

  return (
    <div className="bg-slate-50/60 border border-slate-100 rounded p-2 mt-2">
      <div className="flex items-center gap-1.5 flex-wrap">
        <select value={basis} onChange={e => setBasis(e.target.value)} className={`${inputClsSm} w-28`}>
          {LABOUR_BASIS_OPTIONS.map(b => <option key={b}>{b}</option>)}
        </select>
        {basis !== "Flat" && <input type="number" step="0.001" placeholder="Qty" value={qty} onChange={e => setQty(e.target.value)} className={`${inputClsSm} w-20`} />}
        <input type="number" step="0.1" placeholder={basis === "Flat" ? "Amount" : "Rate (optional)"} value={rate} onChange={e => setRate(e.target.value)} className={`${inputClsSm} w-24`} />
        {basis === "Wastage %" && (
          <select value={purity} onChange={e => setPurity(e.target.value)} className={`${inputClsSm} w-16`}>
            {tiers.map(t => <option key={t.id} value={t.label}>{t.label}</option>)}
          </select>
        )}
        <button onClick={pullFormula} className="h-7 px-2 rounded bg-blue-800 text-white text-[11px] font-medium hover:bg-blue-900">Pull Formula</button>
        <button disabled={!valid} onClick={() => valid && onAdd({ basis, qty: q, rate: r, purity, amount, note: basis === "Wastage %" ? `${r}% wastage × ${q}g @${purity}` : basis === "Per Gram" ? `₹${r}/gm × ${q}g` : basis === "Per Stone" ? `${q} × ₹${r}/stone` : `Flat ₹${r}` })}
          className={`h-7 px-3 rounded text-[11px] font-medium ${valid ? "bg-emerald-600 text-white hover:bg-emerald-700" : "bg-slate-200 text-slate-400 cursor-not-allowed"}`}>Add</button>
        {valid && <span className="text-[11px] font-mono-num text-slate-600 ml-1">= {money(amount)}</span>}
      </div>
    </div>
  );
}

/* ============================== ASSIGNMENT BLOCK ============================== */
function AssignmentBlock({ jc, stageName, assignment, stageStatus, tiers, baseRate, defaultRates, karigars, onIssueMaterial, onReconcile, onEditReconcile, onCancelReconcile, onRecordCastOutput, onRecordJadaiOutput, onRecordFittingOutput, onAddLabour, onRemoveLabour, onIssueStones, onReturnStones }) {
  const karigarObj = (karigars || []).find(k => k.name === assignment.karigar);
  const effectiveDefaults = {
    ...defaultRates,
    castingWastagePct: karigarObj?.defaultWastagePct ?? defaultRates.castingWastagePct,
    fittingWastagePct: karigarObj?.defaultWastagePct ?? defaultRates.fittingWastagePct,
    meenakariRatePerGm: karigarObj?.defaultRatePerGm ?? defaultRates.meenakariRatePerGm,
    flatLabour: karigarObj?.defaultFlatLabour ?? null,
  };
  const [modal, setModal] = useState(null);
  const t = assignmentTotals(assignment);
  const locked = stageStatus === "Approved";
  const carried = carriedSilver(jc, tiers);
  const currentPurity = assignment.issues.length ? (assignment.issues[assignment.issues.length - 1].returnedPurity || assignment.issues[assignment.issues.length - 1].purity) : carried.purity;
  const isCasting = stageName === "Casting";
  const isJadai = stageName === "Jadai";
  const isFitting = stageName === "Fitting";
  const isMeenakari = stageName === "Meenakari";
  const isBulkStage = isCasting || isJadai || isFitting;
  const autoLabourStage = isCasting || isJadai || isFitting || isMeenakari;

  return (
    <div className="border border-slate-100 rounded p-2.5">
      <div className="flex items-center gap-2 mb-2">
        <Avatar name={assignment.karigar} />
        <span className="text-[12px] font-medium text-slate-900">{assignment.karigar}</span>
      </div>

      {isBulkStage ? (
        <>
          {assignment.issues.map(issue => (
            <div key={issue.id} className="flex items-center justify-between text-[11px] py-1 border-b border-slate-50 last:border-b-0">
              <span className="text-slate-600">{isCasting ? "Cast" : isJadai ? "Jadai" : "Finding"} output <span className="font-mono-num text-emerald-700">{gm(issue.returnedWeight)} @ {issue.returnedPurity}</span>{issue.pieceCount != null && <span className="font-mono-num text-slate-500"> · {issue.pieceCount} pcs</span>}
                {issue.wastageWeight > 0 && <span className="font-mono-num text-amber-700"> + {gm(issue.wastageWeight)} wastage ({issue.wastagePercent}%, valued @ {pureTierLabel(tiers)}) = {gm(issue.returnedWeight + issue.wastageWeight)} total charged</span>}
              </span>
              <span className="text-slate-400 font-mono-num">{issue.returnDate} · from bulk stock</span>
            </div>
          ))}
          {(isJadai || isFitting) && assignment.stones.map(st => (
            <div key={st.id} className="flex items-center justify-between text-[11px] py-1 border-b border-slate-50 last:border-b-0">
              <span className="text-slate-600">{st.type} · {st.qtyIssued} <span className="font-mono-num text-slate-900">{money(st.valueIssued)}</span></span>
              {st.qtyReturned ? (
                <span className="text-amber-700 font-mono-num">returned {st.qtyReturned} ({money(st.valueReturned)})</span>
              ) : !locked && st.carat > 0 && (
                <button onClick={() => setModal({ type: "stoneReturn", stone: st })} className="h-6 px-2 rounded border border-slate-200 text-[10px] text-slate-600 hover:bg-slate-50">Return unused</button>
              )}
            </div>
          ))}
          {assignment.issues.length === 0 && <p className="text-[11px] text-slate-400">Abhi tak koi output record nahi hua.</p>}
          {!locked && (
            <button onClick={() => setModal({ type: isCasting ? "castOutput" : isJadai ? "jadaiOutput" : "findingOutput" })} className="h-6 px-2 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1 mt-2">
              <Icon name="plus" className="w-3 h-3" /> Record {isCasting ? "Cast" : isJadai ? "Jadai" : "Fitting"} Output
            </button>
          )}
        </>
      ) : (
        <>
          {assignment.issues.map(issue => (
            <div key={issue.id} className="flex items-center justify-between text-[11px] py-1 border-b border-slate-50 last:border-b-0">
              <span className="text-slate-600">Silver · {issue.purity} <span className="font-mono-num text-slate-900">{gm(issue.issuedWeight)}</span></span>
              <div className="flex items-center gap-2">
                {issue.status === "Reconciled" && <span className="font-mono-num text-emerald-700">→ {gm(issue.returnedWeight)} @ {issue.returnedPurity}{issue.pieceCount != null && ` · ${issue.pieceCount} pcs`}</span>}
                <span className={`inline-flex items-center h-5 px-1.5 rounded border text-[10px] font-medium ${ISSUE_STATUS_STYLE[issue.status]}`}>{issue.status}</span>
                {issue.status === "Issued" && !locked && (
                  <button onClick={() => setModal({ type: "reconcile", issue })} className="h-6 px-2 rounded bg-blue-800 text-white text-[10px] font-medium hover:bg-blue-900">Receive & Reconcile (प्राप्त करें)</button>
                )}
                {issue.status === "Reconciled" && !locked && (
                  <>
                    <button onClick={() => setModal({ type: "reconcile", issue, editMode: true })} className="h-6 px-2 rounded border border-slate-200 text-[10px] text-slate-600 hover:bg-slate-50">Edit</button>
                    <button onClick={() => { if (window.confirm("Cancel this reconciliation and revert to pending?")) onCancelReconcile(issue.id); }} className="h-6 px-2 rounded border border-rose-200 text-[10px] text-rose-600 hover:bg-rose-50">Cancel</button>
                  </>
                )}
              </div>
            </div>
          ))}

          {!isMeenakari && assignment.stones.map(st => (
            <div key={st.id} className="flex items-center justify-between text-[11px] py-1 border-b border-slate-50 last:border-b-0">
              <span className="text-slate-600">{st.type} · {st.qtyIssued} <span className="font-mono-num text-slate-900">{money(st.valueIssued)}</span></span>
              {st.qtyReturned ? (
                <span className="text-amber-700 font-mono-num">returned {st.qtyReturned} ({money(st.valueReturned)})</span>
              ) : !locked && (
                <button onClick={() => setModal({ type: "stoneReturn", stone: st })} className="h-6 px-2 rounded border border-slate-200 text-[10px] text-slate-600 hover:bg-slate-50">Return unused</button>
              )}
            </div>
          ))}

          {!locked && (
            <div className="flex items-center gap-2 mt-2">
              <button onClick={() => setModal({ type: "issue" })} className="h-6 px-2 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1">
                <Icon name="plus" className="w-3 h-3" /> Issue Material
              </button>
              {!isMeenakari && (
                <button onClick={() => setModal({ type: "stone" })} className="h-6 px-2 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1">
                  <Icon name="plus" className="w-3 h-3" /> Issue Stones
                </button>
              )}
            </div>
          )}
        </>
      )}

      <div className="mt-2 pt-2 border-t border-slate-100">
        <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1">Labour</div>
        {assignment.labour.map(l => (
          <div key={l.id} className="flex items-center justify-between text-[11px] py-0.5">
            <span className="text-slate-600">{l.note}</span>
            <div className="flex items-center gap-2">
              <span className="font-mono-num text-slate-900 font-medium">{money(l.amount)}</span>
              {!locked && <button onClick={() => onRemoveLabour(l.id)} className="text-slate-300 hover:text-rose-600"><Icon name="x" className="w-3 h-3" /></button>}
            </div>
          </div>
        ))}
        {assignment.labour.length === 0 && <p className="text-[11px] text-slate-400">No labour entries yet.</p>}
        {t.labour > 0 && <div className="flex items-center justify-between text-[11px] pt-1 mt-1 border-t border-slate-50 font-semibold"><span className="text-slate-500">Subtotal</span><span className="font-mono-num text-slate-900">{money(t.labour)}</span></div>}
        {!locked && !autoLabourStage && <LabourForm stageName={stageName} tiers={tiers} baseRate={baseRate} defaultRates={defaultRates} currentPurity={currentPurity} onAdd={onAddLabour} />}
        {!locked && autoLabourStage && <p className="text-[10px] text-slate-400 mt-1">Labour is charged automatically when you {isMeenakari ? "reconcile this stage" : `record ${isCasting ? "cast" : isJadai ? "Jadai" : "Fitting"} output above`}.</p>}
      </div>

      {modal && modal.type === "issue" && (
        <IssueMaterialModal stageName={stageName} jc={jc} carried={carried} tiers={tiers} onClose={() => setModal(null)}
          onIssue={(data) => { onIssueMaterial(data); setModal(null); }} />
      )}
      {modal && modal.type === "reconcile" && (
        <ReconcileModal stageName={stageName} issue={modal.issue} jc={jc} tiers={tiers} baseRate={baseRate} defaultRates={effectiveDefaults}
          editMode={!!modal.editMode}
          initialData={modal.editMode ? (() => {
            const linked = assignment.labour.find(l => l.id === modal.issue.labourEntryId);
            return {
              dustWeight: modal.issue.dustWeight,
              ratePerGm: linked?.basis === "Per Gram" ? linked.rate : undefined,
              flatLabourAmount: linked?.basis === "Flat" ? linked.rate : undefined,
              pieceCount: modal.issue.pieceCount,
            };
          })() : null}
          onClose={() => setModal(null)}
          onReconcile={(data) => { (modal.editMode ? onEditReconcile : onReconcile)(modal.issue.id, data); setModal(null); }} />
      )}
      {modal && modal.type === "stone" && (
        <StoneModal onClose={() => setModal(null)} onAdd={(data) => { onIssueStones(data); setModal(null); }} />
      )}
      {modal && modal.type === "stoneReturn" && (
        <StoneReturnModal stone={modal.stone} onClose={() => setModal(null)} onReturn={(data) => { onReturnStones(modal.stone.id, data); setModal(null); }} />
      )}
      {modal && modal.type === "castOutput" && (
        <CastOutputModal jc={jc} tiers={tiers} baseRate={baseRate} defaultRates={effectiveDefaults} onClose={() => setModal(null)}
          onRecord={(data) => { onRecordCastOutput(data); setModal(null); }} />
      )}
      {modal && modal.type === "jadaiOutput" && (
        <JadaiOutputModal jc={jc} tiers={tiers} baseRate={baseRate} defaultRates={effectiveDefaults} onClose={() => setModal(null)}
          onRecord={(data) => { onRecordJadaiOutput(data); setModal(null); }} />
      )}
      {modal && modal.type === "findingOutput" && (
        <FindingOutputModal jc={jc} tiers={tiers} baseRate={baseRate} defaultRates={effectiveDefaults} onClose={() => setModal(null)}
          onRecord={(data) => { onRecordFittingOutput(data); setModal(null); }} />
      )}
    </div>
  );
}

/* ============================== STAGE CARD ============================== */
function StageCard({ jc, stage, karigars, ledger, tiers, baseRate, defaultRates, onAddAssignment, onIssueMaterial, onReconcile, onEditReconcile, onCancelReconcile, onRecordCastOutput, onRecordJadaiOutput, onRecordFittingOutput, onAddLabour, onRemoveLabour, onIssueStones, onReturnStones, onApproveStage }) {
  const [showAdd, setShowAdd] = useState(false);
  const isFittingStage = stage.stage === "Fitting";
  const allReconciled = stage.assignments.length > 0 && stage.assignments.every(a => {
    const hasWork = isFittingStage ? (a.issues.length > 0 || a.labour.length > 0 || a.stones.length > 0) : a.issues.length > 0;
    return hasWork && a.issues.every(i => i.status === "Reconciled");
  });
  const canApprove = stage.status !== "Approved" && allReconciled;
  const t = stageTotals(stage);

  return (
    <div className="bg-white border border-slate-200 rounded overflow-hidden mb-3">
      <div className="flex items-center justify-between px-3 py-2 bg-slate-50/60 border-b border-slate-100">
        <div className="flex items-center gap-2">
          <Icon name={STAGE_ICON[stage.stage]} className="w-4 h-4 text-slate-500" />
          <span className="font-semibold text-[13px] text-slate-900">{stage.stage}{STAGE_HI[stage.stage] ? ` (${STAGE_HI[stage.stage]})` : ""}</span>
          <StatusPill status={stage.status} map={STAGE_STATUS_STYLE} />
          {t.labour > 0 && <span className="text-[11px] font-mono-num text-slate-500">{money(t.labour)}</span>}
        </div>
        <div className="flex items-center gap-2">
          {stage.status !== "Approved" && (
            <button onClick={() => setShowAdd(true)} className="h-7 px-2.5 rounded border border-slate-200 text-[11px] text-slate-700 hover:bg-slate-50 flex items-center gap-1">
              <Icon name="plus" className="w-3 h-3" /> Add Karigar (जोड़ें)
            </button>
          )}
          {canApprove && (
            <button onClick={() => onApproveStage(stage.stage)} className="h-7 px-2.5 rounded bg-emerald-600 text-white text-[11px] font-medium hover:bg-emerald-700">
              Approve Stage (स्वीकृत करें)
            </button>
          )}
        </div>
      </div>
      <div className="p-2.5 space-y-2">
        {stage.assignments.length === 0 && <p className="text-[12px] text-slate-400 px-1">Is stage ke liye abhi koi karigar assign nahi hai.</p>}
        {stage.assignments.map(a => (
          <AssignmentBlock key={a.id} jc={jc} stageName={stage.stage} assignment={a} stageStatus={stage.status}
            tiers={tiers} baseRate={baseRate} defaultRates={defaultRates} karigars={karigars}
            onIssueMaterial={(data) => onIssueMaterial(stage.stage, a.id, data)}
            onReconcile={(issueId, data) => onReconcile(stage.stage, a.id, issueId, data)}
            onEditReconcile={(issueId, data) => onEditReconcile(stage.stage, a.id, issueId, data)}
            onCancelReconcile={(issueId) => onCancelReconcile(stage.stage, a.id, issueId)}
            onRecordCastOutput={(data) => onRecordCastOutput(stage.stage, a.id, data)}
            onRecordJadaiOutput={(data) => onRecordJadaiOutput(stage.stage, a.id, data)}
            onRecordFittingOutput={(data) => onRecordFittingOutput(stage.stage, a.id, data)}
            onAddLabour={(entry) => onAddLabour(stage.stage, a.id, entry)}
            onRemoveLabour={(labourId) => onRemoveLabour(stage.stage, a.id, labourId)}
            onIssueStones={(data) => onIssueStones(stage.stage, a.id, data)}
            onReturnStones={(stoneId, data) => onReturnStones(stage.stage, a.id, stoneId, data)}
          />
        ))}
      </div>
      {showAdd && (
        <AddKarigarModal stageName={stage.stage} karigars={karigars} ledger={ledger} onClose={() => setShowAdd(false)}
          onAdd={(karigarName) => { onAddAssignment(stage.stage, karigarName); setShowAdd(false); }} />
      )}
    </div>
  );
}

/* ============================== JOB CARD LIST (table) ============================== */

  const overdue = jobCards.filter(jc => jc.status !== "Closed" && jc.dueDate < TODAY).length;
  return (
    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="bg-white border-b border-slate-200 shrink-0">
        <div className="flex items-center gap-1 px-4 pt-2 text-[11px] text-slate-500">
          <span className="hover:text-slate-700 cursor-pointer">Production</span>
          <Icon name="chevronRight" className="w-3 h-3 text-slate-300" />
          <span className="text-slate-700 font-medium">Job Cards</span>
        </div>
        <div className="flex items-end justify-between px-4 pt-1">
          <div>
            <h1 className="text-[21px] font-semibold text-slate-900 leading-tight">Job Cards</h1>
            <p className="text-[11px] text-slate-500 mt-0.5">{jobCards.length} jobs · {overdue} overdue against due date</p>
          </div>
          <div className="flex items-center gap-2 pb-2">
            <button onClick={onExport} className="h-7 px-2.5 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50 flex items-center gap-1.5">
              <Icon name="download" className="w-3.5 h-3.5" /> Export
            </button>
            <button onClick={onNew} className="h-7 px-2.5 rounded bg-blue-800 text-white text-[12px] font-medium hover:bg-blue-900 flex items-center gap-1.5">
              <Icon name="plus" className="w-3.5 h-3.5" /> New Job Card (नया)
            </button>
          </div>
        </div>
        <div className="flex items-center gap-1 px-4 mt-2">
          {["all", "Draft", "In Production", "On Hold", "Reconciliation", "Closed"].map(t => (
            <button key={t} onClick={() => setActiveTab(t)}
              className={`px-2.5 h-8 text-[12px] border-b-2 -mb-px ${activeTab === t ? "border-blue-800 text-blue-900 font-medium" : "border-transparent text-slate-500 hover:text-slate-700"}`}>
              {t === "all" ? "All" : t} <span className="text-slate-400 ml-1">{tabCounts[t] || 0}</span>
            </button>
          ))}
        </div>
        <div className="flex items-center gap-2 px-4 py-2 border-t border-slate-100">
          <div className="relative">
            <Icon name="search" className="w-3.5 h-3.5 text-slate-400 absolute left-2 top-1/2 -translate-y-1/2" />
            <input ref={filterRef} value={query} onChange={e => setQuery(e.target.value)} placeholder="Filter by job no., item…"
              className="h-7 w-72 pl-7 pr-2 rounded border border-slate-200 text-[12px] outline-none focus:border-blue-400" />
          </div>
        </div>
      </div>

      <div className="flex-1 overflow-auto">
        <table className="w-full border-collapse">
          <thead className="sticky top-0 bg-slate-50 z-10">
            <tr className="h-9 border-b border-slate-200 text-left">
              <th className="px-4 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Job No.</th>
              <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Item</th>
              <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Karigar</th>
              <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Due Date</th>
              <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold text-right">GW Est</th>
              <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Stage</th>
              <th className="px-3 text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Status</th>
              <th className="w-9" />
            </tr>
          </thead>
          <tbody>
            {visible.length === 0 && (
              <tr><td colSpan={8} className="py-14 text-center">
                <p className="text-[13px] text-slate-700 font-medium">No job cards match these filters</p>
                <button onClick={() => { setQuery(""); setActiveTab("all"); }} className="mt-3 h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50">Clear filters</button>
              </td></tr>
            )}
            {visible.map(({ jc, item, t }) => {
              const karigarNames = [...new Set(jc.stages.flatMap(s => s.assignments.map(a => a.karigar)))];
              const overdueRow = jc.status !== "Closed" && jc.dueDate < TODAY;
              return (
                <tr key={jc.id} onClick={() => onOpen(jc.id)} className="border-b border-slate-100 cursor-pointer h-12 hover:bg-slate-50">
                  <td className="px-4 text-[12px] font-mono-num text-blue-800 font-medium">{jc.id}</td>
                  <td className="px-3 text-[12px]">
                    <div className="flex items-center gap-2">
                      <ItemImage imageUrl={item?.imageUrl} category={item?.category} className="w-7 h-7 rounded object-cover shrink-0" />
                      <div>
                        <div className="text-slate-900">{item?.name || "—"}</div>
                        <div className="text-[10px] text-slate-400">{item?.category}{item?.designCode ? ` · ${item.designCode}` : ""}</div>
                      </div>
                    </div>
                  </td>
                  <td className="px-3 text-[12px] text-slate-700">{karigarNames.length ? (karigarNames.length > 1 ? `${karigarNames[0]} +${karigarNames.length - 1}` : karigarNames[0]) : "—"}</td>
                  <td className={`px-3 text-[12px] font-mono-num ${overdueRow ? "text-rose-600 font-medium" : "text-slate-600"}`}>{jc.dueDate}</td>
                  <td className="px-3 text-[12px] text-right font-mono-num text-slate-700">{item ? `${item.estGrossWeight}g` : "—"}</td>
                  <td className="px-3 text-[12px]">
                    {t.activeStage ? (
                      <div className="flex items-center gap-1.5">
                        <Icon name={STAGE_ICON[t.activeStage]} className="w-3.5 h-3.5 text-slate-400" />
                        <span className="text-slate-700">{t.activeStage}</span>
                      </div>
                    ) : <span className="text-slate-400">Not issued</span>}
                  </td>
                  <td className="px-3"><StatusPill status={jc.status} /></td>
                  <td className="px-3 text-right" onClick={e => e.stopPropagation()}>
                    <button className="w-6 h-6 grid place-items-center rounded hover:bg-slate-200"><Icon name="more" className="w-4 h-4 text-slate-500" /></button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <footer className="h-8 shrink-0 bg-white border-t border-slate-200 flex items-center px-4 gap-4 text-[11px] text-slate-500">
        <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />Synced · 14:36 IST</span>
        <span>{visible.length} of {jobCards.length} job cards</span>
      </footer>
    </div>
  );
}

/* ============================== JOB CARD PAGE ============================== */
function JobCardPage({ jc, t, item, karigars, ledger, tiers, baseRate, defaultRates, onBack, onUpdateMeta,
  onAddAssignment, onIssueMaterial, onReconcile, onEditReconcile, onCancelReconcile, onRecordCastOutput, onRecordJadaiOutput, onRecordFittingOutput, onAddLabour, onRemoveLabour, onIssueStones, onReturnStones,
  onApproveStage, onCloseJobCard, onToggleHold, onReopenJobCard }) {

  const [showBreakdown, setShowBreakdown] = useState(false);

  const gw = grossWeight(jc);
  const stoneGrams = stonesNetCaratGrams(jc);
  const stoneBreakdown = stonesByType(jc);
  const allStagesApproved = jc.stages.some(s => s.assignments.length > 0) && jc.stages.every(s => s.assignments.length === 0 || s.status === "Approved");
  const canClose = jc.status !== "Closed" && allStagesApproved;

    <div className="flex-1 flex flex-col overflow-hidden">
      <div className="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center gap-3 shrink-0">

          <Icon name="chevronLeft" className="w-3.5 h-3.5" /> Job Cards
        </button>
        <span className="text-[13px] font-mono-num font-semibold text-slate-900">{jc.id}</span>
        <StatusPill status={jc.status} />
        <div className="ml-auto flex items-center gap-2 flex-wrap">
          {canClose && (
            <button onClick={() => onCloseJobCard(jc.id)} className="h-7 px-3 rounded border border-emerald-300 bg-emerald-50 text-emerald-800 text-[12px] font-medium hover:bg-emerald-100 flex items-center gap-1.5">
              <Icon name="circleCheck" className="w-3.5 h-3.5" /> Close (बंद करें)
            </button>
          )}
          {canHoldToggle && (
            <button onClick={() => onToggleHold(jc.id)} className="h-7 px-3 rounded border border-slate-200 text-[12px] text-slate-700 hover:bg-slate-50 flex items-center gap-1.5">
              <Icon name={jc.status === "On Hold" ? "play" : "pause"} className="w-3.5 h-3.5" /> {jc.status === "On Hold" ? "Resume (शुरू करें)" : "Hold (रोकें)"}
            </button>
          )}
          {canReopen && (
            <button onClick={() => setModal({ type: "reopen" })} className="h-7 px-3 rounded border border-rose-200 text-[12px] text-rose-700 hover:bg-rose-50 flex items-center gap-1.5">
              <Icon name="rotate" className="w-3.5 h-3.5" /> Reopen (Audited)
            </button>
          )}
        </div>
      </div>

      <div className="flex-1 overflow-y-auto p-6">
        <div className="grid grid-cols-3 gap-6 max-w-6xl">
          <div className="col-span-2 space-y-3">
            <div className="bg-white border border-slate-200 rounded overflow-hidden">
              <div className="px-3 py-2 bg-slate-50/60 border-b border-slate-100 flex items-center justify-between">
                <span className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Job Details (विवरण)</span>
                <span className="text-[11px] text-slate-400">Product: <span className="text-blue-800 font-medium">{item?.name}</span></span>
              </div>
              <div className="p-3 grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[11px] text-slate-500 mb-1">Category</label>
                  <div className="h-8 px-2 flex items-center text-[12px] text-slate-600 bg-slate-50 rounded border border-slate-100">{item?.category}</div>
                </div>
                <div>
                  <label className="block text-[11px] text-slate-500 mb-1">Design code</label>
                  <div className="h-8 px-2 flex items-center text-[12px] text-slate-600 bg-slate-50 rounded border border-slate-100 font-mono-num">{item?.designCode || "—"}</div>
                </div>
                <div>
                  <label className="block text-[11px] text-slate-500 mb-1">Target purity</label>
                  <select className={inputCls} value={jc.targetPurity} onChange={e => onUpdateMeta(jc.id, { targetPurity: e.target.value })}>
                    {tiers.filter(x => x.percent !== 100).map(x => <option key={x.id} value={x.label}>{x.label}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-[11px] text-slate-500 mb-1">Due date</label>
                  <input type="date" className={inputCls} value={jc.dueDate} onChange={e => onUpdateMeta(jc.id, { dueDate: e.target.value })} />
                </div>
                <div>
                  <label className="block text-[11px] text-slate-500 mb-1">Pieces in batch</label>
                  <div className="h-8 px-2 flex items-center text-[12px] text-slate-600 bg-slate-50 rounded border border-slate-100 font-mono-num">{jc.pieceCount != null ? `${jc.pieceCount} pcs` : "Set at Casting"}</div>
                </div>
                <div className="col-span-2">
                  <label className="block text-[11px] text-slate-500 mb-1">Notes (optional)</label>
                  <textarea rows={2} className="w-full px-2 py-1.5 border border-slate-200 rounded text-[12px] outline-none focus:border-blue-400"
                    value={jc.notes || ""} onChange={e => onUpdateMeta(jc.id, { notes: e.target.value })} />

                {jc.status === "On Hold" && <div className="col-span-2 text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded p-2">{jc.holdReason}</div>}
              </div>
            </div>

            {jc.stages.map(stage => (
              <StageCard key={stage.stage} jc={jc} stage={stage} karigars={karigars} ledger={ledger} tiers={tiers} baseRate={baseRate} defaultRates={defaultRates}
                onAddAssignment={onAddAssignment} onIssueMaterial={onIssueMaterial} onReconcile={onReconcile} onEditReconcile={onEditReconcile} onCancelReconcile={onCancelReconcile}
                onRecordCastOutput={onRecordCastOutput} onRecordJadaiOutput={onRecordJadaiOutput} onRecordFittingOutput={onRecordFittingOutput}
                onAddLabour={onAddLabour} onRemoveLabour={onRemoveLabour} onIssueStones={onIssueStones} onReturnStones={onReturnStones}
                onApproveStage={onApproveStage} />
            ))}

            {jc.reversalLog && jc.reversalLog.length > 0 && (
              <div className="bg-white border border-slate-200 rounded overflow-hidden">
                <div className="px-3 py-2 bg-slate-50/60 border-b border-slate-100 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Reopen History (Audit Log)</div>
                {jc.reversalLog.map((log, i) => (
                  <div key={i} className="px-3 py-2 text-[11px] border-b border-slate-50 last:border-b-0">
                    <div className="flex items-center justify-between">
                      <span className="text-slate-500">Reopened <span className="font-mono-num text-slate-800">{log.date}</span></span>
                      <span className="text-slate-500">by <span className="text-slate-800 font-medium">{log.approvedBy}</span></span>
                    </div>
                    <div className="text-slate-600 mt-0.5">Reason: {log.reason}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="space-y-3">
            <div className="bg-white border border-slate-200 rounded p-3">
              <div className="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-2 flex items-center gap-1.5">
                <Icon name="image" className="w-3.5 h-3.5" /> Product Image (फोटो)
              </div>
              <ItemImage imageUrl={item?.imageUrl} category={item?.category} className="w-full h-40 rounded object-cover" />
