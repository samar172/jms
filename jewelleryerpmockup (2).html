function renderIcons(){
  document.querySelectorAll('[data-lucide]').forEach(el => {
    const name = el.getAttribute('data-lucide');
    const inner = ICONS[name];
    if(!inner) return;
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','2');
    svg.setAttribute('stroke-linecap','round');
    svg.setAttribute('stroke-linejoin','round');
    svg.setAttribute('class', el.getAttribute('class') || '');
    svg.innerHTML = inner;
    el.replaceWith(svg);
  });
}

// fully closed, the Receive & Reconcile button disappears (nothing left to receive), but an
// over-tolerance chizzat from that round can still be sitting unapproved with no other way to act on it.
let varianceApprovalForm = null; // { reconIndex, approver, note }

function openVarianceApproval(reconIndex){
  varianceApprovalForm = { reconIndex, approver:'', note:'' };
  render();
}
function closeVarianceApproval(){ varianceApprovalForm = null; render(); }
function confirmVarianceApproval(){
  const idx = varianceApprovalForm ? varianceApprovalForm.reconIndex : -1;
  const rec = reconciliations[idx];
  if(!rec){ varianceApprovalForm = null; render(); return; }
  if(!varianceApprovalForm.approver || !varianceApprovalForm.approver.trim()){ toast('Approved by (naam) dijiye', true); return; }
  rec.varianceApproved = true;
  rec.varianceApprover = varianceApprovalForm.approver.trim();
  rec.varianceNote = varianceApprovalForm.note || '';
  toast(`Chizzat approved by ${rec.varianceApprover} — ${wt(rec.wastageWt)} g (${rec.wastagePct.toFixed(2)}%)`);
  varianceApprovalForm = null;
  render();
}

// Calculation Base / Rate Basis options exposed in the Item Master chizzat-rule config (not hardcoded per item — driven by these lists)
const CHIZZAT_BASE_OPTIONS = ['24K Gold Weight', '22K Gold Weight', '18K Gold Weight', 'Total Gold Weight', 'Fixed Weight', 'Fixed Amount'];
const CHIZZAT_RATE_BASIS_OPTIONS = ['Same Purity', '24K', '22K', '18K', 'Custom'];

// Given an item's wastageRule and the gold lines currently on the estimate/draft, compute the
// Chizzat/Wastage weight, rate and amount — plus a human-readable formula string for the UI.
function computeChizzat(item, goldLines){
  if(!item || !item.wastageRule) return null;
  const rule = item.wastageRule;
  const lines = (goldLines||[]).map(g => ({ k:g.k, wt:Number(g.wt)||0, rate:Number(g.rate)||GOLD_RATES[g.k]||0 }));
  if(rule.base === 'Fixed Amount'){
    const amount = Number(rule.fixedAmt)||0;
    return { wt:null, rate:null, amount, formula:`Fixed Amount = ₹${amount.toLocaleString('en-IN')}` };
  }
  let baseLine = null, baseWt = 0;
  if(rule.base === 'Total Gold Weight'){ baseWt = lines.reduce((s,g)=>s+g.wt,0); }
  else if(rule.base === 'Fixed Weight'){ baseWt = Number(rule.fixedWt)||0; }
  else { baseLine = lines.find(g => rule.base.startsWith(g.k)); baseWt = baseLine ? baseLine.wt : 0; }
  if(baseWt <= 0) return null;
  const wtVal = rule.base === 'Fixed Weight' ? baseWt : +(baseWt * (Number(rule.pct)||0) / 100).toFixed(4);
  let rate;
  if(rule.rateBasis === 'Same Purity') rate = baseLine ? baseLine.rate : GOLD_RATES['24K'];
  else if(rule.rateBasis === 'Custom') rate = Number(rule.customRate)||GOLD_RATES['24K'];
  else rate = GOLD_RATES[rule.rateBasis] || GOLD_RATES['24K'];
  const amount = +(wtVal * rate).toFixed(2);
  const formula = rule.base === 'Fixed Weight'
    ? `Fixed Weight = ${wt(wtVal)}g × ₹${rate.toLocaleString('en-IN')} (${rule.rateBasis}) = ₹${amount.toLocaleString('en-IN')}`
    : `${rule.pct}% × ${rule.base} (${wt(baseWt)}g) = ${wt(wtVal)}g × ₹${rate.toLocaleString('en-IN')} (${rule.rateBasis}) = ₹${amount.toLocaleString('en-IN')}`;
  return { wt:wtVal, rate, amount, formula };
}

// Client's Chowker Excel methodology: Finished Product Gross Weight = Pure Gold + Stone Equivalent + Wax/Wire/Other Non-Gold.
// Derived generically from any estimate's own gold/stones/gw fields (not hardcoded to one item).
function computeFinishedComposition(est){
  const goldWt = (est.gold||[]).reduce((s,g)=>s+(Number(g.wt)||0), 0);
  const stoneCt = (est.stones||[]).reduce((s,st)=>s+(Number(st.wt)||0), 0);
  const stoneEquivWt = +(stoneCt / STONE_CT_PER_GRAM).toFixed(2);
  const grossWt = Number(est.gw)||0;
  const nonGoldWt = +Math.max(0, grossWt - goldWt - stoneEquivWt).toFixed(2);
  return { goldWt:+goldWt.toFixed(2), stoneCt:+stoneCt.toFixed(2), stoneEquivWt, nonGoldWt, grossWt };
}

}

const GOLD_RATES = { '24K': 16350, '22K': 14980, '18K': 12262.5 };

const CHARGE_TYPES = ['Making Charges', 'Wastage Charges', 'Packing Charges', 'Certification Charges', 'Insurance Charges', 'Other Charges'];
const CHARGE_ICON = { 'Making Charges':'calculator', 'Wastage Charges':'package', 'Packing Charges':'archive', 'Certification Charges':'badge-check', 'Insurance Charges':'file-text', 'Other Charges':'plus' };

function chargeAmount(c){ return c.mode === 'weight' ? (Number(c.wt)||0) * (Number(c.rate)||0) : (Number(c.amount)||0); }
function chargesTotal(charges){ return charges.reduce((s,c) => s + chargeAmount(c), 0); }

// GST — applied on the taxable value (Cost + Profit, i.e. the existing `net` figure), on top of it.
// Kept as a separate layer instead of folding into `net` so every existing consumer of est.net
// (dashboards, job linking, duplicate/estimate list) keeps working unchanged; this is the new
// "what the customer actually pays" figure.
function estimateGst(est){
  const gstPct = Number(est.gstPct) || 0;
  const taxable = Number(est.net) || 0;
  const gstAmt = +(taxable * gstPct / 100).toFixed(2);
  const grandTotal = +(taxable + gstAmt).toFixed(2);
  return { gstPct, taxable, gstAmt, grandTotal };
}
function chargeCard(c, est){
  // For Wastage/Chizzat, show the configured rule's formula so the calculation is never hidden —
  // derived live from the linked item's rule (falls back to a stored formula on drafts).
  let formula = c.autoFormula || null;
  if(!formula && c.type === 'Wastage Charges' && est){
    const item = itemMaster.find(i => i.name === est.item);
    if(item && item.wastageRule){
      const chz = computeChizzat(item, est.gold);
      if(chz) formula = chz.formula;
    }
  }
  return `
  <div class="border border-slate-200 rounded-md p-2">
    <div class="flex items-center gap-1.5 text-[11px] text-slate-500">
      <i data-lucide="${CHARGE_ICON[c.type]||'plus'}" class="w-3 h-3"></i> ${c.type}
    </div>
    ${c.mode==='weight'
      ? `<div class="text-[10px] text-slate-400 mt-0.5">${wt(c.wt)} g × ${inr0(c.rate)}</div>`
      : ''}
    <div class="text-[14px] font-semibold text-slate-900 mt-0.5 mono">${inr0(chargeAmount(c))}</div>
    ${formula ? `<div class="text-[9.5px] text-slate-400 mt-1 leading-snug border-t border-slate-100 pt-1">Calc: ${formula}</div>` : ''}
  </div>`;
}

function draftTotals(){
  const d = draftEstimate;
  const goldTotal = d.gold.reduce((s,g) => s + (Number(g.wt)||0) * (Number(g.rate)||0), 0);
  const stonesTotal = d.stones.reduce((s,st) => s + (Number(st.wt)||0) * (Number(st.rate)||0), 0);
  const chargesTot = chargesTotal(d.charges);
  const cost = goldTotal + stonesTotal + chargesTot;
  const profitAmt = cost * (Number(d.profitPct)||0) / 100;
  const net = cost + profitAmt;
  const gstAmt = net * (Number(d.gstPct)||0) / 100;
  const grandTotal = net + gstAmt;
  return { goldTotal, stonesTotal, chargesTot, cost, profitAmt, net, gstAmt, grandTotal };
}

function updateDraftField(fieldKey, value){
  const d = draftEstimate;
  if(!d || !fieldKey) return;
  const parts = fieldKey.split('-');
  if(parts[0] === 'gold'){
    const i = +parts[1], prop = parts[2];
    if(prop === 'k'){ d.gold[i].k = value; d.gold[i].rate = String(GOLD_RATES[value] ?? d.gold[i].rate); }
    else d.gold[i][prop] = value;
  } else if(parts[0] === 'stone'){
    const i = +parts[1], prop = parts[2];
    d.stones[i][prop] = value;
  } else if(parts[0] === 'charge'){
    const i = +parts[1], prop = parts[2];
    if(prop === 'type'){
      d.charges[i].type = value;
      d.charges[i].mode = value === 'Wastage Charges' ? 'weight' : 'flat';
      if(d.charges[i].mode === 'weight'){ d.charges[i].wt = d.charges[i].wt || ''; d.charges[i].rate = d.charges[i].rate || String(GOLD_RATES['22K']); }
      else { d.charges[i].amount = d.charges[i].amount || ''; }
    } else {
      d.charges[i][prop] = value;
    }
  } else {
    d[fieldKey] = value;
  }
}

function wireEstimateFormEvents(){
  document.querySelectorAll('#estimateFormRoot [data-field]').forEach(el => {
    if(el.dataset.field === 'itemPickerQuery') return; // wired separately
    const evt = (el.tagName === 'SELECT') ? 'change' : 'input';
    el.addEventListener(evt, (e) => {
      const fieldKey = e.target.dataset.field;
      const s = e.target.selectionStart, en = e.target.selectionEnd;
      updateDraftField(fieldKey, e.target.value);
      refreshEstimateForm(fieldKey, s, en);
    });
  });
  document.querySelectorAll('#estimateFormRoot [data-add]').forEach(el => el.addEventListener('click', () => {
    const type = el.dataset.add;
    if(type === 'gold') draftEstimate.gold.push({ k:'22K', wt:'', rate:String(GOLD_RATES['22K']) });
    if(type === 'stone') draftEstimate.stones.push({ group:'Polki', particular:'', unit:'ctr', pcs:'', wt:'', rate:'' });
    if(type === 'charge') draftEstimate.charges.push({ type:'Packing Charges', mode:'flat', amount:'' });
    refreshEstimateForm();
  }));
  document.querySelectorAll('#estimateFormRoot [data-remove]').forEach(el => el.addEventListener('click', () => {
    const [type, i] = el.dataset.remove.split('-');
    if(type === 'gold') draftEstimate.gold.splice(+i, 1);
    if(type === 'stone') draftEstimate.stones.splice(+i, 1);
    if(type === 'charge') draftEstimate.charges.splice(+i, 1);
    refreshEstimateForm();
  }));
  document.querySelectorAll('#estimateFormRoot [data-load-template]').forEach(el => el.addEventListener('click', () => {
    const item = itemMaster.find(i => i.id === draftEstimate.itemId);
    if(item && item.template){
      draftEstimate.gold = item.template.gold.map(g => ({ k:g.k, wt:String(g.wt), rate:String(g.rate) }));
      draftEstimate.stones = item.template.stones.map(s => ({ group:s.group, particular:s.particular, unit:s.unit, pcs:s.pcs===''?'':String(s.pcs), wt:String(s.wt), rate:String(s.rate) }));
      if(item.expectedGrossWt) draftEstimate.gw = String(item.expectedGrossWt);
      // Auto-pull the item's configured Chizzat/Wastage rule into a Wastage Charges card
      const chizzat = computeChizzat(item, draftEstimate.gold);
      if(chizzat){
        let wc = draftEstimate.charges.find(c => c.type === 'Wastage Charges');
        if(!wc){ wc = { type:'Wastage Charges', mode:'weight', wt:'', rate:'' }; draftEstimate.charges.push(wc); }
        wc.mode = 'weight'; wc.wt = chizzat.wt!=null ? String(chizzat.wt) : ''; wc.rate = chizzat.rate!=null ? String(chizzat.rate) : '';
        wc.autoFormula = chizzat.formula; wc.autoFromRule = true;
        toast('Standard composition + Chizzat rule loaded from '+item.id+' — '+chizzat.formula);
      } else {
        toast('Standard composition loaded from '+item.id);
      }
      refreshEstimateForm();
    }
  }));

  const openBtn = document.getElementById('openItemPickerBtn');
  if(openBtn) openBtn.addEventListener('click', () => { itemPicker.open = true; itemPicker.query=''; refreshEstimateForm(); setTimeout(()=>{ const s=document.getElementById('itemPickerSearch'); if(s) s.focus(); },0); });
  const closeBtn = document.getElementById('closeItemPickerBtn');
  if(closeBtn) closeBtn.addEventListener('click', () => { itemPicker.open = false; refreshEstimateForm(); });
  const search = document.getElementById('itemPickerSearch');
  if(search) search.addEventListener('input', (e) => {
    itemPicker.query = e.target.value;
    const s = e.target.selectionStart, en = e.target.selectionEnd;
    refreshEstimateForm();
    const el2 = document.getElementById('itemPickerSearch');
    if(el2){ el2.focus(); try{ el2.setSelectionRange(s,en); }catch(err){} }
  });
  document.querySelectorAll('[data-select-item]').forEach(el => el.addEventListener('click', () => {
    const item = itemMaster.find(i => i.id === el.dataset.selectItem);
    if(!item) return;
    draftEstimate.item = item.name; draftEstimate.itemId = item.id; draftEstimate.itemImage = item.image;
    itemPicker.open = false;
    refreshEstimateForm();
  }));
  const openCreate = document.getElementById('openCreateItemBtn');
  if(openCreate) openCreate.addEventListener('click', () => {
    itemPicker.creating = true; itemPicker.newName = itemPicker.query; itemPicker.newCategory = 'Necklace'; itemPicker.newImage = null;
    refreshEstimateForm();
  });
  const cancelCreate = document.getElementById('cancelNewItemBtn');
  if(cancelCreate) cancelCreate.addEventListener('click', () => { itemPicker.creating = false; refreshEstimateForm(); });
  const newItemName = document.querySelector('[data-field="newItemName"]');
  if(newItemName) newItemName.addEventListener('input', (e) => {
    itemPicker.newName = e.target.value;
    const s = e.target.selectionStart, en = e.target.selectionEnd;
    refreshEstimateForm();
    const el2 = document.querySelector('[data-field="newItemName"]');
    if(el2){ el2.focus(); try{ el2.setSelectionRange(s,en); }catch(err){} }
  });
  const newItemCategory = document.querySelector('[data-field="newItemCategory"]');
  if(newItemCategory) newItemCategory.addEventListener('change', (e) => { itemPicker.newCategory = e.target.value; refreshEstimateForm(); });
  const imgInput = document.getElementById('newItemImageInput');
  if(imgInput) imgInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => { itemPicker.newImage = reader.result; refreshEstimateForm(); };
    reader.readAsDataURL(file);
  });
  const saveNewItem = document.getElementById('saveNewItemBtn');
  if(saveNewItem) saveNewItem.addEventListener('click', () => {
    if(!itemPicker.newName.trim()){ toast('Item ka naam dijiye', true); return; }
    const newItem = {
      id: nextItemId(), name: itemPicker.newName.trim(), category: itemPicker.newCategory,
      image: itemPicker.newImage || placeholderItemImage(itemPicker.newName, itemPicker.newCategory), template: null,

    itemPicker.creating = false; itemPicker.open = false;

}

  const t = draftTotals();
  const newEst = {
    id: nextEstimateId(), item: d.item, party: d.party, date: d.date, pcs: Number(d.pcs)||1, gw: Number(d.gw)||0,
    status: 'draft', createdBy: 'Aadil Bhati',
    gold: d.gold.map(g => ({ k:g.k, wt:Number(g.wt)||0, rate:Number(g.rate)||0, amt:(Number(g.wt)||0)*(Number(g.rate)||0) })),
    stones: d.stones.map(s => ({ group:s.group, particular:s.particular||s.group, unit:s.unit, pcs:s.pcs||null, wt:Number(s.wt)||0, rate:Number(s.rate)||0, amt:(Number(s.wt)||0)*(Number(s.rate)||0) })),
    charges: d.charges.map(c => c.mode==='weight'
      ? { type:c.type, mode:'weight', wt:Number(c.wt)||0, rate:Number(c.rate)||0 }

    cost: t.cost, profitPct: Number(d.profitPct)||0, profitAmt: t.profitAmt, net: t.net, gstPct: Number(d.gstPct)||0,
  };
  estimates.unshift(newEst);

  render();

}

    el.id = 'toast';
    el.className = 'fixed bottom-4 right-4 z-50 h-9 px-3 rounded-md border text-[12px] font-medium flex items-center shadow-sm';
    document.body.appendChild(el);
  }
  el.className = 'fixed bottom-4 right-4 z-50 h-9 px-3 rounded-md border text-[12px] font-medium flex items-center shadow-sm ' + (isWarn ? 'bg-rose-50 text-rose-800 border-rose-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200');

// Every material movement (issue + every reconciliation component) becomes one audit-trail line —
// Date/User/Job/Material/Transaction/Qty/From/To, matching the client's required activity format.
const PR_TXN = { finished:'FINISHED PRODUCT', wastage:'VARIANCE', gold_scrap:'RECOVERY', approved_loss:'APPROVED LOSS', gold_dust:'RECOVERY', unused_gold:'RETURN', stone_return:'RETURN' };
function jobAuditTrail(j){
  const issueEvents = materialIssues.filter(m => m.job === j.id).map(m => ({
    date: m.date, user: 'Store In-charge', text: `<span class="mono text-slate-500">ISSUED</span> ${m.material} <b>+${wt(m.wtIssued)}${m.material.startsWith('Gold')?'g':' ctr'}</b> — Main Stock → ${m.karigar} (${STAGE_LABEL[m.stage]||m.stage})`,
  }));
  const returnEvents = productionReturns.filter(p => p.job === j.id).map(p => ({
    date: p.date, user: p.karigar,
    text: `<span class="mono text-slate-500">${PR_TXN[p.kind]||p.kind.toUpperCase()}</span> ${p.material} <b>${p.kind==='wastage'?'−':'+'}${wt(p.wt)}g</b> — ${p.karigar} → ${p.kind==='finished'?'Finished Goods':p.kind==='wastage'?'Unexplained (needs approval)':p.kind==='approved_loss'?'Approved Chizzat':'Recovery Stock'} (${STAGE_LABEL[p.stage]||p.stage})`,
  }));
  return [...issueEvents, ...returnEvents].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

// Rolls up Issued / Returned / Consumed / Scrap / Dust / Approved Loss(Chizzat) / Unexplained Variance
// across every material issue + reconciliation recorded against a job, regardless of stage or karigar.
function jobMaterialControl(j){
  const issues = materialIssues.filter(m => m.job === j.id);
  const recons = reconciliations.filter(r => r.job === j.id);
  const goldIssued = issues.filter(m => m.material.startsWith('Gold')).reduce((s,m)=>s+m.wtIssued, 0);
  const returned = issues.reduce((s,m)=>s+(m.wtReturned||0), 0);
  const consumed = recons.reduce((s,r)=>s+(r.fineGoldReturned||0), 0);
  const scrap = recons.reduce((s,r)=>s+(r.fillerWt||0), 0);
  const dust = recons.reduce((s,r)=>s+(r.dustWt||0), 0);
  const approvedLoss = recons.reduce((s,r)=>s+(r.approvedLossWt||0), 0);
  const variance = recons.reduce((s,r)=>s+(r.wastageWt||0), 0);
  const openIssues = issues.filter(m => m.status !== 'closed');
  const pendingApproval = recons.some(r => r.grossIssued>0 && r.wastagePct>RECONCILE_TOLERANCE_PCT && !r.varianceApproved);
  let status, statusLabel, statusCls;
  if(pendingApproval){ status='needs-approval'; statusLabel='🔴 Variance Requires Approval'; statusCls='bg-rose-50 text-rose-800 border-rose-200'; }
  else if(openIssues.length){ status='pending'; statusLabel='🟡 Within Tolerance — Open Issues Pending'; statusCls='bg-amber-50 text-amber-800 border-amber-200'; }
  else if(!issues.length){ status='none'; statusLabel='— No Material Issued Yet'; statusCls='bg-slate-50 text-slate-500 border-slate-200'; }
  else { status='reconciled'; statusLabel='🟢 Reconciled'; statusCls='bg-emerald-50 text-emerald-800 border-emerald-200'; }
  return { goldIssued, returned, consumed, scrap, dust, approvedLoss, variance, openIssuesCount: openIssues.length, status, statusLabel, statusCls };
}

/* ============================================================
   FINAL COSTING
   ============================================================ */
// Every priceable line — gold rate/weight, stone rate/qty/weight, every charge, profit% and
// GST% — is Admin-editable here. job.costingOverride holds the overrides (nested by section+
// line-index so each field can move independently); job.costingLog is the audit trail: every
// saved change appends one entry (field, old → new, timestamp) so a later user can see exactly
// what an Admin changed and when, instead of the number just silently being different.
function ovGet(job, section, key, field){
  const ov = job.costingOverride;
  const bucket = ov && ov[section] && ov[section][key];
  const raw = bucket ? bucket[field] : undefined;
  return (raw !== undefined && raw !== null && raw !== '') ? Number(raw) : undefined;
}
function logCostingChange(job, label, oldVal, newVal, fmt){
  if(!job.costingLog) job.costingLog = [];
  job.costingLog.unshift({ label, oldVal, newVal, fmt: fmt||'num', ts: new Date().toISOString() });
}

// Pulls Estimate-vs-Actual costing for a job LIVE from the linked estimate's own gold/stone/charge
// lines + this job's own Material Reconciliation rollup (actualWastageWt) and Labour entries —
// every one of those lines can additionally be Admin-overridden per job (see logCostingChange above).
function computeActualCosting(jobId){
  const job = jobs.find(x => x.id === jobId);
  const est = job ? estimates.find(e => e.id === job.estId) : null;
  if(!job || !est) return null;
  if(!job.costingOverride) job.costingOverride = { gold:{}, stones:{}, charges:{} };
  if(!job.costingOverride.gold) job.costingOverride.gold = {};
  if(!job.costingOverride.stones) job.costingOverride.stones = {};
  if(!job.costingOverride.charges) job.costingOverride.charges = {};

  const goldLines = est.gold.map((g,i) => {
    const wt = ovGet(job,'gold',i,'wt') ?? g.wt;
    const rate = ovGet(job,'gold',i,'rate') ?? g.rate;
    return { idx:i, k:g.k, wt, rate, amt:+(wt*rate).toFixed(2), estWt:g.wt, estRate:g.rate, estAmt:g.amt,
              overridden: ovGet(job,'gold',i,'wt')!==undefined || ovGet(job,'gold',i,'rate')!==undefined };
  });
  const goldTotalWt = +goldLines.reduce((s,g)=>s+g.wt,0).toFixed(3);
  const goldTotal = +goldLines.reduce((s,g)=>s+g.amt,0).toFixed(2);

  const stoneLines = est.stones.map((s,i) => {
    const pcs = ovGet(job,'stones',i,'pcs') ?? s.pcs;
    const wt = ovGet(job,'stones',i,'wt') ?? s.wt;
    const rate = ovGet(job,'stones',i,'rate') ?? s.rate;
    return { idx:i, group:s.group, particular:s.particular, pcs, wt, rate, amt:+(wt*rate).toFixed(2), estWt:s.wt, estRate:s.rate, estAmt:s.amt,
              overridden: ovGet(job,'stones',i,'wt')!==undefined || ovGet(job,'stones',i,'rate')!==undefined || ovGet(job,'stones',i,'pcs')!==undefined };
  });
  const stonesTotal = +stoneLines.reduce((s,st)=>s+st.amt,0).toFixed(2);

  const makingCharge = est.charges.find(c => c.type === 'Making Charges');
  const estMaking = makingCharge ? chargeAmount(makingCharge) : 0;
  const jobLabour = labourEntries.filter(l => l.job === jobId);
  const pulledMaking = jobLabour.reduce((s,l) => s+(l.amount||0), 0);
  const autoActMaking = jobLabour.length ? +pulledMaking.toFixed(2) : estMaking;
  const actMaking = ovGet(job,'charges','Making Charges','amount') ?? autoActMaking;

  const wastageCharge = est.charges.find(c => c.type === 'Wastage Charges');
  const estWastageWt = wastageCharge && wastageCharge.mode==='weight' ? Number(wastageCharge.wt)||0 : 0;
  const estWastageRate = wastageCharge && wastageCharge.mode==='weight' ? Number(wastageCharge.rate)||0 : 0;
  const estWastage = wastageCharge ? chargeAmount(wastageCharge) : 0;
  const autoActWastageWt = job.actualWastageWt || 0;
  const actWastageWt = ovGet(job,'charges','Wastage Charges','wt') ?? autoActWastageWt;
  const actWastageRate = ovGet(job,'charges','Wastage Charges','rate') ?? estWastageRate;
  const actWastage = +(actWastageWt * actWastageRate).toFixed(2);

  const otherChargeLines = est.charges.filter(c => c.type!=='Making Charges' && c.type!=='Wastage Charges').map(c => {
    const estAmt = chargeAmount(c);
    const amt = ovGet(job,'charges',c.type,'amount') ?? estAmt;
    return { type:c.type, amt, estAmt, overridden: ovGet(job,'charges',c.type,'amount')!==undefined };
  });
  const otherChargesTotal = +otherChargeLines.reduce((s,c)=>s+c.amt,0).toFixed(2);

  const actCost = +(goldTotal + stonesTotal + actMaking + actWastage + otherChargesTotal).toFixed(2);
  const ov = job.costingOverride;
  const profitPct = (ov.profitPct!==undefined && ov.profitPct!==null && ov.profitPct!=='') ? Number(ov.profitPct) : (Number(est.profitPct)||0);
  const profitAmt = +(actCost * profitPct/100).toFixed(2);
  const actNet = +(actCost + profitAmt).toFixed(2);
  const gstPct = (ov.gstPct!==undefined && ov.gstPct!==null && ov.gstPct!=='') ? Number(ov.gstPct) : (Number(est.gstPct)||0);
  const actGstAmt = +(actNet * gstPct/100).toFixed(2);
  const actGrandTotal = +(actNet + actGstAmt).toFixed(2);
  const estGst = estimateGst(est);

  const overridden = goldLines.some(g=>g.overridden) || stoneLines.some(s=>s.overridden) || otherChargeLines.some(c=>c.overridden)
    || ovGet(job,'charges','Making Charges','amount')!==undefined || ovGet(job,'charges','Wastage Charges','wt')!==undefined
    || ovGet(job,'charges','Wastage Charges','rate')!==undefined || ov.profitPct!==undefined || ov.gstPct!==undefined;

  return { job: jobId, item: est.item, party: job.party, stage: job.stage,
            estGw: est.gw, actGw: est.gw,
            goldLines, goldTotalWt, goldTotal, stoneLines, stonesTotal,
            estMaking, actMaking, autoActMaking,
            estWastageWt, estWastageRate, estWastage, actWastageWt, actWastageRate, actWastage, autoActWastageWt,
            otherChargeLines, otherChargesTotal,
            estProfitPct: Number(est.profitPct)||0, profitPct, estProfit: est.net-est.cost, profitAmt, actProfit: profitAmt,
            estCost: est.cost, actCost, estNet: est.net, actNet,
            estGstPct: Number(est.gstPct)||0, gstPct, estGstAmt: estGst.gstAmt, actGstAmt,
            estGrandTotal: estGst.grandTotal, actGrandTotal, overridden };
}

function nextInvoiceId(){
  const nums = invoices.map(i => parseInt(i.id.split('-').pop(), 10)).filter(n => !isNaN(n));
  return 'INV-2026-' + String((nums.length ? Math.max(...nums) : 490) + 1);
}

// Wires the very last mile — Final Costing's live Actual figures become a real Invoice record,
// not a decorative stub. This is what makes Job Card → Issue → Reconcile → Costing → Invoice a
// closed loop instead of a demo that trails off before the money changes hands.
function createInvoiceFromJob(jobId){
  const job = jobs.find(x => x.id === jobId);
  const row = computeActualCosting(jobId);
  if(!job || !row){ toast('Job ya linked estimate nahi mila', true); return; }
  if(invoices.find(i => i.job === jobId)){ toast('Is job ke liye invoice pehle se ban chuka hai', true); return; }
  const newInvoice = {
    id: nextInvoiceId(), job: jobId, customer: job.party, date: new Date().toISOString().slice(0,10),
    amount: row.actNet, gst: row.actGstAmt, net: row.actGrandTotal,
    mode: job.dispatchMode || 'Pending', tracking: job.dispatchTracking || '—',
    status: job.dispatchTracking ? 'in_transit' : (job.dispatchMode ? 'pending' : 'pending'),
    paidAmount: 0,
  };
  invoices.unshift(newInvoice);
  toast(`${newInvoice.id} created for ${jobId} — ${inr(newInvoice.net)} (incl. GST)`);
  state.view = 'dispatch'; state.inspect = null;
  render();
}

// Which job's Actual Costing document is expanded below the overview list, and whether the
// Admin Edit form is open for it. Overrides themselves live on job.costingOverride (see
// computeActualCosting) so they persist and flow straight into Create Invoice.
let costingInspectJob = null;
let costingEditMode = false;
let costingEditDraft = null; // { actMaking, actWastageWt, otherChargesAdj }
let dispatchInspectInvoice = null; // which invoice's Estimate-format document is expanded in Dispatch & Invoicing

// Renders a job's ACTUAL costing in the exact same document shape as the Estimate itself
// (Pure Gold table, stone-group tables, Charges, Costing Summary) — same gold/stone lines as
// the linked estimate (the design doesn't change), only Making/Wastage + the totals they drive
// are swapped for actuals. A single small card at the bottom carries the Estimate-vs-Actual
// variance instead of a separate complex comparison screen. Reused as-is for the Invoice view.
function actualCostingDocument(job, opts){
  opts = opts || {};
  const est = estimates.find(e => e.id === job.estId);
  if(!est) return `<div class="p-6 text-center text-[12px] text-slate-400">Linked estimate nahi mila.</div>`;
  const row = computeActualCosting(job.id);
  const stoneGrouped = {};
  row.stoneLines.forEach(s => { (stoneGrouped[s.group] = stoneGrouped[s.group]||[]).push(s); });
  const varAmt = +(row.actNet - row.estNet).toFixed(2);
  const varPct = row.estNet ? (varAmt/row.estNet*100) : 0;
  const alreadyInvoiced = invoices.find(inv=>inv.job===job.id);
  const editingThis = !opts.readOnly && costingEditMode && costingInspectJob===job.id;
  const draft = editingThis ? (costingEditDraft || {}) : {};
  // Every priceable cell renders as a live input while editing (path = "gold.0.rate" etc,
  // matching job.costingOverride's shape) — outside edit mode it's plain text.
  const cell = (path, value, kind) => {
    if(!editingThis) return kind==='wt' ? wt(value) : (kind==='pct' ? Number(value).toFixed(2) : inr0(value));
    const v = draft[path] !== undefined ? draft[path] : value;
    return `<input data-ced="${path}" type="text" inputmode="decimal" value="${v}" class="w-20 h-6 px-1 rounded border border-amber-300 text-[11px] mono text-right bg-white" />`;
  };
  const log = (job.costingLog||[]).slice(0, 30);
  return `
    <div class="max-w-[1200px] grid grid-cols-3 gap-4">
      <div class="col-span-2 space-y-3">
        <div class="flex items-center justify-between">
          <div class="text-[11px] text-slate-500">${job.party} · Stage: ${STAGE_LABEL[job.stage]||job.stage} ${row.overridden?'<span class="ml-1 text-amber-700 font-medium">· Admin Adjusted</span>':''}</div>
          ${!opts.readOnly ? `
          <div class="flex items-center gap-1.5">
            ${row.overridden ? `<button data-costing-reset="${job.id}" class="h-6 px-2 rounded border border-slate-200 text-[10.5px] text-slate-600 hover:bg-slate-50">Reset to Auto</button>` : ''}
            <button data-costing-edit-toggle="${job.id}" class="h-6 px-2.5 rounded ${editingThis?'bg-amber-600 text-white':'border border-blue-200 text-blue-800 hover:bg-blue-50'} text-[10.5px] font-medium">${editingThis ? 'Editing — click to Save/Cancel below' : 'Edit Everything (Admin)'}</button>
          </div>` : ''}
        </div>
        ${panel('Header', `
          <div class="grid grid-cols-3 gap-3">${field('Date', est.date)}${field('Pieces', est.pcs)}${field('Gross Weight (GW)', wt(est.gw)+' g', true)}</div>
        `)}
        ${panel('Pure Gold', `
          <table class="w-full text-[12px]">
            <thead><tr class="text-slate-400 text-[10px] uppercase"><th class="text-left font-medium pb-1">Particular</th><th class="text-right font-medium pb-1">Wt (g)</th><th class="text-right font-medium pb-1">Rate</th><th class="text-right font-medium pb-1">Amount</th></tr></thead>
            <tbody>
              ${row.goldLines.map(g=>`<tr class="border-t border-slate-100 ${g.overridden?'bg-amber-50/50':''}"><td class="py-1.5 text-slate-700">Gold-${g.k}</td><td class="py-1.5 text-right tabular mono">${cell('gold.'+g.idx+'.wt', g.wt, 'wt')}</td><td class="py-1.5 text-right tabular mono">${cell('gold.'+g.idx+'.rate', g.rate)}</td><td class="py-1.5 text-right tabular mono">${inr0(g.amt)}</td></tr>`).join('')}
              <tr class="border-t border-slate-200 font-semibold"><td class="py-1.5 text-slate-900">Total</td><td class="py-1.5 text-right tabular mono">${wt(row.goldTotalWt)}</td><td></td><td class="py-1.5 text-right tabular mono">${inr0(row.goldTotal)}</td></tr>
            </tbody>
          </table>
        `)}
        ${Object.keys(stoneGrouped).map(g => panel(g, `
          <table class="w-full text-[12px]">
            <thead><tr class="text-slate-400 text-[10px] uppercase"><th class="text-left font-medium pb-1">Particular</th><th class="text-right font-medium pb-1">Pcs</th><th class="text-right font-medium pb-1">Wt (ctr/g)</th><th class="text-right font-medium pb-1">Rate</th><th class="text-right font-medium pb-1">Amount</th></tr></thead>
            <tbody>
              ${stoneGrouped[g].map(s=>`<tr class="border-t border-slate-100 ${s.overridden?'bg-amber-50/50':''}"><td class="py-1.5 text-slate-700">${s.particular}</td><td class="py-1.5 text-right tabular">${editingThis ? cell('stones.'+s.idx+'.pcs', s.pcs??0, 'wt') : (s.pcs??'—')}</td><td class="py-1.5 text-right tabular mono">${cell('stones.'+s.idx+'.wt', s.wt, 'wt')}</td><td class="py-1.5 text-right tabular mono">${cell('stones.'+s.idx+'.rate', s.rate)}</td><td class="py-1.5 text-right tabular mono">${inr0(s.amt)}</td></tr>`).join('')}
            </tbody>
          </table>
        `)).join('')}
        ${panel('Charges (Actual)', `
          <table class="w-full text-[12px]">
            <thead><tr class="text-slate-400 text-[10px] uppercase"><th class="text-left font-medium pb-1">Charge</th><th class="text-right font-medium pb-1">Wt (g)</th><th class="text-right font-medium pb-1">Rate</th><th class="text-right font-medium pb-1">Amount</th><th class="text-right font-medium pb-1">Estimate</th></tr></thead>
            <tbody>
              <tr class="border-t border-slate-100 ${row.actMaking!==row.autoActMaking?'bg-amber-50/50':''}"><td class="py-1.5 text-slate-700">Making Charges</td><td></td><td></td><td class="py-1.5 text-right tabular mono">${cell('charges.Making Charges.amount', row.actMaking)}</td><td class="py-1.5 text-right tabular mono text-slate-400">${inr0(row.estMaking)}</td></tr>
              <tr class="border-t border-slate-100 ${(row.actWastageWt!==row.autoActWastageWt||row.actWastageRate!==row.estWastageRate)?'bg-amber-50/50':''}"><td class="py-1.5 text-slate-700">Wastage / Chizzat</td><td class="py-1.5 text-right tabular mono">${cell('charges.Wastage Charges.wt', row.actWastageWt, 'wt')}</td><td class="py-1.5 text-right tabular mono">${cell('charges.Wastage Charges.rate', row.actWastageRate)}</td><td class="py-1.5 text-right tabular mono">${inr0(row.actWastage)}</td><td class="py-1.5 text-right tabular mono text-slate-400">${wt(row.estWastageWt)}g · ${inr0(row.estWastage)}</td></tr>
              ${row.otherChargeLines.map(c=>`<tr class="border-t border-slate-100 ${c.overridden?'bg-amber-50/50':''}"><td class="py-1.5 text-slate-700">${c.type}</td><td></td><td></td><td class="py-1.5 text-right tabular mono">${cell('charges.'+c.type+'.amount', c.amt)}</td><td class="py-1.5 text-right tabular mono text-slate-400">${inr0(c.estAmt)}</td></tr>`).join('')}
            </tbody>
          </table>
        `)}
        ${editingThis ? `
        <div class="bg-amber-50 border border-amber-200 rounded-md p-2.5 flex items-center gap-1.5">
          <span class="text-[10.5px] text-amber-800 flex-1">Sabhi highlighted cells edit ho sakti hain — Gold/Stone rate &amp; weight, har Charge, aur Profit%/GST% (sidebar mein). Save karte hi timeline mein record hoga.</span>
          <button data-costing-edit-save="${job.id}" class="h-7 px-3 rounded bg-blue-800 text-white text-[11px] font-medium hover:bg-blue-900 shrink-0">Save &amp; Log Changes</button>
          <button data-costing-edit-cancel class="h-7 px-3 rounded border border-slate-200 text-[11px] text-slate-600 hover:bg-slate-50 shrink-0">Cancel</button>
        </div>` : ''}
        ${panel(`Timeline / Edit History ${log.length?'('+log.length+')':''}`, log.length ? `
          <div class="space-y-1.5 max-h-[220px] overflow-y-auto">
            ${log.map(l => {
              const fmtVal = v => l.fmt==='pct' ? Number(v).toFixed(2)+'%' : l.fmt==='wt' ? wt(v)+' g' : l.fmt==='num' ? String(v) : l.fmt==='text' ? v : inr0(v);
              return `<div class="text-[11px] border-l-2 border-amber-300 pl-2"><span class="font-medium text-slate-800">${l.label}</span> changed: <span class="mono text-rose-700">${fmtVal(l.oldVal)}</span> → <span class="mono text-emerald-700">${fmtVal(l.newVal)}</span><div class="text-[10px] text-slate-400">${new Date(l.ts).toLocaleString('en-IN')} · Admin</div></div>`;
            }).join('')}
          </div>` : `<div class="text-[11px] text-slate-400">Abhi tak koi Admin override nahi hua — jo bhi cell edit karke save karoge, wo yahan record hoga.</div>`)}
      </div>
      <div class="col-span-1">
        <div class="sticky top-0 space-y-3">
          <div class="bg-white border border-slate-200 rounded-md">
            <div class="px-3 pt-2 text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Costing Summary (Actual)</div>
            <div class="px-3 pb-3">
              ${field('Cost (Rs.)', inr(row.actCost))}
              <div class="flex items-center py-1 text-[12px]">
                <span class="text-slate-500 w-[46%] shrink-0">Add Profit %</span>
                <span class="text-slate-800 mono">${editingThis ? cell('profitPct', row.profitPct, 'pct') : row.profitPct.toFixed(2)+'%'}</span>
              </div>
              ${field('Profit Amount', inr(row.profitAmt))}
              <div class="border-t border-slate-100 my-1"></div>
              ${field('Net Amount (Rs.)', inr(row.actNet), true)}
              <div class="flex items-center py-1 text-[12px]">
                <span class="text-slate-500 w-[46%] shrink-0">GST %</span>
                <span class="text-slate-800 mono">${editingThis ? cell('gstPct', row.gstPct, 'pct') : row.gstPct.toFixed(2)+'%'}</span>
              </div>
              ${field('GST Amount', inr(row.actGstAmt))}
              <div class="border-t border-slate-100 my-1"></div>
              ${field('Amount Payable (Rs.)', inr(row.actGrandTotal), true)}
            </div>
          </div>
          <div class="bg-white border border-slate-200 rounded-md p-3">
            <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1.5">Estimate vs Actual</div>
            <div class="text-[12px] text-slate-700">Estimate Net: <span class="mono font-semibold">${inr0(row.estNet)}</span></div>
            <div class="text-[12px] text-slate-700 mt-0.5">Actual Net: <span class="mono font-semibold">${inr0(row.actNet)}</span></div>
            <div class="text-[12px] font-semibold mt-1 ${varAmt>0?'text-rose-700':varAmt<0?'text-emerald-700':'text-slate-500'}">Variance: ${varAmt>=0?'+':''}${inr0(varAmt)} (${varPct>=0?'+':''}${varPct.toFixed(2)}%)</div>
          </div>
          ${!opts.readOnly ? `
          <div class="bg-white border border-slate-200 rounded-md p-3">
            ${alreadyInvoiced
              ? `<button data-invoice-open="${alreadyInvoiced.id}" class="w-full h-8 rounded border border-emerald-300 bg-emerald-50 text-emerald-800 text-[12px] font-medium hover:bg-emerald-100 flex items-center justify-center gap-1.5"><i data-lucide="badge-check" class="w-3.5 h-3.5"></i> View Invoice ${alreadyInvoiced.id}</button>`
              : `<button data-create-invoice="${job.id}" class="w-full h-8 rounded bg-blue-800 text-white text-[12px] font-medium hover:bg-blue-900">Create Invoice from Actuals</button>`}
          </div>` : ''}
        </div>
      </div>
    </div>`;
}

function renderCosting(){
  const rows = jobs.map(j => ({ job:j, row: computeActualCosting(j.id) })).filter(x => x.row);
  const inspect = costingInspectJob ? rows.find(x => x.job.id === costingInspectJob) : null;
  const varClr = v => v>0 ? 'text-rose-700' : (v<0 ? 'text-emerald-700' : 'text-slate-500');
  return `
  ${workspaceHeader({crumb:'Finance / Final Costing', title:'Final Costing', sub:'Jab ek estimate ke saare job cards close ho jaate hain, unka Actual Costing yahan Estimate jaise hi format mein ban jaata hai — bas estimate rough hota hai, ye us par actuals hai', tabs:null})}
  <div class="flex-1 overflow-auto">
    ${rows.length ? `
    <table class="w-full border-collapse">
      <thead class="sticky top-0 z-10"><tr class="bg-slate-50 border-b border-slate-200">
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Job / Item</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Customer</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Status</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Net Est</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Net Actual</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Variance</th>
      </tr></thead>
      <tbody>
        ${rows.map(({job,row}) => {
          const varPct = row.estNet ? ((row.actNet-row.estNet)/row.estNet*100) : 0;
          const active = job.id === costingInspectJob;
          return `<tr data-costing-row="${job.id}" class="border-b border-slate-100 h-10 hover:bg-blue-50/60 cursor-pointer ${active?'bg-blue-50':''}">
            <td class="px-3 text-[12px]"><span class="mono text-blue-800">${job.id}</span><div class="text-slate-700">${row.item}${row.overridden?' <span class="text-amber-700">·adj</span>':''}</div></td>
            <td class="px-3 text-[12px] text-slate-600">${job.party}</td>
            <td class="px-3">${job.closed ? pill('Closed — Ready', 'bg-emerald-50 text-emerald-800 border-emerald-200') : pill(STAGE_LABEL[job.stage]||job.stage, 'bg-slate-50 text-slate-500 border-slate-200')}</td>
            <td class="px-3 text-[12px] text-right tabular mono">${inr0(row.estNet)}</td>
            <td class="px-3 text-[12px] text-right tabular mono font-medium">${inr0(row.actNet)}</td>
            <td class="px-3 text-[12px] text-right tabular mono font-medium ${varClr(varPct)}">${varPct>=0?'+':''}${varPct.toFixed(2)}%</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>` : `<div class="p-6 text-center text-[12px] text-slate-400">Abhi tak koi job kisi estimate se linked nahi hai.</div>`}
    ${inspect
      ? (inspect.job.closed
          ? `<div class="p-4">${actualCostingDocument(inspect.job)}</div>`
          : `<div class="p-6 text-center text-[12px] text-slate-400">${inspect.job.id} abhi Close nahi hua — production/reconciliation complete karke Job Card mein "Close Job Card" karo, tabhi yahan Estimate jaisa Actual Costing document banega.<br/>Filhaal (${STAGE_LABEL[inspect.job.stage]||inspect.job.stage}) Actual Net so far: ${inr0(inspect.row.actNet)}</div>`)
      : `<div class="p-6 text-center text-[12px] text-slate-400">Kisi row pe click karo — Actual Costing document (Estimate jaisa hi format) aur variance yahin milega.</div>`}
  </div>`;
}

/* ============================================================
   DISPATCH & INVOICING
   ============================================================ */
function renderDispatch(){
  let rows = invoices.slice();
  if(state.query) rows = rows.filter(i => (i.id+i.job+i.customer).toLowerCase().includes(state.query.toLowerCase()));
  // Jobs that have physically reached the Dispatched stage but have no invoice yet — these are
  // exactly the ones stuck invisible before this fix (Dispatch page only ever showed invoices).
  const readyToInvoice = jobs.filter(j => j.stage === 'dispatched' && !invoices.find(i => i.job === j.id));
  return `
  ${workspaceHeader({crumb:'Finance / Dispatch', title:'Dispatch & Invoicing', sub:`${invoices.length} invoices · ${inr0(invoices.reduce((s,i)=>s+i.net,0))} total billed value`, tabs:null, primaryLabel:'Create Invoice', primaryIcon:'plus', primaryAction:'create-invoice'})}
  ${readyToInvoice.length ? `
  <div class="px-4 pt-3">
    <div class="bg-amber-50 border border-amber-200 rounded-md p-3">
      <div class="text-[11px] uppercase tracking-wider text-amber-800 font-semibold mb-2">Dispatched — Ready to Invoice (${readyToInvoice.length})</div>
      <div class="space-y-1.5">
        ${readyToInvoice.map(j => {
          const row = computeActualCosting(j.id);
          return `
          <div class="flex items-center gap-2 bg-white border border-amber-100 rounded px-2.5 py-1.5">
            <div class="flex-1 min-w-0">
              <span class="mono text-blue-800 text-[12px]">${j.id}</span>
              <span class="text-[12px] text-slate-700"> · ${j.item}</span>
              <div class="text-[10.5px] text-slate-400">${j.party} · Due ${j.due}${row?' · '+inr0(row.actGrandTotal)+' payable (incl. GST)':''}</div>
            </div>
            <button data-costing-open="${j.id}" class="h-6 px-2 rounded border border-slate-200 text-[10.5px] text-slate-700 hover:bg-slate-50">Open Final Costing</button>
            <button data-create-invoice="${j.id}" class="h-6 px-2 rounded bg-blue-800 text-white text-[10.5px] hover:bg-blue-900">Create Invoice</button>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>` : ''}
  ${toolbarRow({placeholder:'Filter by invoice no., job, customer…', filters:[], count:rows.length, total:invoices.length})}
  <div class="flex-1 overflow-auto">
    <table class="w-full border-collapse">
      <thead class="sticky top-0 z-10"><tr class="bg-slate-50 border-b border-slate-200">
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Invoice No.</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Job</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Customer</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Date</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Amount</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">GST (3%)</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Net Payable</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Dispatch Mode</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Tracking</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Status</th>
      </tr></thead>
      <tbody>
        ${rows.map(i => `
          <tr data-invoice-row="${i.id}" class="border-b border-slate-100 h-9 hover:bg-blue-50/60 cursor-pointer ${dispatchInspectInvoice===i.id?'bg-blue-50':''}">
            <td class="px-3 text-[12px] mono text-blue-800">${i.id}</td>
            <td class="px-3 text-[12px] mono text-slate-700">${i.job}</td>
            <td class="px-3 text-[12px] text-slate-900">${i.customer}</td>
            <td class="px-3 text-[12px] text-slate-600 tabular">${i.date}</td>
            <td class="px-3 text-[12px] text-right tabular mono">${inr0(i.amount)}</td>
            <td class="px-3 text-[12px] text-right tabular mono">${inr0(i.gst)}</td>
            <td class="px-3 text-[12px] text-right tabular mono font-medium">${inr0(i.net)}</td>
            <td class="px-3 text-[12px] text-slate-600">${i.mode}</td>
            <td class="px-3 text-[12px] text-slate-600 mono">${i.tracking}</td>
            <td class="px-3">${pill(INV_STATUS_LABEL[i.status], INV_STATUS_STYLE[i.status])}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    ${dispatchInspectInvoice ? invoiceDetailPanel(dispatchInspectInvoice) : ''}
  </div>`;
}

// Same Estimate-format document (Pure Gold / Stones / Charges / Costing Summary), stamped as
// a Tax Invoice — so Estimate, Final Costing and Invoice always look like the same document,
// just rough vs actual vs billed.
function invoiceDetailPanel(invId){
  const inv = invoices.find(i => i.id === invId);
  if(!inv) return '';
  const job = jobs.find(j => j.id === inv.job);
  if(!job) return `<div class="p-6 text-center text-[12px] text-slate-400">Linked job nahi mila.</div>`;
  return `
    <div class="p-4">
      <div class="bg-white border border-blue-200 rounded-md p-3 mb-3 max-w-[1200px] flex items-center justify-between">
        <div>
          <div class="text-[14px] font-semibold text-slate-900">Tax Invoice — ${inv.id}</div>
          <div class="text-[11px] text-slate-500 mt-0.5">${inv.customer} · ${inv.date} · ${job.id} · ${pill(INV_STATUS_LABEL[inv.status], INV_STATUS_STYLE[inv.status])}</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-400 uppercase">Net Payable</div>
          <div class="text-[18px] font-semibold text-blue-800 mono">${inr(inv.net)}</div>
        </div>
      </div>
      ${actualCostingDocument(job, {readOnly:true})}
    </div>`;
}

/* ============================================================
   GOLD LEDGER — passbook-style, merges materialIssues (gold-type, Out to karigars) with
   productionReturns (finished/dust/unused/scrap = In, wastage/chizzat = Out), running balance
   starting from the Main Store's current stockLedger.gold balance.
   ============================================================ */
function buildGoldLedgerRows(){
  const rows = [];
  materialIssues.forEach(m => {
    if(m.material.startsWith('Gold')) rows.push({ date:m.date, ref:m.job, karigar:m.karigar, material:m.material, type:'Issued to Karigar', in:0, out:m.wtIssued });
  });
  productionReturns.forEach(p => {
    if(p.kind === 'wastage') rows.push({ date:p.date, ref:p.job, karigar:p.karigar, material:p.material, type:'Chizzat / Process Loss', in:0, out:p.wt });
    else if(['finished','gold_dust','unused_gold','gold_scrap','approved_loss'].includes(p.kind)) rows.push({ date:p.date, ref:p.job, karigar:p.karigar, material:p.material, type:RETURN_KIND_LABEL[p.kind]||p.kind, in:p.wt, out:0 });
  });
  rows.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const opening = stockLedger.gold.reduce((s,g)=>s+g.balance,0);
  let running = opening;
  const withBal = rows.map(r => { running = +(running - r.out + r.in).toFixed(3); return { ...r, balance: running }; });
  return { rows: withBal, opening, closing: running };
}

/* ============================================================
   PARTY (CUSTOMER) LEDGER — groups invoices by customer, tracks paidAmount, drills into a
   per-customer statement. Record Payment posts to cashLedger (type:'receipt').
   ============================================================ */
function partyLedgerSummary(){
  const byCustomer = {};
  invoices.forEach(inv => {
    const paid = inv.paidAmount || 0;
    if(!byCustomer[inv.customer]) byCustomer[inv.customer] = { customer:inv.customer, orders:0, net:0, paid:0 };
    byCustomer[inv.customer].orders += 1;
    byCustomer[inv.customer].net += inv.net;
    byCustomer[inv.customer].paid += paid;
  });
  return Object.values(byCustomer).map(c => ({ ...c, outstanding: +(c.net - c.paid).toFixed(2) }));
}

function renderLedgerParty(){
  if(state.ledgerPartyFocus) return partyLedgerDetail(state.ledgerPartyFocus);
  const summary = partyLedgerSummary();
  const totalOutstanding = summary.reduce((s,c)=>s+c.outstanding,0);
  return `
  ${workspaceHeader({crumb:'Ledgers / Party', title:'Party (Customer) Ledger', sub:`${summary.length} customers · ${inr0(totalOutstanding)} total outstanding receivable`, tabs:null})}
  <div class="flex-1 overflow-auto p-4">
    <div class="bg-white border border-slate-200 rounded-md">

/* ============================================================

function renderLedgerCash(){
  const rows = cashLedger.slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  let running = 0;
  const withBal = rows.map(c => {
    const amt = c.type==='payment' || c.direction==='out' ? -Math.abs(c.amount) : Math.abs(c.amount);

  return `
  ${workspaceHeader({crumb:'Ledgers / Cash & Bank', title:'Cash & Bank Ledger', sub:`${rows.length} entries · ${inr0(running)} current balance`, tabs:null, primaryLabel:'Entry', primaryIcon:'plus', primaryAction:'new-cash-entry'})}

/* ============================================================
   REPORTS — a few solid, fully-derived cuts of existing data with a local report-focus toggle.

const REPORT_DEFS = [
  { key:'reconciliation', label:'Gold Reconciliation Summary' },
  { key:'wastage', label:'Karigar-wise Wastage %' },
  { key:'variance', label:'Estimate vs Actual Variance' },
  { key:'aging', label:'Job Aging' },
  { key:'receivables', label:'Outstanding Receivables' },
  { key:'payables', label:'Karigar Payables' },
];
const REPORT_TODAY = new Date('2026-08-12');

function reportBody(key){
  if(key === 'reconciliation'){
    if(!reconciliations.length) return `<div class="p-6 text-center text-[12px] text-slate-400">No reconciliation records yet.</div>`;
    return `<table class="w-full border-collapse">
      <thead class="bg-slate-50 border-b border-slate-200"><tr>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Job</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Karigar</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Stage</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Gross Issued</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Actual Gold</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Chizzat %</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Status</th>
      </tr></thead>
      <tbody>
        ${reconciliations.map(r => {
          const exceeds = r.wastagePct > RECONCILE_TOLERANCE_PCT;
          const status = !exceeds ? pill('Within Tolerance','bg-emerald-50 text-emerald-800 border-emerald-200') : (r.varianceApproved ? pill('Approved','bg-blue-50 text-blue-800 border-blue-200') : pill('Needs Approval','bg-rose-50 text-rose-800 border-rose-200'));
          return `<tr class="border-b border-slate-100 h-9 hover:bg-slate-50">
            <td class="px-3 text-[12px] mono text-blue-800">${r.job}</td>
            <td class="px-3 text-[12px] text-slate-900">${r.karigar}</td>
            <td class="px-3 text-[12px] text-slate-600">${STAGE_LABEL[r.stage]||r.stage}</td>
            <td class="px-3 text-[12px] text-right tabular mono">${wt(r.grossIssued)}</td>
            <td class="px-3 text-[12px] text-right tabular mono">${wt(r.fineGoldReturned)}</td>
            <td class="px-3 text-[12px] text-right tabular mono">${(r.wastagePct||0).toFixed(2)}%</td>
            <td class="px-3">${status}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }
  if(key === 'wastage'){
    const byKarigar = {};
    reconciliations.forEach(r => {
      if(!byKarigar[r.karigar]) byKarigar[r.karigar] = { karigar:r.karigar, issued:0, chizzat:0, rounds:0 };
      byKarigar[r.karigar].issued += r.grossIssued||0;
      byKarigar[r.karigar].chizzat += r.wastageWt||0;
      byKarigar[r.karigar].rounds += 1;
    });
    const rows = Object.values(byKarigar);
    if(!rows.length) return `<div class="p-6 text-center text-[12px] text-slate-400">No reconciliation records yet.</div>`;
    return `<table class="w-full border-collapse">
      <thead class="bg-slate-50 border-b border-slate-200"><tr>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Karigar</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Rounds</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Gold Issued (g)</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Chizzat (g)</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Avg Wastage %</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr class="border-b border-slate-100 h-9 hover:bg-slate-50">
          <td class="px-3 text-[12px] text-slate-900">${r.karigar}</td>
          <td class="px-3 text-[12px] text-right tabular">${r.rounds}</td>
          <td class="px-3 text-[12px] text-right tabular mono">${wt(r.issued)}</td>
          <td class="px-3 text-[12px] text-right tabular mono">${wt(r.chizzat)}</td>
          <td class="px-3 text-[12px] text-right tabular mono font-medium ${r.issued && (r.chizzat/r.issued*100)>RECONCILE_TOLERANCE_PCT ? 'text-rose-700':'text-emerald-700'}">${r.issued?(r.chizzat/r.issued*100).toFixed(2):'0.00'}%</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
  }
  if(key === 'variance'){
    const rows = jobs.map(j => ({ job:j, row: computeActualCosting(j.id) })).filter(x => x.row);
    if(!rows.length) return `<div class="p-6 text-center text-[12px] text-slate-400">No jobs linked to estimates yet.</div>`;
    return `<table class="w-full border-collapse">
      <thead class="bg-slate-50 border-b border-slate-200"><tr>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Job / Item</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Customer</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Net Est</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Net Actual</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Variance %</th>
      </tr></thead>
      <tbody>
        ${rows.map(({job,row}) => {
          const varPct = row.estNet ? ((row.actNet-row.estNet)/row.estNet*100) : 0;
          return `<tr class="border-b border-slate-100 h-9 hover:bg-slate-50">
          <td class="px-3 text-[12px]"><span class="mono text-blue-800">${job.id}</span><div class="text-slate-700">${row.item}</div></td>
          <td class="px-3 text-[12px] text-slate-600">${job.party}</td>
          <td class="px-3 text-[12px] text-right tabular mono">${inr0(row.estNet)}</td>
          <td class="px-3 text-[12px] text-right tabular mono">${inr0(row.actNet)}</td>
          <td class="px-3 text-[12px] text-right tabular mono font-medium ${varPct>0?'text-rose-700':varPct<0?'text-emerald-700':'text-slate-500'}">${varPct>=0?'+':''}${varPct.toFixed(2)}%</td>
        </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }
  if(key === 'aging'){
    const open = jobs.filter(j => j.stage !== 'dispatched');
    if(!open.length) return `<div class="p-6 text-center text-[12px] text-slate-400">No open jobs.</div>`;
    return `<table class="w-full border-collapse">
      <thead class="bg-slate-50 border-b border-slate-200"><tr>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Job</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Item</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Stage</th>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Due Date</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Days Overdue</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Days in Stage</th>
      </tr></thead>
      <tbody>
        ${open.map(j => {
          const due = new Date(j.due);
          const daysOverdue = isNaN(due.getTime()) ? 0 : Math.round((REPORT_TODAY - due) / 86400000);
          return `<tr class="border-b border-slate-100 h-9 hover:bg-slate-50">
          <td class="px-3 text-[12px] mono text-blue-800">${j.id}</td>
          <td class="px-3 text-[12px] text-slate-700">${j.item}</td>
          <td class="px-3">${pill(STAGE_LABEL[j.stage], STAGE_STYLE[j.stage])}</td>
          <td class="px-3 text-[12px] text-slate-600 tabular">${j.due}</td>
          <td class="px-3 text-[12px] text-right tabular mono font-medium ${daysOverdue>0?'text-rose-700':'text-emerald-700'}">${daysOverdue>0?'+'+daysOverdue:daysOverdue}</td>
          <td class="px-3 text-[12px] text-right tabular mono">${j.daysInStage}</td>
        </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  }
  if(key === 'receivables'){
    const summary = partyLedgerSummary().filter(c => c.outstanding > 0);
    if(!summary.length) return `<div class="p-6 text-center text-[12px] text-slate-400">No outstanding receivables.</div>`;
    return `<table class="w-full border-collapse">
      <thead class="bg-slate-50 border-b border-slate-200"><tr>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Customer</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Total Billed</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Paid</th>
        <th class="px-3 py-2 text-right text-[10px] uppercase tracking-wider font-semibold text-slate-500">Outstanding</th>
      </tr></thead>
      <tbody>
        ${summary.map(c => `<tr class="border-b border-slate-100 h-9 hover:bg-slate-50">
          <td class="px-3 text-[12px] text-slate-900">${c.customer}</td>
          <td class="px-3 text-[12px] text-right tabular mono">${inr0(c.net)}</td>
          <td class="px-3 text-[12px] text-right tabular mono text-emerald-700">${inr0(c.paid)}</td>

      const k = karigars.find(x => x.id === c.ref);
      const name = k ? k.name : c.ref;
      if(!byKarigar[name]) byKarigar[name] = { karigar:name, due:0 };
      byKarigar[name].due -= c.amount;
    });
    const rows = Object.values(byKarigar).filter(r => Math.abs(r.due) > 0.01);
    if(!rows.length) return `<div class="p-6 text-center text-[12px] text-slate-400">No labour dues recorded yet.</div>`;
    return `<table class="w-full border-collapse">
      <thead class="bg-slate-50 border-b border-slate-200"><tr>
        <th class="px-3 py-2 text-left text-[10px] uppercase tracking-wider font-semibold text-slate-500">Karigar</th>

function render(){
  renderNav();
  const root = document.getElementById('view-root');
  const drawerRoot = document.getElementById('drawer-root');
  const sidebar = document.getElementById('sidebar');

  drawerRoot.innerHTML = '';

  if(state.creating === 'estimate' && draftEstimate){
    root.className = 'flex-1 flex flex-col overflow-hidden active';
    root.innerHTML = renderNewEstimatePage();
    if(sidebar) sidebar.classList.add('hidden');
  } else if(state.inspectType === 'estimate' && state.inspect){
    if(sidebar) sidebar.classList.remove('hidden');

    root.innerHTML = estimateDetailPage(state.inspect);
  } else if(state.inspectType === 'job' && state.inspect){
    if(sidebar) sidebar.classList.remove('hidden');
    root.className = 'flex-1 flex flex-col overflow-hidden active';
    root.innerHTML = jobDetailPage(state.inspect);
  } else {
    if(sidebar) sidebar.classList.remove('hidden');
    root.className = 'flex-1 flex flex-col overflow-hidden active';
    root.innerHTML = VIEW_RENDERERS[state.view] ? VIEW_RENDERERS[state.view]() : '';

  if(modalRoot) modalRoot.innerHTML = approveModal ? approveModalMarkup()

  wireRowEvents();
  renderIcons();
  saveAppState();
}

/* ============================================================
   APPROVE ESTIMATE MODAL — sends to production + target delivery date
   ============================================================ */
function openApproveModal(estId){
  const est = estimates.find(x => x.id === estId);
  if(!est) return;
  const defaultDate = est.targetDeliveryDate || new Date(Date.now()+14*86400000).toISOString().slice(0,10);
  approveModal = { estId, date: defaultDate, sendToProduction: true };
  state.rowMenuFor = null;
  render();
}

function closeApproveModal(){ approveModal = null; render(); }

function confirmApproveModal(){
  const dateEl = document.getElementById('approveModalDate');
  const chkEl = document.getElementById('approveModalSendChk');
  const date = dateEl ? dateEl.value : '';
  const sendToProd = chkEl ? chkEl.checked : true;
  if(!date){ toast('Target delivery date dijiye', true); return; }
  const est = estimates.find(x => x.id === approveModal.estId);
  approveModal = null;
  if(!est) { render(); return; }
  est.status = 'approved';
  est.targetDeliveryDate = date;
  if(sendToProd){
    createJobFromEstimate(est);
  } else {
    toast(est.id+' approved · target delivery '+date);
    render();
  }
}

function createJobFromEstimate(est){
  const existing = jobs.find(j => j.estId === est.id);
  if(existing){
    state.view = 'jobs'; state.inspect = existing.id; state.inspectType = 'job';
    toast('Job card already exists — '+existing.id);
    render();
    return;
  }
  const dueDate = est.targetDeliveryDate || new Date(Date.now()+12*86400000).toISOString().slice(0,10);
  const newJob = {
    id: 'JOB-2026-' + est.id.split('-').pop(), estId: est.id, item: est.item, party: est.party,
    due: dueDate, stage:'material_issued', karigar:'Unassigned',
    gwEst: est.gw, daysInStage: 0, priority:'normal',
    karigarAssignments: { material_issued:[], casting:[], stone_setting:[], polishing:[], qc_hallmark:[], dispatch_ready:[], dispatched:[] }
  };
  jobs.unshift(newJob);
  state.view = 'jobs'; state.inspect = newJob.id; state.inspectType = 'job';
  toast('Sent to production — '+newJob.id+' · target delivery '+dueDate);
  render();
}

/* ============================================================
   ASSIGN / REASSIGN KARIGAR MODAL — stage-wise, multi-karigar per job
   ============================================================ */
function openAssignModal(jobId, stage){
  const job = jobs.find(x => x.id === jobId);
  if(!job) return;
  if(!job.karigarAssignments) job.karigarAssignments = {};
  if(!job.karigarAssignments[stage]) job.karigarAssignments[stage] = [];
  assignModal = { jobId, stage, pick: '' };
  state.rowMenuFor = null;
  render();
}

function closeAssignModal(){ assignModal = null; render(); }

function confirmAssignModal(){
  const job = jobs.find(x => x.id === assignModal.jobId);
  if(!job) { assignModal = null; render(); return; }
  const picked = assignModal.pick;
  if(!picked){ toast('Ek karigar select karo', true); return; }
  if(!job.karigarAssignments) job.karigarAssignments = {};
  if(!job.karigarAssignments[assignModal.stage]) job.karigarAssignments[assignModal.stage] = [];
  if(job.karigarAssignments[assignModal.stage].includes(picked)){ toast(picked+' already assigned to this stage', true); return; }
  job.karigarAssignments[assignModal.stage].push(picked);
  const stageLabel = STAGE_LABEL[assignModal.stage];
  assignModal = null;
  toast(`${picked} added to ${stageLabel} — ${job.id}`);
  render();
}

function removeKarigarFromStage(jobId, stage, name){
  const job = jobs.find(x => x.id === jobId);
  if(!job || !job.karigarAssignments || !job.karigarAssignments[stage]) return;
  job.karigarAssignments[stage] = job.karigarAssignments[stage].filter(n => n !== name);
  toast(`${name} removed from ${STAGE_LABEL[stage]} — ${job.id}`, true);
  render();
}

        <button id="assignModalCancel" class="ml-auto w-7 h-7 grid place-items-center rounded hover:bg-slate-100"><i data-lucide="x" class="w-4 h-4 text-slate-500"></i></button>

        <div class="text-[12px] text-slate-500 mb-2">
          <span class="mono text-blue-800 font-medium">${job.id}</span> · ${job.item}<br/>
          <span class="text-slate-400">Stage: ${STAGE_LABEL[stage]}${skill?' · Skill: '+skill:''}</span>

        ${already.length ? `<div class="flex flex-wrap gap-1 mb-2">${already.map(n=>`<span class="h-6 px-2 rounded border border-slate-200 bg-slate-50 text-[11px] text-slate-600 flex items-center">${n}</span>`).join('')}</div>` : ''}

let paymentModal = null; // { refType:'invoice'|'karigar', refId, amount, date }

function openPaymentModal(refType, refId){
  paymentModal = { refType, refId, amount: '', date: new Date().toISOString().slice(0,10) };
  render();
}
function closePaymentModal(){ paymentModal = null; render(); }
function confirmPaymentModal(){
  const amt = Number(paymentModal.amount);
  if(!amt || amt <= 0){ toast('Amount dijiye', true); return; }
  if(paymentModal.refType === 'invoice'){

/* ============================================================
   RECEIVE & RECONCILE — close a karigar's material loop for a stage
   Captures finished piece / filler(wax,wire,solder) / gold dust / unused gold /
   stone returns, computes live Net Wastage %, and posts every component back
   into its own ledger (Material Issue Ledger + Stock Ledger + Production Returns).
   ============================================================ */
const RECONCILE_TOLERANCE_PCT = 2;

function reconcileOpenIssues(jobId, stage, karigar){
  return materialIssues.filter(m => m.job===jobId && m.stage===stage && m.karigar===karigar && m.status!=='closed');
}

function openReconcileModal(jobId, stage, karigar){
  const job = jobs.find(x => x.id === jobId);
  if(!job) return;
  reconcileModal = {
    jobId, stage, karigar,
    finishedTotalWt: '', pieceIsFineGold: true, nonGoldInPieceWt: '',
    dustWt: '', unusedGoldWt: '', fillerWt: '', approvedLossWt: '', waxWt: '', otherMaterialWt: '', stoneReturnedWt: '',
    varianceApproved: false, varianceApprover: '', varianceNote: '',
    notes: '', date: new Date().toISOString().slice(0,10),
    labUnit: 'Per Gram', labQty: '', labRate: '',
  };
  render();
}

function closeReconcileModal(){ reconcileModal = null; render(); }

// Core math ("chizzat" / process loss) — a job-level, auditable gold balance:
//   Actual Gold in Finished Product = Finished Product Weight − (Stone/Non-Gold-in-piece + Wax/Wire + Other Non-Gold)
//   Chizzat / Process Loss           = Gold Issued − Actual Gold in Finished − Gold Dust − Unused Gold − Gold Scrap − Approved Loss
// Chizzat is a PLUG figure (never manually typed) so Total Accounted Gold always reconciles back to
// Gold Issued unless the entered returns exceed what was issued (over-reconciliation — flagged, not hidden).
function reconcileCalcNumbers(){
  const r = reconcileModal;
  const openIssues = reconcileOpenIssues(r.jobId, r.stage, r.karigar);
  const goldIssues = openIssues.filter(m => m.material.startsWith('Gold'));
  const stoneIssues = openIssues.filter(m => !m.material.startsWith('Gold') && m.material !== 'Wax / Model');
  const grossIssued = goldIssues.reduce((s,m)=>s+m.wtIssued, 0);
  const fineIssued = goldIssues.reduce((s,m)=>s + m.wtIssued * (KARAT_FACTOR[m.material]||1), 0);
  const stoneIssuedQty = stoneIssues.reduce((s,m)=>s+m.wtIssued, 0);
  const primaryGoldType = goldIssues[0] ? goldIssues[0].material : null;
  const primaryStoneType = stoneIssues[0] ? stoneIssues[0].material : null;

  const finishedTotalWt = Number(r.finishedTotalWt)||0;
  const nonGoldInPieceWt = r.pieceIsFineGold ? 0 : (Number(r.nonGoldInPieceWt)||0); // stone/inlay weighed inside the piece
  const waxWt = Number(r.waxWt)||0;                     // wax/wire weighed inside the returned piece
  const otherMaterialWt = Number(r.otherMaterialWt)||0; // other non-gold weighed inside the returned piece
  const dustWt = Number(r.dustWt)||0;
  const unusedGoldWt = Number(r.unusedGoldWt)||0;
  const scrapWt = Number(r.fillerWt)||0; // sprue/filings recovered separately — still gold, still accountable
  const approvedLossWt = Number(r.approvedLossWt)||0; // manager pre-approved standing loss allowance
  const stoneReturnedWt = Number(r.stoneReturnedWt)||0;

  // Actual Gold in Finished Product — do NOT subtract this twice anywhere downstream.
  const nonGoldInFinished = +(nonGoldInPieceWt + waxWt + otherMaterialWt).toFixed(3);
  const actualGoldFinished = Math.max(0, +(finishedTotalWt - nonGoldInFinished).toFixed(3));

  const accountedExplained = +(actualGoldFinished + dustWt + unusedGoldWt + scrapWt + approvedLossWt).toFixed(3);
  const rawGap = grossIssued > 0 ? +(grossIssued - accountedExplained).toFixed(3) : 0;
  const overAccounted = grossIssued > 0 && rawGap < -0.001;
  const chizzatWt = grossIssued > 0 ? Math.max(0, rawGap) : 0;
  const totalAccounted = +(accountedExplained + chizzatWt).toFixed(3);
  const reconcileDiff = grossIssued > 0 ? +(grossIssued - totalAccounted).toFixed(3) : 0;
  const chizzatPct = grossIssued > 0 ? (chizzatWt / grossIssued) * 100 : 0;
  const exceeds = grossIssued > 0 && chizzatPct > RECONCILE_TOLERANCE_PCT;
  const needsApproval = exceeds && !r.varianceApproved;
  return { openIssues, goldIssues, stoneIssues, grossIssued, fineIssued, stoneIssuedQty, primaryGoldType, primaryStoneType,
            actualGoldFinished, fineGoldInPiece: actualGoldFinished, nonGoldInFinished, scrapWt, approvedLossWt, stoneReturnedWt,
            accountedExplained, goldRecovered: accountedExplained, totalAccounted, reconcileDiff,
            chizzatWt, chizzatPct, wastageWt: chizzatWt, wastagePct: chizzatPct,
            overAccounted, exceeds, needsApproval };
}

    </div>

               <input type="checkbox" data-rcf-check="varianceApproved" ${r.varianceApproved?'checked':''} class="w-3.5 h-3.5 accent-rose-700 mt-0.5" />
