// Formula-driven labour costing — pre-configured per production stage, matching how a
// jewellery manufacturer actually pays karigars (a % of the gold+making value they handled,
// or gold+stones for setting work), instead of a flat manually-typed qty × rate.
const LABOUR_RULES = {
  casting: { label:'Casting', calcBase:'Gold+Making', pct:6 },
  polishing: { label:'Filing / Polishing', calcBase:'Gold+Making', pct:3 },
  stone_setting: { label:'Setting', calcBase:'Gold+Stones', pct:8 },
};

function estimateValueBases(est){
  const goldVal = (est.gold||[]).reduce((s,g)=>s+(g.amt||0), 0);
  const stonesVal = (est.stones||[]).reduce((s,st)=>s+(st.amt||0), 0);
  const makingCharge = (est.charges||[]).find(c=>c.type==='Making Charges');
  const makingVal = makingCharge ? chargeAmount(makingCharge) : 0;
  return { goldVal, stonesVal, makingVal };
}

function computeLabourPull(jobId, stage){
  const job = jobs.find(x=>x.id===jobId);
  const est = job ? estimates.find(e=>e.id===job.estId) : null;
  const rule = LABOUR_RULES[stage];
  if(!job || !est || !rule) return null;
  const { goldVal, stonesVal, makingVal } = estimateValueBases(est);
  const base = rule.calcBase === 'Gold+Making' ? goldVal + makingVal : goldVal + stonesVal;
  const amount = +(base * rule.pct / 100).toFixed(2);
  const formula = `${rule.pct}% of (${rule.calcBase.replace('+',' + ')}) = ${rule.pct}% × ${inr0(base)} = ${inr0(amount)}`;
  return { rule, base, amount, formula };
}

function pullLabourForReconcile(){
  const r = reconcileModal;
  const already = labourEntries.find(l => l.job===r.jobId && l.stage===r.stage && l.karigar===r.karigar);
  if(already){ toast('Is karigar/stage ke liye labour already pulled hai', true); return; }
  const pull = computeLabourPull(r.jobId, r.stage);
  if(!pull){ toast('Is stage ke liye koi labour rule configured nahi hai', true); return; }
  labourEntries.unshift({ job:r.jobId, stage:r.stage, karigar:r.karigar, unit:'% of '+pull.rule.calcBase, qty:pull.rule.pct, rate:null, amount:pull.amount, formula:pull.formula, status:'pulled', date:r.date });
  toast(`Labour pulled — ${pull.formula}`);
  render();
}

function addLabourEntry(){
  const r = reconcileModal;
  if(!r.labQty || Number(r.labQty) <= 0){ toast('Qty dijiye', true); return; }
  const qty = Number(r.labQty), rate = r.labRate ? Number(r.labRate) : null;
  labourEntries.unshift({ job: r.jobId, stage: r.stage, karigar: r.karigar, unit: r.labUnit, qty, rate, amount: rate ? +(qty*rate).toFixed(2) : null, status:'manual', date: r.date });
  toast(`Labour entry added — ${qty} (${r.labUnit})${rate?' @ ₹'+rate:''}`);
  r.labQty = ''; r.labRate = '';
  render();
}

function confirmReconcileModal(){
  const r = reconcileModal;
  const job = jobs.find(x => x.id === r.jobId);
  if(!job){ reconcileModal = null; render(); return; }
  const finishedTotalWt = Number(r.finishedTotalWt)||0, nonGoldInPieceWt = Number(r.nonGoldInPieceWt)||0,
        dustWt = Number(r.dustWt)||0, unusedGoldWt = Number(r.unusedGoldWt)||0,
        fillerWt = Number(r.fillerWt)||0, approvedLossWt = Number(r.approvedLossWt)||0, stoneReturnedWt = Number(r.stoneReturnedWt)||0,
        waxWt = Number(r.waxWt)||0, otherMaterialWt = Number(r.otherMaterialWt)||0;
  const total = finishedTotalWt + dustWt + unusedGoldWt + fillerWt + approvedLossWt + stoneReturnedWt + waxWt + otherMaterialWt;
  if(total <= 0){ toast('Kam se kam ek weight field bharo (finished piece / dust / unused / scrap / stone / wax / other)', true); return; }

  const n = reconcileCalcNumbers();

  // Validation: unexplained variance beyond tolerance blocks submission until a manager approves it.
  if(n.needsApproval){ toast('Material variance requires approval — approve karo ya entries adjust karo', true); return; }

  reconciliations.unshift({
    job: r.jobId, stage: r.stage, karigar: r.karigar, grossIssued: n.grossIssued,
    finishedTotalWt, nonGoldInFinished: n.nonGoldInFinished, waxWt, otherMaterialWt,
    fineGoldReturned: n.actualGoldFinished, actualGoldFinished: n.actualGoldFinished,
    dustWt, unusedGoldWt, fillerWt, approvedLossWt, stoneReturnedWt,
    wastageWt: n.wastageWt, wastagePct: n.wastagePct, chizzatWt: n.chizzatWt, chizzatPct: n.chizzatPct,
    totalAccounted: n.totalAccounted, reconcileDiff: n.reconcileDiff,
    varianceApproved: n.exceeds ? !!r.varianceApproved : false,
    varianceApprover: n.exceeds ? (r.varianceApprover||'') : '', varianceNote: r.varianceNote||'', notes: r.notes||'', date: r.date,
  });

  // Post every returned component into its own ledger. Wax/wire/other non-gold weighed inside the
  // piece were already netted out of Actual Gold above — log here only for audit, no stock movement.
  if(n.actualGoldFinished > 0) productionReturns.unshift({ kind:'finished', job:r.jobId, stage:r.stage, karigar:r.karigar, material:n.primaryGoldType||'Finished Piece', wt:n.actualGoldFinished, date:r.date });
  if(waxWt > 0) productionReturns.unshift({ kind:'wax_returned', job:r.jobId, stage:r.stage, karigar:r.karigar, material:'Wax / Wire (in-piece, netted from Actual Gold)', wt:waxWt, date:r.date });
  if(otherMaterialWt > 0) productionReturns.unshift({ kind:'other_material', job:r.jobId, stage:r.stage, karigar:r.karigar, material:'Other Non-Gold (in-piece, netted from Actual Gold)', wt:otherMaterialWt, date:r.date });
  if(n.chizzatWt > 0){
    productionReturns.unshift({ kind:'wastage', job:r.jobId, stage:r.stage, karigar:r.karigar, material:n.primaryGoldType||'Gold', wt:n.chizzatWt, date:r.date });
    job.actualWastageWt = +((job.actualWastageWt||0) + n.chizzatWt).toFixed(3);
  }
  if(approvedLossWt > 0) productionReturns.unshift({ kind:'approved_loss', job:r.jobId, stage:r.stage, karigar:r.karigar, material:n.primaryGoldType||'Gold', wt:approvedLossWt, date:r.date });
  if(fillerWt > 0){
    productionReturns.unshift({ kind:'gold_scrap', job:r.jobId, stage:r.stage, karigar:r.karigar, material:n.primaryGoldType||'Gold', wt:fillerWt, date:r.date });
    const led = n.primaryGoldType && stockLedger.gold.find(g => g.type === n.primaryGoldType);
    if(led){ led.inward = +(led.inward+fillerWt).toFixed(2); led.balance = +(led.balance+fillerWt).toFixed(2); }
  }
  if(dustWt > 0){
    productionReturns.unshift({ kind:'gold_dust', job:r.jobId, stage:r.stage, karigar:r.karigar, material:n.primaryGoldType||'Gold', wt:dustWt, date:r.date });
    const led = n.primaryGoldType && stockLedger.gold.find(g => g.type === n.primaryGoldType);
    if(led){ led.inward = +(led.inward+dustWt).toFixed(2); led.balance = +(led.balance+dustWt).toFixed(2); }
  }
  if(unusedGoldWt > 0){
    productionReturns.unshift({ kind:'unused_gold', job:r.jobId, stage:r.stage, karigar:r.karigar, material:n.primaryGoldType||'Gold', wt:unusedGoldWt, date:r.date });
    const led = n.primaryGoldType && stockLedger.gold.find(g => g.type === n.primaryGoldType);
    if(led){ led.inward = +(led.inward+unusedGoldWt).toFixed(2); led.balance = +(led.balance+unusedGoldWt).toFixed(2); }
  }
  if(stoneReturnedWt > 0){
    productionReturns.unshift({ kind:'stone_return', job:r.jobId, stage:r.stage, karigar:r.karigar, material:n.primaryStoneType||'Stones', wt:stoneReturnedWt, date:r.date });
    const led = n.primaryStoneType && stockLedger.stones.find(s => s.type === n.primaryStoneType);
    if(led){ led.inward = +(led.inward+stoneReturnedWt).toFixed(2); led.balance = +(led.balance+stoneReturnedWt).toFixed(2); }
  }

  // close out any pending/partial material issues for this job+stage+karigar
  materialIssues.forEach(m => {
    if(m.job === r.jobId && m.stage === r.stage && m.karigar === r.karigar && m.status !== 'closed'){
      m.wtReturned = m.wtIssued;
      m.balance = 0;
      m.status = 'closed';
    }
  });
  const wastageMsg = n.grossIssued>0 ? ` · ${wt(n.chizzatWt)} g chizzat logged (${n.chizzatPct.toFixed(2)}%)` : '';
  toast(`${r.karigar} — ${STAGE_LABEL[r.stage]} receipt submitted${wastageMsg}, ledgers updated`);
  reconcileModal = null;
  render();
}

/* ============================================================
   STAGE CARD — karigar assignment + material issue + reconcile, per stage
   ============================================================ */
function stageCard(j, s, i, idx){
  const status = i < idx ? 'done' : (i === idx ? 'current' : 'pending');
  const badgeCls = status==='done' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : status==='current' ? 'bg-blue-50 text-blue-800 border-blue-200' : 'bg-slate-50 text-slate-400 border-slate-200';
  const badgeLabel = status==='done' ? 'Completed' : status==='current' ? 'In Progress' : 'Pending';
  const names = (j.karigarAssignments && j.karigarAssignments[s]) || [];

  const karigarBlock = (name) => {
    const info = karigars.find(k => k.name === name);
    const issues = materialIssues.filter(m => m.job===j.id && m.stage===s && m.karigar===name);
    const openIssues = issues.filter(m => m.status !== 'closed');
    // .find() only ever surfaced the most-recently-added record — if a karigar's material was
    // reconciled in more than one round for this stage, earlier rounds silently vanished from
    // the card even though the data was intact. Show every round, oldest first.
    const recons = reconciliations.filter(r => r.job===j.id && r.stage===s && r.karigar===name).slice().reverse();
    return `
    <div class="border border-slate-200 rounded-md p-2.5">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 grid place-items-center text-[10px] font-semibold shrink-0">${name.split(' ').map(p=>p[0]).join('').slice(0,2)}</div>
        <div class="flex-1 min-w-0">
          <div class="text-[12px] text-slate-900 font-medium truncate">${name}</div>
          <div class="text-[10px] text-slate-400">${info ? info.skill : ''}</div>
        </div>
        <button data-remove-karigar="${j.id}" data-remove-stage="${s}" data-remove-name="${name}" class="w-5 h-5 grid place-items-center rounded hover:bg-rose-50 text-slate-300 hover:text-rose-600" title="Remove"><i data-lucide="x" class="w-3 h-3"></i></button>
      </div>
      ${issues.length ? `
        <div class="mt-2 space-y-1">
          ${issues.map(m => `
            <div class="flex items-center gap-2 text-[11px] bg-slate-50 rounded px-2 py-1">
              <span class="text-slate-700 flex-1 truncate">${m.material}${m.purity && m.purity!=='—' ? ' · '+m.purity : ''}</span>
              <span class="mono text-slate-500">${wt(m.wtIssued)} issued</span>
              <span class="mono text-slate-500">${wt(m.wtReturned)} rtn</span>
              ${pill(m.status[0].toUpperCase()+m.status.slice(1), MI_STATUS_STYLE[m.status])}
            </div>`).join('')}
        </div>` : `<div class="mt-2 text-[10px] text-slate-400">Abhi tak koi material issue nahi hua</div>`}
      ${recons.length ? `
        <div class="mt-2 space-y-1">
          ${recons.length>1 ? `<div class="text-[9.5px] text-slate-400">${recons.length} reconciliation rounds recorded for this stage</div>` : ''}
          ${recons.map((recon,ri) => {
            const exceedsTol = recon.grossIssued>0 && recon.wastagePct>RECONCILE_TOLERANCE_PCT;
            const needsApproval = exceedsTol && !recon.varianceApproved;
            const cls = needsApproval ? 'text-rose-700 bg-rose-50 border-rose-200' : exceedsTol ? 'text-amber-700 bg-amber-50 border-amber-200' : 'text-emerald-700 bg-emerald-50 border-emerald-200';
            const reconIndex = reconciliations.indexOf(recon);
            const approvalOpen = varianceApprovalForm && varianceApprovalForm.reconIndex === reconIndex;
            return `
        <div class="text-[10px] ${cls} border rounded px-2 py-1.5">
          ${recons.length>1 ? `<div class="text-[9px] text-slate-400 font-medium">Round ${ri+1} · ${recon.date}</div>` : ''}
          Reconciled: ${wt(recon.fineGoldReturned)} g actual gold${(recon.waxWt||recon.otherMaterialWt)?' (net of '+wt((recon.waxWt||0)+(recon.otherMaterialWt||0))+' g wax/other)':''} · ${wt(recon.dustWt)} dust · ${wt(recon.unusedGoldWt)} unused${recon.fillerWt?' · '+wt(recon.fillerWt)+' scrap':''}${recon.approvedLossWt?' · '+wt(recon.approvedLossWt)+' approved loss':''}${recon.stoneReturnedWt?' · '+wt(recon.stoneReturnedWt)+' stone returned':''}${recon.grossIssued?' · <b>'+wt(recon.wastageWt)+' g chizzat ('+recon.wastagePct.toFixed(2)+'%)</b>':''}
          ${needsApproval ? (approvalOpen ? `
            <div class="mt-1.5 bg-white border border-rose-200 rounded p-1.5 space-y-1">
              <div class="font-semibold">⚠ Chizzat requires Production Manager approval</div>
              <input data-vaf="approver" value="${varianceApprovalForm.approver}" placeholder="Approved by (name)" class="w-full h-6 px-1.5 rounded border border-slate-200 text-[10px]" />
              <input data-vaf="note" value="${varianceApprovalForm.note}" placeholder="Approval remarks" class="w-full h-6 px-1.5 rounded border border-slate-200 text-[10px]" />
              <div class="flex items-center gap-1 pt-0.5">
                <button data-vaf-confirm class="h-6 px-2 rounded bg-rose-700 text-white text-[10px] hover:bg-rose-800">Save Approval</button>
                <button data-vaf-cancel class="h-6 px-2 rounded border border-slate-200 text-[10px] text-slate-600 hover:bg-slate-50">Cancel</button>
              </div>
            </div>` : `
            <div class="mt-1 flex items-center gap-2">
              <span class="font-semibold">⚠ Chizzat requires approval</span>
              <button data-vaf-open="${reconIndex}" class="h-5 px-1.5 rounded bg-rose-700 text-white text-[9.5px] hover:bg-rose-800">Approve now</button>
            </div>`) : exceedsTol ? '<div class="mt-1">✓ Approved by '+(recon.varianceApprover||'Manager')+(recon.varianceNote?' — '+recon.varianceNote:'')+'</div>' : ''}
        </div>`;
          }).join('')}
        </div>` : ''}
      <div class="flex items-center gap-1.5 mt-2">
        <button data-issue-material="${j.id}" data-issue-stage="${s}" data-issue-karigar="${name}" class="h-6 px-2 rounded border border-slate-200 text-[10.5px] text-slate-700 hover:bg-slate-50 flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> Issue Material</button>
        ${openIssues.length ? `<button data-reconcile-open="${j.id}" data-reconcile-stage="${s}" data-reconcile-karigar="${name}" class="h-6 px-2 rounded bg-blue-800 text-white text-[10.5px] hover:bg-blue-900">Receive &amp; Reconcile</button>` : ''}
      </div>
    </div>`;
  };

  return `
  <div class="border border-slate-200 rounded-md p-2.5 ${status==='current' ? 'ring-1 ring-blue-100' : ''}">
    <div class="flex items-center gap-2 mb-2">
      <span class="text-[12px] font-semibold text-slate-900">${STAGE_LABEL[s]}</span>
      ${pill(badgeLabel, badgeCls)}
      <div class="ml-auto flex items-center gap-1.5">
        ${status==='current' ? `<button data-job-action="advance" data-job-id="${j.id}" class="h-6 px-2 rounded bg-emerald-700 text-white text-[10.5px] hover:bg-emerald-800">Approve Stage</button>` : ''}
        <button data-assign-job="${j.id}" data-assign-stage="${s}" class="h-6 px-2 rounded border border-slate-200 text-[10.5px] text-blue-800 hover:bg-blue-50 flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> Add Karigar</button>
      </div>
    </div>
    ${names.length ? `<div class="grid grid-cols-2 gap-2">${names.map(karigarBlock).join('')}</div>` : `<div class="text-[11px] text-slate-400 py-1.5">Is stage ke liye abhi koi karigar assign nahi hai</div>`}
  </div>`;
}

function wireRowEvents(){
  document.querySelectorAll('[data-open-est]').forEach(el => el.addEventListener('click', () => { state.inspect = el.dataset.openEst; state.inspectType='estimate'; render(); }));
  document.querySelectorAll('[data-open-job]').forEach(el => el.addEventListener('click', () => { state.inspect = el.dataset.openJob; state.inspectType='job'; render(); }));
  document.querySelectorAll('[data-open-karigar]').forEach(el => el.addEventListener('click', () => { state.karigarFocus = el.dataset.openKarigar; render(); }));
  document.querySelectorAll('[data-karigar-back]').forEach(el => el.addEventListener('click', () => { state.karigarFocus = null; render(); }));

    const jobId = el.dataset.costingEditToggle;
    if(costingEditMode && costingInspectJob === jobId){ costingEditMode = false; costingEditDraft = null; render(); return; }
    costingInspectJob = jobId; costingEditMode = true; costingEditDraft = {};
    render();
  }));
  document.querySelectorAll('[data-ced]').forEach(el => el.addEventListener('input', (e) => {
    if(costingEditDraft) costingEditDraft[e.target.dataset.ced] = e.target.value;
  }));
  // Save: every touched cell is diffed against its resolved value BEFORE this edit session and,
  // if it actually changed, written into job.costingOverride AND appended to job.costingLog —
  // so every price/qty change made here is auditable, not just silently different next time.
  document.querySelectorAll('[data-costing-edit-save]').forEach(el => el.addEventListener('click', () => {
    const job = jobs.find(j => j.id === el.dataset.costingEditSave);
    if(!job || !costingEditDraft){ return; }
    const before = computeActualCosting(job.id);
    if(!job.costingOverride) job.costingOverride = { gold:{}, stones:{}, charges:{} };
    const ov = job.costingOverride;
    let changed = 0;
    Object.keys(costingEditDraft).forEach(path => {
      const raw = costingEditDraft[path];
      if(raw === '' || raw === undefined) return;
      const newVal = Number(raw);
      if(isNaN(newVal)) return;
      const parts = path.split('.');
      if(parts.length === 1){
        const oldVal = before[parts[0]];
        if(oldVal === undefined || Math.abs(oldVal-newVal) < 0.0001) return;
        ov[parts[0]] = newVal;
        logCostingChange(job, parts[0]==='profitPct' ? 'Profit %' : 'GST %', oldVal, newVal, 'pct');
        changed++;
      } else if(parts[0]==='gold' || parts[0]==='stones'){
        const idx = Number(parts[1]), fieldKey = parts[2];
        const line = (parts[0]==='gold' ? before.goldLines : before.stoneLines).find(l=>l.idx===idx);
        if(!line) return;
        const oldVal = line[fieldKey];
        if(oldVal === undefined || Math.abs(oldVal-newVal) < 0.0001) return;
        if(!ov[parts[0]][idx]) ov[parts[0]][idx] = {};
        ov[parts[0]][idx][fieldKey] = newVal;
        const label = (parts[0]==='gold' ? 'Gold-'+line.k : line.particular) + ' ' + fieldKey;
        logCostingChange(job, label, oldVal, newVal, fieldKey==='rate' ? 'money' : (fieldKey==='pcs' ? 'num' : 'wt'));
        changed++;
      } else if(parts[0]==='charges'){
        const chargeType = parts[1], fieldKey = parts[2];
        let oldVal;
        if(chargeType==='Making Charges') oldVal = before.actMaking;
        else if(chargeType==='Wastage Charges') oldVal = fieldKey==='wt' ? before.actWastageWt : before.actWastageRate;
        else oldVal = (before.otherChargeLines.find(c=>c.type===chargeType)||{}).amt;
        if(oldVal === undefined || Math.abs(oldVal-newVal) < 0.0001) return;
        if(!ov.charges[chargeType]) ov.charges[chargeType] = {};
        ov.charges[chargeType][fieldKey] = newVal;
        logCostingChange(job, chargeType+(fieldKey!=='amount'?' '+fieldKey:''), oldVal, newVal, fieldKey==='wt' ? 'wt' : 'money');
        changed++;
      }
    });
    toast(changed ? `${job.id} — ${changed} field${changed>1?'s':''} updated, timeline mein log ho gaya` : 'Koi value change nahi hui');
    costingEditMode = false; costingEditDraft = null; render();
  }));

function openPalette(){

  const filtered = PALETTE_ITEMS.filter(it => it.label.toLowerCase().includes(q.toLowerCase())).slice(0,8);
  document.getElementById('paletteResults').innerHTML = filtered.map((it,i) => `
    <button data-pi="${i}" class="w-full text-left px-3 h-8 flex items-center gap-2 hover:bg-slate-50 text-[12px]">
      <span class="text-slate-900">${it.label}</span>
      <span class="text-slate-400 text-[11px] ml-auto">${it.sub}</span>
    </button>`).join('') || `<div class="px-3 py-4 text-[12px] text-slate-400">No matches</div>`;
  document.querySelectorAll('[data-pi]').forEach(b => b.addEventListener('click', () => { filtered[+b.dataset.pi].action(); closePalette(); render(); }));

/* ============================================================
   PERSISTENCE — everything typed into this mockup (new estimates, job cards, material
   issues/returns, reconciliations, labour, invoices, item master, stock ledger) is saved to
   localStorage after every render and reloaded automatically on next open, so a page refresh
   or a re-delivered copy of this same file doesn't wipe out what's already been entered.
   ============================================================ */
const PERSIST_KEY = 'jewellery-erp-mockup-v1';
const PERSIST_ARRAYS = { karigars, estimates, jobs, materialIssues, reconciliations, qcRecords, invoices, productionReturns, labourEntries, itemMaster, cashLedger };
function saveAppState(){
  try{
    const data = {};
    Object.keys(PERSIST_ARRAYS).forEach(k => { data[k] = PERSIST_ARRAYS[k]; });
    data.stockLedger = stockLedger;
    data.savedAt = new Date().toISOString();
    localStorage.setItem(PERSIST_KEY, JSON.stringify(data));
  }catch(err){ /* localStorage unavailable in this browser context — app still runs, just in-memory only */ }
}
function loadAppState(){
  try{
    const raw = localStorage.getItem(PERSIST_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    Object.keys(PERSIST_ARRAYS).forEach(k => {
      if(Array.isArray(data[k])){ PERSIST_ARRAYS[k].length = 0; PERSIST_ARRAYS[k].push(...data[k]); }
    });
    if(data.stockLedger){
      if(Array.isArray(data.stockLedger.gold)){ stockLedger.gold.length = 0; stockLedger.gold.push(...data.stockLedger.gold); }
      if(Array.isArray(data.stockLedger.stones)){ stockLedger.stones.length = 0; stockLedger.stones.push(...data.stockLedger.stones); }
    }
    return true;
  }catch(err){ return false; /* corrupted/old-shape data — ignore and start from the seed data below */ }
}

/* ============================================================
   INIT
   ============================================================ */
loadAppState();
render();
